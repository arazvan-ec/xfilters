ontexto, hooks e integraciones externas.", "topic": "Programación & Dev", "tags": ["claude-code", "tutorial", "hooks", "context-management"], "author_handle": "ds_nana_", "author_name": "nana🦄", "created_at": "2026-04-26T17:28:00.000Z", "metrics": {"bookmarks": 4, "likes": 7, "quotes": 0, "replies": 0, "retweets": 2, "views": 348}}, {"id": "2048481249879314438", "url": "https://x.com/aiDotEngineer/status/2048481249879314438", "text": "🆕Collaborative AI Engineering: One Dev, Two Dozen Agents, Zero Alignment — @mappletons\n\nhttps://t.co/7SEayJwZLe\n\nAgentic engineering so far has been a solo story: one developer and a dozen agents moving at warp speed. But speed without thoughtful planning and team alignment is just wasting tokens. When everyone on a team is directing agents alone in their personal CLI tools with no shared context, you get duplicate work, conflicting changes, poorly-designed solutions, surprise features nobody else agreed to build, and everyone pulling in different directions. \n\nSerious software still requires serious collaboration. You need multiple perspectives and types of expertise to build great things. We need agentic environments where people can plan together, think critically together, and share the same context. In this talk I'll demo how we've tackled these design problems in Ace, a multiplayer agent environment from GitHub Next that uses real-time collaboration, proactive agents, and sandboxed micro VMs for rapid prototyping and exploration.", "summary": "Anuncio de la charla 'Collaborative AI Engineering: One Dev, Two Dozen Agents, Zero Alignment' de @mappletons, sobre Ace, un entorno multijugador de agentes de GitHub Next con colaboración en tiempo real y micro VMs en sandbox.", "topic": "IA & Machine Learning", "tags": ["ai-agents", "ingenieria-colaborativa", "github-next", "multiplayer", "charla"], "author_handle": "aiDotEngineer", "author_name": "AI Engineer", "created_at": "2026-04-26T19:16:03.000Z", "metrics": {"bookmarks": 72, "likes": 86, "quotes": 4, "replies": 3, "retweets": 12, "views": 29884}}, {"id": "2048486242321662189", "url": "https://x.com/dani_avila7/status/2048486242321662189", "text": "https://t.co/iWGhR4tZj0", "summary": "Enlace a un artículo de X (x.com/i/article) sin texto descriptivo adicional que explique su contenido.", "topic": "Otros", "tags": ["articulo", "x-com", "sin-contexto"], "author_handle": "dani_avila7", "author_name": "Daniel San", "created_at": "2026-04-26T19:35:53.000Z", "metrics": {"bookmarks": 3880, "likes": 1518, "quotes": 10, "replies": 14, "retweets": 182, "views": 444037}}, {"id": "2048486401105358933", "url": "https://x.com/itsalexvacca/status/2048486401105358933", "text": "https://t.co/BxYHp4nIiG", "summary": "Enlace a un artículo largo publicado en x.com por Alex Vacca, sin texto adicional que describa su contenido.", "topic": "Otros", "tags": ["articulo-x", "sin-descripcion", "alex-vacca"], "author_handle": "itsalexvacca", "author_name": "Alex Vacca", "created_at": "2026-04-26T19:36:31.000Z", "metrics": {"bookmarks": 2745, "likes": 934, "quotes": 6, "replies": 16, "retweets": 110, "views": 98256}}, {"id": "2048490818848075846", "url": "https://x.com/mattpocockuk/status/2048490818848075846", "text": "Nearly 23K stars for a collection of markdown files I wrote\n\nI guess they must be pretty good\n\nI want to invest more time in this repo. So, folks who starred it, what can I do to make these skills more obvious to you?\n\n- A docs site for the skills?\n- Send them to plugin marketplaces?\n\nHelp me help you\n\nhttps://t.co/64UuxC8V0T", "summary": "Matt Pocock celebra que su repositorio de skills (mattpocock/skills) llegó a casi 23K estrellas en GitHub y pregunta a la comunidad cómo hacer estos skills más visibles: ¿un sitio de documentación?, ¿enviarlos a marketplaces de plugins?", "topic": "Productividad & Herramientas", "tags": ["claude-skills", "github", "open-source", "documentacion"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-04-26T19:54:04.000Z", "metrics": {"bookmarks": 2708, "likes": 2407, "quotes": 8, "replies": 135, "retweets": 167, "views": 201235}}, {"id": "2048492731929149929", "url": "https://x.com/aparnadhinak/status/2048492731929149929", "text": "https://t.co/5Vk6U2wDxo", "summary": "Enlace a un artículo de X sin texto descriptivo que lo acompañe.", "topic": "Otros", "tags": ["articulo-x", "sin-contexto", "enlace"], "author_handle": "aparnadhinak", "author_name": "Aparna Dhinakaran", "created_at": "2026-04-26T20:01:41.000Z", "metrics": {"bookmarks": 1976, "likes": 783, "quotes": 9, "replies": 22, "retweets": 102, "views": 150783}}, {"id": "2048497322276065549", "url": "https://x.com/aakashgupta/status/2048497322276065549", "text": "If you want to get more out of Clade without hitting limits, read this.", "summary": "Recomienda leer un artículo con consejos para aprovechar más Claude sin alcanzar los límites de uso.", "topic": "Productividad & Herramientas", "tags": ["claude", "usage-limits", "tips"], "author_handle": "aakashgupta", "author_name": "Aakash Gupta", "created_at": "2026-04-26T20:19:55.000Z", "metrics": {"bookmarks": 476, "likes": 177, "quotes": 0, "replies": 5, "retweets": 21, "views": 68210}}, {"id": "2048626844694421842", "url": "https://x.com/steipete/status/2048626844694421842", "text": "Wanted a truly local storage for my tweets so built birdclaw. Imoorts your archive, backs it up on github, has jobs so you can import your x bookmarks daily (since they are not fully accessible via the api). \nhttps://t.co/4Nd1Ad0ZeY", "summary": "Peter Steinberger presenta 'birdclaw', una herramienta que crea almacenamiento local de tuits, importa el archivo de Twitter, hace copias de seguridad en GitHub y permite importar bookmarks de X diariamente.", "topic": "Programación & Dev", "tags": ["birdclaw", "twitter-archive", "backup", "github", "bookmarks"], "author_handle": "steipete", "author_name": "Peter Steinberger 🦞", "created_at": "2026-04-27T04:54:36.000Z", "metrics": {"bookmarks": 2576, "likes": 2292, "quotes": 24, "replies": 88, "retweets": 142, "views": 154917}}, {"id": "2048929452579799164", "url": "https://x.com/wsl8297/status/2048929452579799164", "text": "在 GitHub 上挖到一门很实用的开源课：Learn Harness Engineering，专门教你给 AI 编程助手搭一套更可靠的“工作台”。\n\n它把 AI 协作拆成五个关键机制：指令、状态、验证、范围、会话，让每次任务都可追踪、可续接、可验证，不再靠运气出结果。\n\nGitHub：https://t.co/G1kBghFqXg\n\n官网：https://t.co/6OHbxJcWz6\n\n课程结构很清晰：12 节理论 + 6 个实战项目，用同一个桌面应用贯穿推进，边做边演进。\n从最基础的对比实验起步，逐步把整套工作环境搭起来；每个项目的产出，直接接到下一个项目继续用，越做越稳。\n\n更贴心的是，它还提供可直接复用的模板文件：拷进自己的项目就能上手，不用完整学完，也能立刻提升 AI 的稳定性和可控性。\n\n如果你已经在用 Claude Code 或 Codex 做真实开发，却总觉得 AI 时好时坏、难以复现，这门课很值得花时间看看。", "summary": "El autor recomienda el curso open source 'Learn Harness Engineering' en GitHub, que enseña a construir un entorno de trabajo más fiable para asistentes de codificación con IA a través de 12 lecciones teóricas y 6 proyectos prácticos, cubriendo instrucciones, estado, verificación, alcance y sesión.", "topic": "IA & Machine Learning", "tags": ["harness-engineering", "claude-code", "codex", "curso", "agentes-ia"], "author_handle": "wsl8297", "author_name": "Joruno", "created_at": "2026-04-28T00:57:03.000Z", "metrics": {"bookmarks": 3475, "likes": 2054, "quotes": 8, "replies": 14, "retweets": 365, "views": 145883}}, {"id": "2049115357781098709", "url": "https://x.com/martinfowler/status/2049115357781098709", "text": "NEW POST\n\nThoughtworks internal IT use a workflow for agentic programming called Structured-Prompt-Driven Development (SPDD). @WeiZhang595190  and Jessie Jie Xia describe how this works with a simple example plus details in a github project. \n\nhttps://t.co/6cHnSPWr6L", "summary": "Martin Fowler presenta un nuevo artículo sobre Structured-Prompt-Driven Development (SPDD), un flujo de trabajo de programación agéntica usado internamente en Thoughtworks, descrito por Wei Zhang y Jessie Jie Xia.", "topic": "Programación & Dev", "tags": ["spdd", "programacion-agentica", "martin-fowler", "thoughtworks", "desarrollo-de-software"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-04-28T13:15:46.000Z", "metrics": {"bookmarks": 1404, "likes": 869, "quotes": 10, "replies": 25, "retweets": 123, "views": 95963}}, {"id": "2049139067359568032", "url": "https://x.com/mfpiccolo/status/2049139067359568032", "text": "https://t.co/NW1N0Q6DDG", "summary": "Enlace a un artículo de X sin texto descriptivo adicional en el tuit.", "topic": "Otros", "tags": ["sin-texto", "articulo-x", "enlace"], "author_handle": "mfpiccolo", "author_name": "Mike Piccolo", "created_at": "2026-04-28T14:49:59.000Z", "metrics": {"bookmarks": 2553, "likes": 948, "quotes": 30, "replies": 30, "retweets": 111, "views": 347044}}, {"id": "2049377456839168375", "url": "https://x.com/myfear/status/2049377456839168375", "text": "AI coding agents do not just need \"more context.\" In companies, they need approved context: internal frameworks, blueprints, best practices, runbooks, and security rules with owners and quality checks.\n\nI wrote about MCP servers as an enterprise knowledge layer, not just a docs search toy.\n\nhttps://t.co/TEqiN3TVCr\n\n#mcp #ai", "summary": "Argumenta que los agentes de codificación con IA en empresas necesitan 'contexto aprobado' (frameworks internos, blueprints, buenas prácticas, runbooks y reglas de seguridad) y enlaza un artículo sobre servidores MCP como capa de conocimiento empresarial.", "topic": "IA & Machine Learning", "tags": ["mcp", "contexto-empresarial", "agentes-ia", "conocimiento-corporativo"], "author_handle": "myfear", "author_name": "Markus Eisele", "created_at": "2026-04-29T06:37:15.000Z", "metrics": {"bookmarks": 33, "likes": 28, "quotes": 0, "replies": 4, "retweets": 6, "views": 2062}}, {"id": "2049472248806027440", "url": "https://x.com/manthanguptaa/status/2049472248806027440", "text": "https://t.co/Ao2BtfmkK5", "summary": "Tuit sin texto descriptivo; solo contiene un enlace corto sin contexto adicional que permita identificar su contenido.", "topic": "Otros", "tags": ["sin-contexto", "enlace"], "author_handle": "manthanguptaa", "author_name": "Manthan Gupta", "created_at": "2026-04-29T12:53:56.000Z", "metrics": {"bookmarks": 944, "likes": 669, "quotes": 2, "replies": 15, "retweets": 70, "views": 94552}}, {"id": "2049480328423608522", "url": "https://x.com/martinfowler/status/2049480328423608522", "text": "Fragments: updated guide on AI coding, video on harness engineering, how long should a function be, the problems of Software Brain and why AI is unpopular\n\nhttps://t.co/7jSOtMhEE8", "summary": "Martin Fowler enlaza otra recopilación de 'Fragments', con una guía actualizada sobre programación con IA, un video sobre 'harness engineering', la duración ideal de una función y una reflexión sobre por qué la IA es impopular.", "topic": "Programación & Dev", "tags": ["martin-fowler", "ai-coding", "harness-engineering", "ingenieria-de-software"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-04-29T13:26:02.000Z", "metrics": {"bookmarks": 278, "likes": 233, "quotes": 4, "replies": 1, "retweets": 33, "views": 28666}}, {"id": "2049482833111232694", "url": "https://x.com/tonygentilcore/status/2049482833111232694", "text": "https://t.co/z2qVEEVhv5", "summary": "Enlace a un artículo de X (x.com/i/article) sin texto descriptivo adicional.", "topic": "Otros", "tags": ["articulo", "x-com", "sin-contexto"], "author_handle": "tonygentilcore", "author_name": "Tony Gentilcore", "created_at": "2026-04-29T13:35:59.000Z", "metrics": {"bookmarks": 782, "likes": 359, "quotes": 5, "replies": 10, "retweets": 37, "views": 85687}}, {"id": "2049484890333393006", "url": "https://x.com/ai_rohitt/status/2049484890333393006", "text": "The creator of Claude Code teaches more about vibe-coding in 30 minutes than most tutorials do in hours. \n\nSave this — it'll change how you build forever. https://t.co/XiUS4mq4ed", "summary": "Recomienda un vídeo en el que el creador de Claude Code explica el 'vibe-coding' en 30 minutos, calificándolo de más útil que muchos tutoriales largos.", "topic": "Programación & Dev", "tags": ["claude-code", "vibe-coding", "video-tutorial", "tutorial-programacion"], "author_handle": "ai_rohitt", "author_name": "Rohit", "created_at": "2026-04-29T13:44:10.000Z", "metrics": {"bookmarks": 8729, "likes": 4087, "quotes": 18, "replies": 35, "retweets": 601, "views": 568931}}, {"id": "2049492169887748365", "url": "https://x.com/omarsar0/status/2049492169887748365", "text": "// Agentic Harness Engineering //\n\nPay attention to this one, AI devs.\n\n(bookmark it)\n\nMost coding-agent harnesses are still tuned by hand or brittle trial-and-error self-evolution.\n\nThis new work introduces Agentic Harness Engineering, a framework that makes harness evolution observable. They do this through three layers: components as revertible files, experience as condensed evidence from millions of trajectory tokens, and decisions as falsifiable predictions checked against task outcomes.\n\nEach edit becomes a contract you can verify or revert.\n\nResults: pass@1 on Terminal-Bench 2 climbs from 69.7% to 77.0% in ten iterations, beating human-designed Codex-CLI (71.9%) and self-evolving baselines like ACE and TF-GRPO.\n\nThe evolved harness also transfers across model families with +5.1 to +10.1 point gains, while using 12% fewer tokens than the seed on SWE-bench-verified.\n\nHarness work is the biggest hidden cost in most agent systems. This is the first credible recipe for letting the harness improve itself without drifting into noise.\n\nPaper: https://t.co/9fEgqwlTSf\n\nLearn to build effective AI agents in our academy: https://t.co/1e8RZKs4uX", "summary": "Elvis resume un paper sobre 'Agentic Harness Engineering', un framework que hace observable la evolución del harness de agentes de codificación y eleva el pass@1 en Terminal-Bench 2 del 69.7% al 77.0% en diez iteraciones, superando a Codex-CLI y a baselines auto-evolutivos.", "topic": "IA & Machine Learning", "tags": ["harness-engineering", "arxiv", "terminal-bench", "agentes-ia", "paper"], "author_handle": "omarsar0", "author_name": "elvis", "created_at": "2026-04-29T14:13:05.000Z", "metrics": {"bookmarks": 3041, "likes": 1593, "quotes": 10, "replies": 68, "retweets": 231, "views": 140831}}, {"id": "2049506974081953924", "url": "https://x.com/mattpocockuk/status/2049506974081953924", "text": "Here's the repo:\n\nhttps://t.co/sk0zh6Qitj", "summary": "Comparte el enlace a un repositorio de código, sin más texto de contexto.", "topic": "Programación & Dev", "tags": ["repositorio", "matt-pocock", "github"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-04-29T15:11:55.000Z", "metrics": {"bookmarks": 525, "likes": 271, "quotes": 0, "replies": 5, "retweets": 9, "views": 35524}}, {"id": "2049516788715827569", "url": "https://x.com/helloitsaustin/status/2049516788715827569", "text": "most growth marketers use AI to rewrite headlines and call it a day. here's how I actually use Claude on the growth marketing team at @AnthropicAI across chat, Claude Cowork, and Claude Code 👇 https://t.co/uHVosjt5bZ", "summary": "Austin Lau, del equipo de growth marketing de Anthropic, explica cómo usa Claude más allá de reescribir titulares, combinando el chat, Claude Cowork y Claude Code en su trabajo diario.", "topic": "Marketing & Redes", "tags": ["growth-marketing", "claude", "anthropic", "ai-marketing"], "author_handle": "helloitsaustin", "author_name": "austin lau", "created_at": "2026-04-29T15:50:55.000Z", "metrics": {"bookmarks": 3006, "likes": 1342, "quotes": 12, "replies": 54, "retweets": 122, "views": 143973}}, {"id": "2049523746910908886", "url": "https://x.com/TheRealAdamG/status/2049523746910908886", "text": "https://t.co/pmkDoTe9Ug\n\n**NEW: GPT-5.5 Prompting Guide**\n\n\"GPT-5.5 works best when prompts define the outcome and leave room for the model to choose an efficient solution path. Compared with earlier models, you can often use shorter, more outcome-oriented prompts: describe what good looks like, what constraints matter, what evidence is available, and what the final answer should contain.\n\nAvoid carrying over every instruction from an older prompt stack. Legacy prompts often over-specify the process because earlier models needed more help staying on track. With GPT-5.5, that can add noise, narrow the model’s search space, or lead to overly mechanical answers.\n\nFor more detail on GPT-5.5 behavior changes, start with the Using GPT-5.5 guide. This guide focuses on prompt changes that follow from those behavior changes.\n\nThe patterns here are starting points. Adapt them to your product surface, tools, evals, and user experience goals.\"", "summary": "Adam.GPT comparte la nueva 'GPT-5.5 Prompting Guide' de OpenAI, que recomienda prompts más orientados a resultados y menos prescriptivos que con modelos anteriores.", "topic": "IA & Machine Learning", "tags": ["gpt-5-5", "prompt-engineering", "openai", "guia-de-prompts"], "author_handle": "TheRealAdamG", "author_name": "Adam.GPT", "created_at": "2026-04-29T16:18:34.000Z", "metrics": {"bookmarks": 2811, "likes": 2368, "quotes": 23, "replies": 55, "retweets": 246, "views": 307807}}, {"id": "2049550904366629352", "url": "https://x.com/Suryanshti777/status/2049550904366629352", "text": "The person who runs 49 features. 48 hours. Zero lines written by hand.\n\nThat's what Anthropic's Head of Claude Code just pulled off.\n\nHe recorded the exact workflow. 30 minutes. Free.\n\nThe developers who watch this will build differently.\n\nThe ones who skip it will wonder why they're still slow.\nBookmark it for later", "summary": "El autor destaca que el Head of Claude Code de Anthropic implementó 49 funcionalidades en 48 horas sin escribir código a mano, y grabó el flujo de trabajo completo en un vídeo gratuito de 30 minutos.", "topic": "IA & Machine Learning", "tags": ["claude-code", "anthropic", "vibe-coding", "productividad"], "author_handle": "Suryanshti777", "author_name": "Suryansh Tiwari", "created_at": "2026-04-29T18:06:29.000Z", "metrics": {"bookmarks": 367, "likes": 121, "quotes": 0, "replies": 4, "retweets": 13, "views": 21185}}, {"id": "2049558513048015295", "url": "https://x.com/brada/status/2049558513048015295", "text": "Production-ready Claude API code, wherever you build.\nThe claude-api skill now ships in @coderabbitai, @jetbrains, @resolveai,  @warpdotdev and Claude Code - fewer errors, better caching, cleaner agent patterns, smoother model migrations.\nhttps://t.co/sPXC8qG1pk", "summary": "Brad Abrams anuncia que la skill 'claude-api' para escribir código listo para producción ya está disponible en CodeRabbit, JetBrains, Resolve AI, Warp y Claude Code, mejorando la caché y los patrones de agentes.", "topic": "Programación & Dev", "tags": ["claude-api", "skills", "integraciones", "desarrollo-de-agentes"], "author_handle": "brada", "author_name": "Brad Abrams", "created_at": "2026-04-29T18:36:43.000Z", "metrics": {"bookmarks": 27, "likes": 42, "quotes": 0, "replies": 0, "retweets": 6, "views": 4114}}, {"id": "2049561210593685876", "url": "https://x.com/Av1dlive/status/2049561210593685876", "text": "Andrej Karpathy : 10x engineers are normal. real agentic engineers are 100x\n\nthis guy just shipped the playbook to become 100x\n\ncontext engineering. tool design. orchestrator-subagent. evals. the harness mindset.\n\nwatch &amp; bookmark it for this weekend https://t.co/7qQNW8KJSN", "summary": "Avid destaca un video de Karpathy sobre cómo convertirse en un ingeniero '100x' mediante context engineering, diseño de herramientas, el patrón orquestador-subagente, evals y una mentalidad de harness.", "topic": "IA & Machine Learning", "tags": ["karpathy", "harness-engineering", "context-engineering", "agentes-ia"], "author_handle": "Av1dlive", "author_name": "Avid", "created_at": "2026-04-29T18:47:26.000Z", "metrics": {"bookmarks": 7594, "likes": 2907, "quotes": 8, "replies": 51, "retweets": 320, "views": 560332}}, {"id": "2049613859623677978", "url": "https://x.com/DeRonin_/status/2049613859623677978", "text": "Andrej Karpathy: \"90% of what AI twitter tells you to learn will be dead in 6 months\"\n\nHere are 10 things senior AI engineers stopped wasting time on:\n\n1. AutoGen / AG2: moved to community maintenance, releases stalled. dead for production\n\n2. CrewAI: demos well, breaks in production. engineers building real systems already moved off it\n\n3. Autonomous agent pitches: the AutoGPT / BabyAGI wave is dead in product form. the industry settled on supervised, bounded, evaluated agents\n\n4. Agent app stores / marketplaces: promised since 2023, zero enterprise traction\n\n5. SWE-bench leaderboard chasing: researchers proved nearly every public benchmark can be gamed without solving the underlying task\n\n6. Microsoft Semantic Kernel: unless you're locked into Microsoft enterprise stack, it's not where the ecosystem is heading\n\n7. DSPy: philosophical merit, niche audience. not a general agent framework\n\n8. Horizontal \"build any agent\" platforms: Google Agentspace, AWS Bedrock Agents, Copilot Studio. confusing, slow-shipping, the math still favors building yourself\n\n9. Per-seat SaaS pricing for agent products: market moved to outcome-based. per-seat is already dead\n\n10. The framework that went viral on HN this week: wait 6 months. if it still matters, it'll be obvious\n\nwhat actually compounds instead:\n\n- context engineering\n- tool design\n- orchestrator-subagent pattern\n- eval discipline\n- the harness mindset (harness > model, always)\n- MCP as the protocol layer\n\nbe few steps ahead than your competitors and outperform this market till it became mass-opinion\n\nstudy this.", "summary": "A partir de una cita de Karpathy, enumera 10 herramientas y prácticas de IA que los ingenieros senior ya han abandonado (AutoGen, CrewAI, agentes autónomos, Semantic Kernel, DSPy, entre otras) y qué sí compensa a largo plazo: ingeniería de contexto, diseño de herramientas, patrón orquestador-subagente, disciplina de evaluación y MCP.", "topic": "IA & Machine Learning", "tags": ["agentes-ia", "frameworks-ia", "karpathy", "mcp", "ingenieria-de-contexto"], "author_handle": "DeRonin_", "author_name": "Ronin", "created_at": "2026-04-29T22:16:38.000Z", "metrics": {"bookmarks": 5953, "likes": 2464, "quotes": 21, "replies": 90, "retweets": 270, "views": 415160}}, {"id": "2049901436918436249", "url": "https://x.com/cursor_ai/status/2049901436918436249", "text": "Our agent harness makes models inside Cursor faster, smarter, and more token-efficient.\n\nHere's how we test improvements to the harness, monitor and repair degradations, and customize it for different models.\n\nhttps://t.co/YIXcEZW6ud", "summary": "Cursor explica cómo mejoran su \"agent harness\" para hacerlo más rápido y eficiente en tokens, y cómo prueban, monitorean y personalizan sus mejoras para distintos modelos.", "topic": "IA & Machine Learning", "tags": ["cursor", "agent-harness", "ai-agents", "token-efficiency"], "author_handle": "cursor_ai", "author_name": "Cursor", "created_at": "2026-04-30T17:19:22.000Z", "metrics": {"bookmarks": 757, "likes": 1263, "quotes": 35, "replies": 52, "retweets": 101, "views": 200270}}, {"id": "2050454027897540635", "url": "https://x.com/Hi_Mrinal/status/2050454027897540635", "text": "A great read on ML model infrastructure from netflix\n\nhttps://t.co/KDGUs96k7o https://t.co/i8TXEygR9s", "summary": "Recomendación de lectura sobre infraestructura de modelos de machine learning en Netflix, con enlace al artículo técnico de su blog de ingeniería sobre enrutamiento en el servicio de modelos.", "topic": "IA & Machine Learning", "tags": ["netflix", "model-serving", "infraestructura-ml", "routing"], "author_handle": "Hi_Mrinal", "author_name": "Mrinal", "created_at": "2026-05-02T05:55:10.000Z", "metrics": {"bookmarks": 615, "likes": 596, "quotes": 1, "replies": 1, "retweets": 53, "views": 29852}}, {"id": "2050553191901667810", "url": "https://x.com/SebSmith1/status/2050553191901667810", "text": "great article by @kentcdodds and echos lot of what conclusions i’ve been drawing over the last 12 months. well worth a read\n\nhttps://t.co/uBSTqjYvvJ", "summary": "El autor recomienda un artículo de Kent C. Dodds que coincide con conclusiones propias sobre la evolución del rol del ingeniero de software.", "topic": "Programación & Dev", "tags": ["kent-c-dodds", "ingenieria-de-software", "articulo"], "author_handle": "SebSmith1", "author_name": "Seb", "created_at": "2026-05-02T12:29:13.000Z", "metrics": {"bookmarks": 80, "likes": 71, "quotes": 0, "replies": 1, "retweets": 7, "views": 10330}}, {"id": "2050588497241681962", "url": "https://x.com/bibryam/status/2050588497241681962", "text": "🌟Subagents vs Advisor Patterns in Claude Code 🌟 https://t.co/6hjqO32XuL", "summary": "Bilgin Ibryam comparte un artículo que compara los patrones de subagentes y de 'advisor' (asesor) en Claude Code.", "topic": "Programación & Dev", "tags": ["claude-code", "subagentes", "patrones-de-diseno", "arquitectura-de-agentes"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2026-05-02T14:49:30.000Z", "metrics": {"bookmarks": 142, "likes": 135, "quotes": 0, "replies": 0, "retweets": 14, "views": 6554}}, {"id": "2050593671326883974", "url": "https://x.com/svpino/status/2050593671326883974", "text": "30 agents every AI Engineer must build.\n\nThis is the most comprehensive and practical book on AI Engineering that I've ever seen.\n\nI can't think of a single use case that they didn't cover here:\n\n1. The autonomous decision-making agent\n2. The planning agent\n3. The memory-augmented agent\n4. The knowledge retrieval agent\n5. The document intelligence agent\n6. The scientific research agent\n7. The tool-using agent\n8. The agentic workflow system\n9. The data analysis agent\n10. The verification and validation agent\n11. The general problem solver agent\n12. The code generation agent\n13. The security-hardened agent\n14. The self-improving agent\n15. The conversational agent\n16. The content creation agent\n17. The recommendation agent\n18. The vision language agent\n19. The audio processing agent\n20. The physical world sensing agent\n21. The ethical reasoning agent\n22. The explainable agent\n23. The healthcare intelligence agent\n24. The scientific discovery agent\n25. The financial advisory agent\n26. The legal intelligence agent\n27. The education intelligence agent\n28. The collective intelligence agent\n29. The embodied intelligence agent\n30. The domain-transforming integration agent\n\nI also read 50 Algorithms Every Programmer Should Know by Imran. Same vibe.\n\nHere is the Amazon link: https://t.co/buLPqjToiu", "summary": "Santiago recomienda un libro que cataloga 30 tipos de agentes de IA que, según él, todo ingeniero de IA debería saber construir, y menciona también el libro '50 Algorithms Every Programmer Should Know'.", "topic": "IA & Machine Learning", "tags": ["libro-recomendado", "agentes-ia", "catalogo-de-agentes"], "author_handle": "svpino", "author_name": "Santiago", "created_at": "2026-05-02T15:10:04.000Z", "metrics": {"bookmarks": 6561, "likes": 4564, "quotes": 15, "replies": 92, "retweets": 749, "views": 259986}}, {"id": "2050622353118474414", "url": "https://x.com/aakashgupta/status/2050622353118474414", "text": "Every AI tool you use right now is stuck at week-one performance.\n\nCustom GPTs, Claude Projects, agent frameworks. Same prompt, same output, week 1 vs week 50. The skill files sit static while you re-explain your context every Monday. There is a hard ceiling: your prompts can only be as good as the day you wrote them.\n\nHermes broke that loop with one design choice. Every 15 tool calls, it pauses, reads what worked in the session, and rewrites the skill file. Same prompt next week. Different procedure underneath.\n\nThe numbers from my logs: 20 min for the competitive briefing in week one, 12 min by week four, 8 min by week six. I never edited the prompt. The agent rewrote its own procedure four times. By week six, the briefing was surfacing competitor patterns I had missed in three weeks of doing it manually.\n\nThis is what compounds. Static skills have a flat ceiling. Self-rewriting skills get sharper every session because they keep what worked and drop what didn't. The gap between someone running self-improving skills and someone running static prompts widens every week.\n\nThe other piece most PMs miss: the moat is local. Hermes runs Claude, GPT, Gemini, or Llama. Switch models tomorrow and your accumulated skill files come with you. Anthropic rate-limits you mid-launch, you have a fallback that kept its memory.\n\nFull setup, 3 SKILL files I am running, and the 30-day rollout in the deep dive.", "summary": "Explica cómo Hermes evita que los agentes de IA se estanquen reescribiendo automáticamente sus propios archivos de skill cada 15 llamadas a herramientas, mejorando el rendimiento semana a semana sin tocar el prompt.", "topic": "IA & Machine Learning", "tags": ["hermes", "skills-ia", "agentes-ia", "mejora-continua"], "author_handle": "aakashgupta", "author_name": "Aakash Gupta", "created_at": "2026-05-02T17:04:02.000Z", "metrics": {"bookmarks": 33, "likes": 19, "quotes": 0, "replies": 2, "retweets": 3, "views": 4467}}, {"id": "2050631735529095575", "url": "https://x.com/code_kartik/status/2050631735529095575", "text": "https://t.co/HZcci755lZ", "summary": "Enlace a un artículo de X (Twitter) sin texto descriptivo adicional.", "topic": "Otros", "tags": ["sin-contexto", "x-article", "enlace"], "author_handle": "code_kartik", "author_name": "Kartik", "created_at": "2026-05-02T17:41:19.000Z", "metrics": {"bookmarks": 2662, "likes": 1088, "quotes": 14, "replies": 34, "retweets": 115, "views": 172410}}, {"id": "2050648794640113947", "url": "https://x.com/kunchenguid/status/2050648794640113947", "text": "ok @steipete's acpx is a godsend https://t.co/jFuIzg7WWm\n\njust added it in gnhf v0.1.31, and boom - gnhf now supports almost any agent harness you can name\n\nfor anyone building bring-your-own-agent apps, highly recommend calling acpx instead of building your own abstraction https://t.co/5tCv1TtJ3M", "summary": "Kun Chen elogia 'acpx' de Peter Steinberger y explica que lo integró en la versión 0.1.31 de gnhf para dar soporte a prácticamente cualquier harness de agentes, recomendándolo frente a construir una abstracción propia.", "topic": "Programación & Dev", "tags": ["acpx", "agent-harness", "gnhf", "github", "herramientas-de-desarrollo"], "author_handle": "kunchenguid", "author_name": "Kun Chen", "created_at": "2026-05-02T18:49:06.000Z", "metrics": {"bookmarks": 710, "likes": 455, "quotes": 3, "replies": 8, "retweets": 23, "views": 64917}}, {"id": "2050670200702328890", "url": "https://x.com/dhh/status/2050670200702328890", "text": "We can just decide that our world should be different. That modern JavaScript can be made with #nobuild. That SaaS services can move out of the cloud. That Apple is not the end of history. https://t.co/DD1WRfvaZg", "summary": "DHH reflexiona sobre poder decidir un futuro tecnológico distinto: JavaScript moderno sin build (#nobuild), servicios SaaS fuera de la nube, y cuestionando el dominio de Apple.", "topic": "Programación & Dev", "tags": ["nobuild", "javascript", "dhh", "filosofia-tecnologica"], "author_handle": "dhh", "author_name": "DHH", "created_at": "2026-05-02T20:14:10.000Z", "metrics": {"bookmarks": 605, "likes": 2410, "quotes": 30, "replies": 115, "retweets": 136, "views": 240753}}, {"id": "2050675029948723570", "url": "https://x.com/FredKSchott/status/2050675029948723570", "text": "Blown away by the response to https://t.co/oGh1BOOkkh over the last 24hr. Feels like we're onto something special here. \n\nGrateful to everyone who's tried it, shared it, or sent feedback. We're already on PR #35... 😅", "summary": "El autor celebra la gran acogida recibida en las últimas 24 horas por su proyecto Flue Framework, que ya acumula 35 pull requests.", "topic": "Programación & Dev", "tags": ["flue-framework", "framework", "open-source", "lanzamiento"], "author_handle": "FredKSchott", "author_name": "fks", "created_at": "2026-05-02T20:33:21.000Z", "metrics": {"bookmarks": 166, "likes": 429, "quotes": 2, "replies": 17, "retweets": 13, "views": 21022}}, {"id": "2050676549960274066", "url": "https://x.com/aakashgupta/status/2050676549960274066", "text": "Andrew Chen just called PM the most important role in tech again.\n\nHis argument in one line: when anyone can build, the person who decides WHAT to build becomes the bottleneck.\n\nBoris Cherny’s Claude Code team at Anthropic shows what this looks like in practice. They ship hundreds of prototypes before committing to a feature. Boris personally runs 5 parallel Claude instances and ships 20-30 PRs a day. The team built Cowork, a full product for non-engineers, in about 10 days. Productivity per engineer grew 70% even as Anthropic tripled headcount.\n\nThe cost of building dropped through the floor. The cost of picking the right thing didn’t.\n\nAnthropic’s PMs don’t even write traditional PRDs anymore. They review working software at 9am, kill 80% of it by noon, ship the rest by end of week. Pattern-matching across user research and technical feasibility while staring at a working prototype.\n\nThis is why AI PM offers at OpenAI, Anthropic, and Google DeepMind now run past $1M total comp. Anyone can build. Almost nobody can look at 15 working prototypes and call the 3 worth scaling. That judgment didn’t matter as much when shipping took 6 weeks. It matters enormously when shipping takes 45 minutes.\n\nAndrew nailed the diagnosis. The harder question for every PM: can I be the one who picks?\n\nHere’s how to build the muscle:\n\n1. Modern PRD guide: https://t.co/9ivvVUmZfs\n2. AI Prototyping tutorial: https://t.co/E36b6PG7u0\n3. AI Roadmap: https://t.co/PyoqTGjGdM\n4. PM Operating System: https://t.co/vDapougi85\n5. Learn this live in my cohort: https://t.co/goFNR9uPjQ\n\nThe bottleneck moved. The pay moved with it.", "summary": "Aakash Gupta argumenta que el product manager se vuelve el rol clave en la era de la IA, usando como ejemplo al equipo de Claude Code de Anthropic (liderado por Boris Cherny), que construyó el producto Cowork en unos 10 días y aumentó la productividad por ingeniero un 70%.", "topic": "IA & Machine Learning", "tags": ["product-management", "claude-code", "anthropic", "boris-cherny", "cowork"], "author_handle": "aakashgupta", "author_name": "Aakash Gupta", "created_at": "2026-05-02T20:39:23.000Z", "metrics": {"bookmarks": 105, "likes": 64, "quotes": 1, "replies": 3, "retweets": 10, "views": 8663}}, {"id": "2050677399248138417", "url": "https://x.com/_avichawla/status/2050677399248138417", "text": "Sub-Agents vs Agent Teams in Claude Code:\n\nSub-agents get their own system prompt, their own tool set, and a clean context window. They report back to the parent and terminate.\n\nAgent teams get all of that plus three things sub-agents don't have:\n- a shared task list with dependency tracking\n- peer-to-peer messaging between teammates\n- persistent context that accumulates over time.\n\nI published an article today that dives into a lot more detail.\n\nRead it below.", "summary": "Compara sub-agentes y equipos de agentes en Claude Code: los sub-agentes tienen su propio prompt, herramientas y contexto limpio, mientras que los equipos de agentes añaden lista de tareas compartida, mensajería entre pares y contexto persistente.", "topic": "Programación & Dev", "tags": ["claude-code", "subagentes", "agent-teams", "arquitectura-de-agentes"], "author_handle": "_avichawla", "author_name": "Avi Chawla", "created_at": "2026-05-02T20:42:46.000Z", "metrics": {"bookmarks": 422, "likes": 358, "quotes": 2, "replies": 16, "retweets": 77, "views": 44519}}, {"id": "2050750335208046827", "url": "https://x.com/kristianfreeman/status/2050750335208046827", "text": "replicate skills are a non-trivial addition to my agent's toolkit. i used to do this prompt-by-prompt in replicate webui, now the agent prompts, re-prompts, optimizes etc directly from replicate output\n\nhttps://t.co/qsVyoVRhmC", "summary": "Comenta que las \"replicate skills\" son una incorporación útil al toolkit de su agente, que ahora puede invocar, reintentar y optimizar directamente a partir de la salida de Replicate.", "topic": "IA & Machine Learning", "tags": ["replicate", "ai-agents", "skills", "automation"], "author_handle": "kristianfreeman", "author_name": "Kristian Freeman", "created_at": "2026-05-03T01:32:35.000Z", "metrics": {"bookmarks": 23, "likes": 23, "quotes": 0, "replies": 0, "retweets": 3, "views": 1590}}, {"id": "2050789469910093910", "url": "https://x.com/rubenhassid/status/2050789469910093910", "text": "How to duplicate yourself into Claude in a weekend: \n\n(even if you've never written a prompt before)\n\n1. Download the desktop app.\n☑ Go to claude .com/download\n☑ Set Opus 4.7 as default\n☑ Turn ON Extended Thinking\n\n2. Open Cowork mode.\n☑ Cowork = where your voice lives\n☑ Click the top left tab\n☑ Create your \"Voice\" folder inside\n\n3. Install Wispr Flow (it's free).\n☑ Turns your voice → text\n☑ Voice = faster and more honest\n☑ Typing kills the truth.\n\n4. Run the interview.\n☑ Paste Prompt 1 from https://t.co/LyV7feh2TK.\n☑ 100 questions, 7 categories\n☑ Push past every vague answer\n\n5. Compress the dump.\n☑ Paste prompt 2 from https://t.co/LyV7feh2TK.\n☑ 20K words → 4K tokens\n☑ Save as [your_name] .md\n\n6. Test it in a blank chat.\n☑ Open a fresh Claude chat\n☑ Run a prompt only you would write\n☑ If it sounds like you → ship it\n\n7. Drop it into Cowork.\n☑ Move [your_name] .md into your folder\n☑ Claude now reads it on every turn\n☑ Every draft = your voice, automatically\n\n8. Port it everywhere.\n☑ Upload to ChatGPT, Grok, Gemini\n☑ Same file = same voice in every AI\n☑ Hand it to your team or ghostwriter\n\n9. Edit it forever.\n☑ Install Obsidian (free)\n☑ Open Cowork as a vault\n☑ Update as your taste shifts\n\nFull guide + prompts at https://t.co/LyV7feh2TK.\n\n(save this to clone yourself into any AI)", "summary": "Guía de Ruben Hassid para 'clonar tu voz' en Claude durante un fin de semana: usar el modo Cowork, transcribir entrevistas por voz con Wispr Flow, comprimir las respuestas en un archivo de texto y cargarlo para que Claude escriba con tu estilo en cualquier IA.", "topic": "Productividad & Herramientas", "tags": ["claude-ai", "cowork", "personalizacion-ia", "prompt-engineering", "wispr-flow"], "author_handle": "rubenhassid", "author_name": "Ruben Hassid", "created_at": "2026-05-03T04:08:06.000Z", "metrics": {"bookmarks": 11202, "likes": 4890, "quotes": 34, "replies": 98, "retweets": 634, "views": 710798}}, {"id": "2050801846269489650", "url": "https://x.com/kentcdodds/status/2050801846269489650", "text": "@Grady_Booch This is the big secret to gaining understanding. I teach so I can solidify my own understanding. https://t.co/76Ce9sb89s", "summary": "Kent C. Dodds responde a Grady Booch que enseñar es la manera de solidificar la propia comprensión de un tema.", "topic": "Productividad & Herramientas", "tags": ["aprendizaje", "ensenanza", "kent-c-dodds", "desarrollo-personal"], "author_handle": "kentcdodds", "author_name": "Kent C. Dodds 🏹", "created_at": "2026-05-03T04:57:16.000Z", "metrics": {"bookmarks": 9, "likes": 11, "quotes": 0, "replies": 0, "retweets": 1, "views": 1239}}, {"id": "2050818637783789928", "url": "https://x.com/QingQ77/status/2050818637783789928", "text": "把单个 Claude Code 会话组织成完整的游戏开发工作室，用49个专职AI代理和72个工作流技能替代无结构的单助手模式。\n\nhttps://t.co/OA6tQocRFV\n\n一套 Claude Code 模板，49个代理按导演、主管、专员三级分工，72个斜杠命令管从脑暴到上线。代理之间垂直派活、横向商量，但拍板的始终是你——它们只出方案不替你做主。12个 Hook 自动卡提交校验，11条规则按目录管编码风格。", "summary": "Presenta una plantilla para Claude Code que organiza una sola sesión como un estudio completo de desarrollo de videojuegos, con 49 agentes de IA especializados y 72 habilidades de flujo de trabajo jerarquizados en tres niveles, más 12 hooks de validación automática.", "topic": "Programación & Dev", "tags": ["claude-code", "desarrollo-de-videojuegos", "agentes-ia", "plantilla", "automatizacion"], "author_handle": "QingQ77", "author_name": "Geek Lite", "created_at": "2026-05-03T06:04:00.000Z", "metrics": {"bookmarks": 27, "likes": 25, "quotes": 0, "replies": 2, "retweets": 3, "views": 2365}}, {"id": "2050830626157482321", "url": "https://x.com/srishticodes/status/2050830626157482321", "text": "This CLAUDE.md turns Claude Code into a senior engineer who never forgets your standards.\n\nBoris Cherny (creator of Claude Code at Anthropic) shared the internal workflows his team actually uses daily.\n\nSomeone turned those X threads into a structured file you can drop into any project.\n\nWhat’s inside:\n\n> Subagent orchestration\n> Verification gates before marking tasks done\n> Autonomous bug fixing loops\n> Self-improving rules from your own corrections\n\nThat last one is the whole game.\n\nEvery time you correct Claude, the rule gets encoded permanently.\n\n> Next session it doesn’t repeat the mistake.\n> Next month it matches how you think.\n> Next year you’re not managing Claude. It’s working like someone who’s been on your team for years.\n\nDrop it in any project. Start today.", "summary": "Srishti describe un archivo CLAUDE.md, creado a partir de los hilos de Boris Cherny (creador de Claude Code), que incluye orquestación de subagentes, verificación antes de marcar tareas como completas y reglas que se autocorrigen con el feedback del usuario.", "topic": "Productividad & Herramientas", "tags": ["claude-code", "claude-md", "boris-cherny", "subagentes", "flujo-de-trabajo"], "author_handle": "srishticodes", "author_name": "Srishti", "created_at": "2026-05-03T06:51:38.000Z", "metrics": {"bookmarks": 3795, "likes": 2106, "quotes": 3, "replies": 48, "retweets": 262, "views": 154306}}, {"id": "2050852711902425382", "url": "https://x.com/AhmedHemaz/status/2050852711902425382", "text": "The one agent skill that will completely change how you work with coding agents is \n/grill-me\n\nI’ve been using it for a while now and man it’s insanely good\n\nCheck also others skills\nLink: https://t.co/867R1cBJEA", "summary": "Recomienda la skill de agente '/grill-me' como algo que cambia por completo la forma de trabajar con agentes de codificación, y enlaza otras skills en un repositorio de GitHub.", "topic": "Programación & Dev", "tags": ["claude-skills", "grill-me", "agentes-ia", "github"], "author_handle": "AhmedHemaz", "author_name": "Mishtar", "created_at": "2026-05-03T08:19:24.000Z", "metrics": {"bookmarks": 43, "likes": 33, "quotes": 0, "replies": 3, "retweets": 1, "views": 2996}}, {"id": "2050852962998657477", "url": "https://x.com/tom_doerr/status/2050852962998657477", "text": "Knowledge graph for codebases written in markdown\n\nhttps://t.co/ypwXkhyRLQ https://t.co/glnSEcR0SJ", "summary": "Comparte un proyecto open source que genera un grafo de conocimiento de bases de código, representado en formato markdown.", "topic": "Programación & Dev", "tags": ["knowledge-graph", "codebase-analysis", "markdown", "open-source"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-05-03T08:20:24.000Z", "metrics": {"bookmarks": 366, "likes": 294, "quotes": 1, "replies": 4, "retweets": 25, "views": 18487}}, {"id": "2050854100271780070", "url": "https://x.com/nihaliscoding/status/2050854100271780070", "text": "https://t.co/SxbQVTQ2mN  is the best agent managing work-tool i have used ever. \nThe ease of spinning up work trees and managing agents is fucking unparalleled , the ones managing it have all my respect", "summary": "El autor elogia una herramienta de gestión de trabajo con agentes de IA (enlazada en super.engineering), destacando lo fácil que resulta crear worktrees y gestionar agentes con ella.", "topic": "Programación & Dev", "tags": ["super-engineering", "git-worktrees", "gestion-de-agentes", "herramientas-de-desarrollo"], "author_handle": "nihaliscoding", "author_name": "N!hal", "created_at": "2026-05-03T08:24:55.000Z", "metrics": {"bookmarks": 42, "likes": 42, "quotes": 0, "replies": 0, "retweets": 1, "views": 3619}}, {"id": "2050876479731278113", "url": "https://x.com/robert_lauko/status/2050876479731278113", "text": "See the top ranked papers in AI, ML, Robotics, Quantum Physics, and more on @kurateorg. Hundreds of arXiv preprints ranked daily by scientific impact through pairwise tournaments judged by Claude, GPT, and Gemini.", "summary": "Robert Lauko presenta Kurate, una plataforma que clasifica diariamente los preprints más relevantes de arXiv en IA, ML, robótica y física cuántica mediante torneos de comparación por pares evaluados por Claude, GPT y Gemini.", "topic": "IA & Machine Learning", "tags": ["arxiv", "llm-judge", "investigacion-cientifica", "ranking-de-papers"], "author_handle": "robert_lauko", "author_name": "Robert Lauko", "created_at": "2026-05-03T09:53:50.000Z", "metrics": {"bookmarks": 13217, "likes": 26965, "quotes": 69, "replies": 655, "retweets": 2914, "views": 47602814}}, {"id": "2050878045750276268", "url": "https://x.com/simonbrown/status/2050878045750276268", "text": "Spec-driven development makes very little sense to me.\n\nThe software development industry has repeatedly shown that devs don't like writing docs, often saying \"it's tedious and time-consuming; I'd rather be coding\".\n\n - How will this turn out to be different?\n - Why automate the fun part (coding) and force devs to write docs instead?\n\nhttps://t.co/CYxnCgeBmp", "summary": "Simon Brown cuestiona el sentido del 'spec-driven development', argumentando que automatiza la parte más divertida (programar) y obliga a los desarrolladores a escribir documentación, algo que históricamente no les gusta.", "topic": "Programación & Dev", "tags": ["spec-driven-development", "documentacion", "opinion", "desarrollo-de-software"], "author_handle": "simonbrown", "autho
