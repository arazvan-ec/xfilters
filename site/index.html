<script type="application/json" id="bookmarks-data">[{"id": "1549333232943894529", "url": "https://x.com/bibryam/status/1549333232943894529", "text": "Top 10 Architecture Characteristics Cheatsheet\nhttps://t.co/WrozRsKeQQ", "summary": "Comparte un enlace a una chuleta (cheatsheet) sobre las 10 principales características de arquitectura de software, es decir, los requisitos no funcionales más importantes.", "topic": "Programación & Dev", "tags": ["arquitectura-software", "cheatsheet", "requisitos-no-funcionales", "ingenieria-software"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2022-07-19T10:00:02.000Z", "metrics": {"bookmarks": 146, "likes": 446, "quotes": 1, "replies": 1, "retweets": 109, "views": 0}}, {"id": "2037617918645809394", "url": "https://x.com/omarsar0/status/2037617918645809394", "text": "NEW AI report from Google.\n\nEvery prior intelligence explosion in human history was social, not individual.\n\nThese authors make the case that the AI \"singularity\" framed as a single superintelligent mind bootstrapping to godlike intelligence is fundamentally wrong.\n\nThis is directly relevant to anyone designing multi-agent systems.\n\nThey observe that frontier reasoning models like DeepSeek-R1 spontaneously develop internal \"societies of thought,\" multi-agent debates among cognitive perspectives, through RL alone.\n\nThe path forward is human-AI configurations and agent institutions, not bigger monolithic oracles.\n\nThis reframes AI scaling strategy from \"build bigger models\" to \"compose richer social systems.\"\n\nIt argues governance of AI agents should follow institutional design principles, checks and balances, role protocols, rather than individual alignment.\n\nPaper: https://t.co/bfwrnbkY2y\n\nLearn to build effective AI agents in our academy: https://t.co/1e8RZKs4uX", "summary": "Resume un nuevo informe de Google que sostiene que la \"singularidad\" de la IA no será una mente superinteligente única, sino sistemas ent Project to Build this Weekend:\n\nBuild a Multi-Tool AI Agent from Scratch.\nhttps://t.co/nBEaPOWccC", "summary": "Propone un proyecto de fin de semana para construir desde cero un agente de IA con múltiples herramientas, enlazando a un tutorial paso a paso.", "topic": "IA & Machine Learning", "tags": ["ai-agents", "tutorial", "multi-tool-agent", "proyecto-practico"], "author_handle": "amankk_9", "author_name": "Aman Kharwal", "created_at": "2026-03-28T16:55:52.000Z", "metrics": {"bookmarks": 54, "likes": 52, "quotes": 0, "replies": 3, "retweets": 6, "views": 2308}}, {"id": "2038384866446696597", "url": "https://x.com/unclebobmartin/status/2038384866446696597", "text": "I've been using Claude for the last few days.  It seems to me that Codex is a bit more competent, but Claude is a bit more diligent.  I wonder if that even makes any sense.", "summary": "Uncle Bob Martin compara su experiencia usando Claude y Codex: le parece que Codex es algo más competente, pero Claude resulta más diligente.", "topic": "IA & Machine Learning", "tags": ["claude", "codex", "comparativa-llm", "coding-agents"], "author_handle": "unclebobmartin", "author_name": "Uncle Bob Martin", "created_at": "2026-03-29T22:36:38.000Z", "metrics": {"bookmarks": 9, "likes": 106, "quotes": 2, "replies": 37, "retweets": 5, "views": 17897}}, {"id": "2038420699459752092", "url": "https://x.com/GeoffreyHuntley/status/2038420699459752092", "text": "https://t.co/lXeKrFSPPB", "summary": "Enlace a un documento en PDF (model-engineering.info) sin texto descriptivo adicional.", "topic": "IA & Machine Learning", "tags": ["paper", "model-engineering", "investigacion-ia", "pdf"], "author_handle": "GeoffreyHuntley", "author_name": "geoff", "created_at": "2026-03-30T00:59:01.000Z", "metrics": {"bookmarks": 46, "likes": 22, "quotes": 0, "replies": 1, "retweets": 2, "views": 3820}}, {"id": "2038454336355999749", "url": "https://x.com/bcherny/status/2038454336355999749", "text": "I wanted to share a bunch of my favorite hidden and under-utilized features in Claude Code. I'll focus on the ones I use the most.\n\nHere goes.", "summary": "Boris Cherny, creador de Claude Code, anuncia un hilo con sus funciones ocultas y poco utilizadas favoritas de la herramienta.", "topic": "Programación & Dev", "tags": ["claude-code", "productividad", "tips", "cli"], "author_handle": "bcherny", "author_name": "Boris Cherny", "created_at": "2026-03-30T03:12:41.000Z", "metrics": {"bookmarks": 51743, "likes": 23126, "quotes": 437, "replies": 545, "retweets": 2508, "views": 3961372}}, {"id": "2038608435105726862", "url": "https://x.com/dabit3/status/2038608435105726862", "text": "https://t.co/mpQSGFPKwu", "summary": "Enlace a un artículo de X (Twitter) compartido por Nader Dabit, sin texto descriptivo adicional.", "topic": "Otros", "tags": ["enlace-sin-texto", "articulo-x", "nader-dabit"], "author_handle": "dabit3", "author_name": "nader dabit", "created_at": "2026-03-30T13:25:01.000Z", "metrics": {"bookmarks": 358, "likes": 229, "quotes": 5, "replies": 9, "retweets": 19, "views": 38084}}, {"id": "2038628403532759539", "url": "https://x.com/coopTilleuls/status/2038628403532759539", "text": "Introducing Ember v1.0, the ultimate open source monitoring companion for @caddyserver &amp; FrankenPHP. Stop configuring dashboards, start observing ⬇️ \nhttps://t.co/zKtXv58SeX https://t.co/84OEVUWWfe", "summary": "Les-Tilleuls.coop presenta Ember v1.0, una herramienta open source de monitorización en tiempo real para Caddy y FrankenPHP, con enlace a un artículo explicativo en su blog.", "topic": "Programación & Dev", "tags": ["ember", "caddy", "frankenphp", "monitorizacion", "open-source"], "author_handle": "coopTilleuls", "author_name": "Les-Tilleuls.coop", "created_at": "2026-03-30T14:44:21.000Z", "metrics": {"bookmarks": 40, "likes": 88, "quotes": 1, "replies": 1, "retweets": 14, "views": 4638}}, {"id": "2038661433626333649", "url": "https://x.com/itsolelehmann/status/2038661433626333649", "text": "https://t.co/LPpbf2ZJny", "summary": "Enlace a un artículo largo publicado en x.com por Ole Lehmann, sin texto adicional que describa su contenido.", "topic": "Otros", "tags": ["articulo-x", "sin-descripcion", "ole-lehmann"], "author_handle": "itsolelehmann", "author_name": "Ole Lehmann", "created_at": "2026-03-30T16:55:36.000Z", "metrics": {"bookmarks": 8660, "likes": 2348, "quotes": 55, "replies": 72, "retweets": 225, "views": 1610953}}, {"id": "2038849654423798197", "url": "https://x.com/karpathy/status/2038849654423798197", "text": "New supply chain attack this time for npm axios, the most popular HTTP client library with 300M weekly downloads.\n\nScanning my system I found a use imported from googleworkspace/cli from a few days ago when I was experimenting with gmail/gcal cli. The installed version (luckily) resolved to an unaffected 1.13.5, but the project dependency is not pinned, meaning that if I did this earlier today the code would have resolved to latest and I'd be pwned.\n\nIt's possible to personally defend against these to some extent with local settings e.g. release-age constraints, or containers or etc, but I think ultimately the defaults of package management projects (pip, npm etc) have to change so that a single infection (usually luckily fairly temporary in nature due to security scanning) does not spread through users at random and at scale via unpinned dependencies.\n\nMore comprehensive article:\nhttps://t.co/EJAZbqAPIQ", "summary": "Karpathy alerta sobre un ataque a la cadena de suministro en el paquete npm de axios (300M de descargas semanales) y advierte que las dependencias no fijadas (unpinned) pueden hacer que un proyecto resuelva a una versión maliciosa; enlaza un artículo con más detalles del incidente.", "topic": "Programación & Dev", "tags": ["seguridad", "npm", "axios", "supply-chain-attack", "dependencias"], "author_handle": "karpathy", "author_name": "Andrej Karpathy", "created_at": "2026-03-31T05:23:32.000Z", "metrics": {"bookmarks": 4244, "likes": 10502, "quotes": 215, "replies": 565, "retweets": 1109, "views": 1595488}}, {"id": "2038911973975601275", "url": "https://x.com/vineetwts/status/2038911973975601275", "text": "I created documentation over Claude Code's Codebase, which explains\n\n- Its pipeline\n- How it works\n- How it handles Context\n- How it handles Memory\n&amp; More\n\nRead it here - https://t.co/GngrSvWAmh https://t.co/zyHyj5z2a7", "summary": "El autor creó documentación sobre la base de código de Claude Code, explicando su pipeline, funcionamiento, manejo de contexto y memoria, publicada en Mintlify.", "topic": "Programación & Dev", "tags": ["claude-code", "documentacion", "arquitectura", "gestion-de-contexto", "memoria"], "author_handle": "vineetwts", "author_name": "V", "created_at": "2026-03-31T09:31:10.000Z", "metrics": {"bookmarks": 8349, "likes": 5908, "quotes": 125, "replies": 153, "retweets": 639, "views": 1229858}}, {"id": "2038924027411222533", "url": "https://x.com/himanshustwts/status/2038924027411222533", "text": "Based on everything explored in the source code, here's the full technical recipe behind Claude Code's memory architecture:\n\n[shared by claude code]\n\nClaude Code’s memory system is actually insanely well-designed. It isn't like  “store everything” but constrained, structured and self-healing memory.\n\nThe architecture is doing a few very non-obvious things:\n\n> Memory = index, not storage\n+ MEMORY.md is always loaded, but it’s just pointers (~150 chars/line)\n+ actual knowledge lives outside, fetched only when needed\n\n> 3-layer design (bandwidth aware)\n + index (always)\n + topic files (on-demand)\n+ transcripts (never read, only grep’d)\n\n> Strict write discipline\n +  write to file → then update index\n + never dump content into the index\n +  prevents entropy / context pollution\n\n> Background “memory rewriting” (autoDream)\n +  merges, dedupes, removes contradictions\n +  converts vague → absolute\n +  aggressively prunes\n +  memory is continuously edited, not appended\n\n> Staleness is first-class\n + if memory ≠ reality → memory is wrong\n +  code-derived facts are never stored\n +  index is forcibly truncated\n\n> Isolation matters\n + consolidation runs in a forked subagent\n + limited tools → prevents corruption of main context\n\n> Retrieval is skeptical, not blind\n +  memory is a hint, not truth\n +  model must verify before using\n\n> What they don’t store is the real insight\n +  no debugging logs, no code structure, no PR history\n +  if it’s derivable, don’t persist it", "summary": "Describe en detalle la arquitectura de memoria de Claude Code a partir del código fuente: un índice ligero siempre cargado, archivos temáticos a demanda, reescritura en segundo plano (\"autoDream\") y aislamiento del proceso de consolidación.", "topic": "Programación & Dev", "tags": ["claude-code", "memory-architecture", "llm-agents", "context-management"], "author_handle": "himanshustwts", "author_name": "himanshu", "created_at": "2026-03-31T10:19:04.000Z", "metrics": {"bookmarks": 8381, "likes": 6341, "quotes": 96, "replies": 151, "retweets": 692, "views": 834687}}, {"id": "2038970160103518619", "url": "https://x.com/dunglas/status/2038970160103518619", "text": "I've just dramatically improved my \"Symfony Docker\" project.\n\nIt now supports Dev Containers, autonomous (YOLO) coding agents such as Claude Code, Xdebug out of the box, instantaneous hot reloading with FrankenPHP, and slim, rootless images for production. 🐘\n\nI presented these features at @symfony_live Paris. Here is the detailed breakdown and the slides from my talk: https://t.co/eCEg48MoYt", "summary": "Kévin Dunglas anuncia mejoras importantes en su proyecto Symfony Docker: soporte para Dev Containers, agentes de código autónomos como Claude Code, Xdebug integrado y recarga en caliente instantánea con FrankenPHP; incluye el resumen de su charla en Symfony Live Paris.", "topic": "Programación & Dev", "tags": ["symfony", "docker", "frankenphp", "claude-code", "devcontainers"], "author_handle": "dunglas", "author_name": "Kévin Dunglas", "created_at": "2026-03-31T13:22:23.000Z", "metrics": {"bookmarks": 45, "likes": 103, "quotes": 0, "replies": 1, "retweets": 14, "views": 4397}}, {"id": "2039001221113983031", "url": "https://x.com/martinfowler/status/2039001221113983031", "text": "NEW POST\n\nThe quality of what AI coding assistants produce depends on how well the prompter articulates team standards. @techygarg proposes treating such instructions as infrastructure: versioned, reviewed, and shared artifacts.\n\nhttps://t.co/fqAeB6irlB", "summary": "Martin Fowler comparte un artículo de @techygarg que propone tratar las instrucciones de estándares de equipo para asistentes de codificación con IA como infraestructura versionada, revisada y compartida.", "topic": "IA & Machine Learning", "tags": ["ai-coding-assistants", "estandares-de-equipo", "prompt-engineering", "martin-fowler"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-03-31T15:25:48.000Z", "metrics": {"bookmarks": 481, "likes": 405, "quotes": 2, "replies": 16, "retweets": 55, "views": 34404}}, {"id": "2039002789666562165", "url": "https://x.com/lennysan/status/2039002789666562165", "text": "OpenClaw: The complete guide\n\n@ClaireVo has just put together the definitive guide to getting started with and mastering OpenClaw.\n\nBuilding on our podcast episode, this post covers everything you need to know, from first install to multi-agent setups, plus the real costs and security gotchas most people skip over.\n\nWhether you’re brand new to OpenClaw or already running one, Claire’s guide will level you up.\n\nFind it here 🦞: https://t.co/x9h7gwH3cT", "summary": "Lenny Rachitsky comparte la guía completa de Claire Vo sobre OpenClaw, que cubre desde la instalación hasta configuraciones multi-agente, además de los costes reales y los aspectos de seguridad a tener en cuenta.", "topic": "IA & Machine Learning", "tags": ["openclaw", "guia", "agentes-ia", "multi-agente", "seguridad"], "author_handle": "lennysan", "author_name": "Lenny Rachitsky", "created_at": "2026-03-31T15:32:02.000Z", "metrics": {"bookmarks": 2749, "likes": 1370, "quotes": 27, "replies": 83, "retweets": 190, "views": 356416}}, {"id": "2039057005802082814", "url": "https://x.com/karpathy/status/2039057005802082814", "text": "@itsolelehmann They've released a number of features already heavily hinting on nudging Code into Claw directions, i.e. it's a speedrun of\nhttps://t.co/ZlMz0FnNqS", "summary": "Karpathy responde que varias funciones recientes ya apuntaban a llevar 'Code' hacia direcciones de 'Claw', calificándolo de una especie de speedrun, y enlaza a un tuit anterior suyo sobre el tema.", "topic": "IA & Machine Learning", "tags": ["claude-code", "karpathy", "direccion-de-producto"], "author_handle": "karpathy", "author_name": "Andrej Karpathy", "created_at": "2026-03-31T19:07:28.000Z", "metrics": {"bookmarks": 425, "likes": 1313, "quotes": 3, "replies": 47, "retweets": 54, "views": 171362}}, {"id": "2039058899949515086", "url": "https://x.com/RoundtableSpace/status/2039058899949515086", "text": "TOP 10 GITHUB REPOS TO ENHANCE YOUR CLAUDE CODE GAME\n\n• SUPABASE\nhttps://t.co/WzPIYqVQXM\n\n• NOTEBOOKLM\nhttps://t.co/LTlGoU3oPp\n\n• OBSIDIAN\nhttps://t.co/ncEYHnw47k\n\n• LANGCHAIN\nhttps://t.co/qlRw5rznwi\n\n• FLOWISE \nhttps://t.co/ggY1iS2sB7\n\n• CLAUDE SKILLS\nhttps://t.co/pcXlvK7d9u\n\n• AWESOME CLAUDE SKILLS\nhttps://t.co/5lbBAQSUuV\n\n• REPOMIX\nhttps://t.co/KGAPZb14Du\n\n• CLAUDE CODE BEST PRACTICE\nhttps://t.co/Bq5OzzlT2h\n\n• EVERYTHING CLAUDE CODE\nhttps://t.co/xPk3fV9mGb", "summary": "Lista de los 10 mejores repositorios de GitHub para mejorar el uso de Claude Code, incluyendo Supabase, NotebookLM, Obsidian, LangChain, Flowise, colecciones de Claude Skills, Repomix y guías de buenas prácticas.", "topic": "Programación & Dev", "tags": ["claude-code", "github", "claude-skills", "herramientas-ia", "repositorios"], "author_handle": "RoundtableSpace", "author_name": "0xMarioNawfal", "created_at": "2026-03-31T19:15:00.000Z", "metrics": {"bookmarks": 1571, "likes": 959, "quotes": 0, "replies": 20, "retweets": 166, "views": 102660}}, {"id": "2039314389484912641", "url": "https://x.com/vladikk/status/2039314389484912641", "text": "So Anthropic accidentally published Claude Code's source code. Oops.\n\nNaturally, I ran my modularity review skill on it!\n\nHey @AnthropicAI, you might want to look at your tool execution service. It hardcodes tool-specific logic with switch statements on tool names, so every time you add a tool with special requirements, you modify the orchestration layer. That's tight coupling in your highest-volatility code.\n\nThree more significant issues in the full review:\nhttps://t.co/xu4FvHeB6z\n\nConsider it peer review 😉", "summary": "Vlad Khononov comenta que Anthropic publicó por error el código fuente de Claude Code y aplicó su skill de revisión de modularidad, señalando un acoplamiento fuerte en el servicio de ejecución de herramientas (switch statements por nombre de herramienta).", "topic": "Programación & Dev", "tags": ["claude-code", "code-review", "software-architecture", "modularity"], "author_handle": "vladikk", "author_name": "Vlad Khononov", "created_at": "2026-04-01T12:10:13.000Z", "metrics": {"bookmarks": 3, "likes": 7, "quotes": 1, "replies": 0, "retweets": 1, "views": 820}}, {"id": "2039379859638821146", "url": "https://x.com/NainsiDwiv50980/status/2039379859638821146", "text": "🚨Breaking: @bcherny just revealed how Claude Code actually works — and most developers are using only 10% of it.\n\nThis isn’t prompting.\nThis is an AI engineering system.\n\nHere’s the Claude Code power stack hidden in his thread:\n\n• Hooks that run logic during agent lifecycle\n• Dispatch to remotely control Claude from anywhere\n• Chrome extension for frontend verification loops\n• Desktop app that auto-runs and tests servers\n• Fork sessions to explore parallel solutions\n• /btw for side queries while agents run\n• Git worktrees for parallel Claude agents\n• /batch to fan out massive changes across repos\n• --bare to speed up SDK startup up to 10x\n• --add-dir for multi-repo context\n• --agent to create custom AI roles\n• /voice to code by speaking\n\nThis turns Claude Code into:\n\n→ parallel AI engineers\n→ autonomous coding loops\n→ self-testing workflows\n→ multi-repo orchestration\n→ batch refactors\n→ remote-controlled agents\n\nMost people use Claude like ChatGPT.\nPower users run entire engineering teams.\n\nKey docs from the thread:\n\nCLI reference\nhttps://t.co/6XXDng8JJc…\n\nDesktop auto testing\nhttps://t.co/kLiLoP0Sjj…\n\nChrome extension\nhttps://t.co/XOYx4mOO1a\n\nHooks lifecycle automation\nhttps://t.co/P6jSBQePaq\n\nScheduled tasks\nhttps://t.co/BFQopfGLZF…\n\nRemote control / Dispatch\nhttps://t.co/LiKIzPoi7R…\n\nOnce you combine:\n\nHooks + Batch + Worktrees + Agents\n\nClaude stops being a copilot\nand becomes an autonomous dev team.\n\nThis is the shift most developers haven’t noticed yet.", "summary": "Hilo que resume funciones avanzadas de Claude Code reveladas por @bcherny (hooks, control remoto, extensión de Chrome, worktrees de Git, comandos como /batch y /voice), presentándolas como un sistema completo de ingeniería con IA.", "topic": "Programación & Dev", "tags": ["claude-code", "hooks", "git-worktrees", "automatizacion", "cli"], "author_handle": "NainsiDwiv50980", "author_name": "Nainsi Dwivedi", "created_at": "2026-04-01T16:30:23.000Z", "metrics": {"bookmarks": 125, "likes": 84, "quotes": 0, "replies": 11, "retweets": 17, "views": 8319}}, {"id": "2040334954538688672", "url": "https://x.com/bibryam/status/2040334954538688672", "text": "Really like this from @addyosmani 👌\n\n🤩 Google engineering practices as agent skills🤩 \n->  organized into 19 skills & 7 commands for AI agents.\n\n→ Plan - decompose into small, verifiable tasks\n→ Build - incremental implementation, context engineering, clean API design\n→ Verify - TDD, browser testing with DevTools, systematic debugging\n→ Review - code quality, security hardening, performance optimization\n→ Ship - git workflow, CI/CD, ADRs, pre-launch checklists\nhttps://t.co/JOPAOVvwLy", "summary": "Bilgin Ibryam destaca un repositorio de Addy Osmani que convierte las prácticas de ingeniería de Google en 19 skills y 7 comandos para agentes de IA, organizados en fases de planificación, construcción, verificación, revisión y despliegue.", "topic": "IA & Machine Learning", "tags": ["agent-skills", "google", "claude-code", "buenas-practicas", "addyosmani"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2026-04-04T07:45:35.000Z", "metrics": {"bookmarks": 1338, "likes": 817, "quotes": 1, "replies": 12, "retweets": 94, "views": 57941}}, {"id": "2040465921324482568", "url": "https://x.com/plainionist/status/2040465921324482568", "text": "Maturity as a developer means\nunderstanding the importance of documenting\ndesign and architecture decisions.\n\n👇👇\nhttps://t.co/VvTws4XgDs", "summary": "Sostiene que la madurez de un desarrollador se refleja en la importancia que da a documentar decisiones de diseño y arquitectura, enlazando al artículo de Martin Fowler sobre Architecture Decision Records.", "topic": "Programación & Dev", "tags": ["architecture-decision-records", "documentacion", "arquitectura-software", "martin-fowler"], "author_handle": "plainionist", "author_name": "Seb", "created_at": "2026-04-04T16:26:00.000Z", "metrics": {"bookmarks": 174, "likes": 206, "quotes": 2, "replies": 3, "retweets": 22, "views": 11508}}, {"id": "2040470801506541998", "url": "https://x.com/karpathy/status/2040470801506541998", "text": "Wow, this tweet went very viral!\n\nI wanted share a possibly slightly improved version of the tweet in an \"idea file\". The idea of the idea file is that in this era of LLM agents, there is less of a point/need of sharing the specific code/app, you just share the idea, then the other person's agent customizes & builds it for your specific needs.\n\nSo here's the idea in a gist format: https://t.co/NlAfEJjtJV\n\nYou can give this to your agent and it can build you your own LLM wiki and guide you on how to use it etc. It's intentionally kept a little bit abstract/vague because there are so many directions to take this in. And ofc, people can adjust the idea or contribute their own in the Discussion which is cool.", "summary": "Karpathy comparte, en formato de 'idea file' (un gist), una versión mejorada de un tuit que se hizo viral: la idea de compartir conceptos en lugar de código para que el agente LLM de cada persona construya y personalice su propia wiki de LLM.", "topic": "IA & Machine Learning", "tags": ["karpathy", "idea-file", "gist", "llm-agents", "base-de-conocimiento"], "author_handle": "karpathy", "author_name": "Andrej Karpathy", "created_at": "2026-04-04T16:45:23.000Z", "metrics": {"bookmarks": 46679, "likes": 26836, "quotes": 673, "replies": 1127, "retweets": 2832, "views": 7199866}}, {"id": "2040474696391463158", "url": "https://x.com/ghumare64/status/2040474696391463158", "text": "Karpathy just described the LLM Wiki pattern, here's the engine that already does it.\n\nOpen source = 100%\n\nhttps://t.co/xtL6kMjVul https://t.co/QHbhdSxk4p", "summary": "Señala que Andrej Karpathy describió el patrón 'LLM Wiki' y enlaza un motor de código abierto (agentmemory) que ya lo implementa.", "topic": "IA & Machine Learning", "tags": ["karpathy", "memoria-ia", "agentes-ia", "open-source"], "author_handle": "ghumare64", "author_name": "Rohit Ghumare", "created_at": "2026-04-04T17:00:52.000Z", "metrics": {"bookmarks": 1450, "likes": 864, "quotes": 2, "replies": 23, "retweets": 89, "views": 144788}}, {"id": "2040649378520498328", "url": "https://x.com/Dinosn/status/2040649378520498328", "text": "A pattern for building personal knowledge bases using LLMs. https://t.co/iavlcxLY2w", "summary": "Comparte un patrón, en un gist de Andrej Karpathy, para construir bases de conocimiento personales usando LLMs.", "topic": "IA & Machine Learning", "tags": ["llm", "knowledge-base", "karpathy", "second-brain"], "author_handle": "Dinosn", "author_name": "Nicolas Krassas", "created_at": "2026-04-05T04:34:59.000Z", "metrics": {"bookmarks": 78, "likes": 75, "quotes": 0, "replies": 0, "retweets": 4, "views": 4913}}, {"id": "2040662168736333898", "url": "https://x.com/dbreunig/status/2040662168736333898", "text": "How Claude Code builds a system prompt: https://t.co/GU428S7VrJ", "summary": "Drew Breunig comparte un artículo que explica cómo Claude Code construye su system prompt.", "topic": "Programación & Dev", "tags": ["claude-code", "system-prompt", "llm", "ingenieria-de-prompts"], "author_handle": "dbreunig", "author_name": "Drew Breunig", "created_at": "2026-04-05T05:25:49.000Z", "metrics": {"bookmarks": 188, "likes": 131, "quotes": 1, "replies": 0, "retweets": 23, "views": 8530}}, {"id": "2040777736076034264", "url": "https://x.com/github/status/2040777736076034264", "text": "Single-prompt AI workflows often hit a performance plateau. Multi-agent systems can push past it, but they usually require a massive amount of setup.\n\nSquad, an open source project built on GitHub Copilot, initializes a preconfigured AI team directly inside your repo.\n\nLearn how to run multi-agent workflows that stay inspectable, predictable, and collaborative.\nhttps://t.co/1ewya9yPpC", "summary": "GitHub presenta Squad, un proyecto open source construido sobre GitHub Copilot que despliega un equipo preconfigurado de agentes de IA dentro de un repositorio para superar el límite de los flujos de un solo prompt.", "topic": "IA & Machine Learning", "tags": ["multi-agente", "github-copilot", "squad", "agentes-ia", "open-source"], "author_handle": "github", "author_name": "GitHub", "created_at": "2026-04-05T13:05:02.000Z", "metrics": {"bookmarks": 179, "likes": 256, "quotes": 8, "replies": 28, "retweets": 45, "views": 35886}}, {"id": "2041504099233870035", "url": "https://x.com/jetbrains/status/2041504099233870035", "text": "We’re now hiring in Spain! 🇪🇸\n\nMadrid is our starting point, but we’re hiring remotely across the country. Explore 70+ open roles: https://t.co/ywKPy3PCSz https://t.co/31TB715VMe", "summary": "JetBrains anuncia que está contratando en España, con Madrid como punto de partida, ofreciendo más de 70 puestos abiertos en remoto por todo el país.", "topic": "Programación & Dev", "tags": ["jetbrains", "empleo", "espana", "contratacion", "remoto"], "author_handle": "jetbrains", "author_name": "JetBrains", "created_at": "2026-04-07T13:11:21.000Z", "metrics": {"bookmarks": 866, "likes": 1272, "quotes": 22, "replies": 34, "retweets": 149, "views": 678189}}, {"id": "2041632641716514947", "url": "https://x.com/intheworldofai/status/2041632641716514947", "text": "https://t.co/xmtqfP0r9A", "summary": "Enlace a un artículo de X publicado por la cuenta WorldofAI, sin texto descriptivo adicional en el tuit.", "topic": "Otros", "tags": ["sin-texto", "articulo-x", "enlace"], "author_handle": "intheworldofai", "author_name": "WorldofAI", "created_at": "2026-04-07T21:42:08.000Z", "metrics": {"bookmarks": 670, "likes": 326, "quotes": 4, "replies": 8, "retweets": 31, "views": 83247}}, {"id": "2041665446890307940", "url": "https://x.com/tom_doerr/status/2041665446890307940", "text": "Library of skills for AI in education\n\nhttps://t.co/zbC6ssm5Zl https://t.co/wkco4V3dP2", "summary": "Comparte una biblioteca de skills de IA orientada a educación, alojada en GitHub.", "topic": "IA & Machine Learning", "tags": ["claude-skills", "educacion", "ia-educativa", "open-source"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-04-07T23:52:29.000Z", "metrics": {"bookmarks": 176, "likes": 181, "quotes": 0, "replies": 0, "retweets": 22, "views": 8147}}, {"id": "2041747312737759532", "url": "https://x.com/NickSpisak_/status/2041747312737759532", "text": "Latest update of @karpathy's llm wiki I open sourced\n\n→ Works in Claude Code, Codex, Gemini\n→ Optional installs for qmd, summarize, agent-browser\n→ ingest, query, and lint support\n\nMake it your own and hand to your harness of choice\n\nFull Youtube setup with @coreyganim in the comments\n\nSkill source code in the github below🔽\nhttps://t.co/0vmGxXEtMm", "summary": "Anuncia una actualización de su versión open source del \"LLM wiki\" de Karpathy, compatible con Claude Code, Codex y Gemini, con soporte de ingesta, consulta y lint.", "topic": "IA & Machine Learning", "tags": ["llm-wiki", "karpathy", "open-source", "claude-code", "second-brain"], "author_handle": "NickSpisak_", "author_name": "Nick Spisak", "created_at": "2026-04-08T05:17:47.000Z", "metrics": {"bookmarks": 499, "likes": 295, "quotes": 3, "replies": 15, "retweets": 40, "views": 48120}}, {"id": "2041764549158957323", "url": "https://x.com/vivekgalatage/status/2041764549158957323", "text": "An Introduction to Distributed Systems by Kyle Kingsbury\n\nhttps://t.co/W7WQFkGXdH https://t.co/TcykufRhv1", "summary": "Recomendación del curso 'An Introduction to Distributed Systems' de Kyle Kingsbury, con enlace a su repositorio en GitHub.", "topic": "Programación & Dev", "tags": ["sistemas-distribuidos", "curso", "github", "kyle-kingsbury"], "author_handle": "vivekgalatage", "author_name": "Vivek Galatage", "created_at": "2026-04-08T06:26:17.000Z", "metrics": {"bookmarks": 1255, "likes": 868, "quotes": 3, "replies": 4, "retweets": 75, "views": 88032}}, {"id": "2041765667733745870", "url": "https://x.com/twtayaan/status/2041765667733745870", "text": "🚨 S3 is no longer just Object Storage.\n\nYesterday (April 7, 2026), AWS officially launched Amazon S3 Files.\n\nThis is the biggest update to S3 in 20 years.\n\nIt can:\n→ Mount S3 buckets as native file systems\n→ Provide sub-millisecond file access\n→ Handle POSIX permissions (UID/GID) natively\n→ Connect to Lambda, EC2, and EKS directly\n→ Eliminate the need for s3fs or data staging\n\nYour AI agents can read/write to S3 like a local disk, while your data team access the same objects via API.\n\nDevOps just got a massive upgrade.\n\nSource: https://t.co/gwGIhDlInU", "summary": "El autor anuncia el lanzamiento de Amazon S3 Files, que permite montar buckets de S3 como sistemas de archivos nativos con acceso POSIX y sub-milisegundo, conectable a Lambda, EC2 y EKS.", "topic": "Programación & Dev", "tags": ["aws", "s3", "almacenamiento-en-la-nube", "devops", "infraestructura"], "author_handle": "twtayaan", "author_name": "Ayaan 🐧", "created_at": "2026-04-08T06:30:44.000Z", "metrics": {"bookmarks": 1950, "likes": 3622, "quotes": 55, "replies": 75, "retweets": 424, "views": 463184}}, {"id": "2041774011273687434", "url": "https://x.com/jdecool/status/2041774011273687434", "text": "Encoding Team Standards: https://t.co/ykUzkdx9yA", "summary": "Comparte el artículo de Martin Fowler titulado 'Encoding Team Standards', sobre cómo codificar los estándares de un equipo para reducir la fricción al trabajar con IA.", "topic": "Programación & Dev", "tags": ["estandares-de-equipo", "martin-fowler", "ia-en-desarrollo", "buenas-practicas"], "author_handle": "jdecool", "author_name": "Jérémy DECOOL", "created_at": "2026-04-08T07:03:53.000Z", "metrics": {"bookmarks": 1, "likes": 1, "quotes": 0, "replies": 0, "retweets": 0, "views": 105}}, {"id": "2041818475417792778", "url": "https://x.com/adrianaia_/status/2041818475417792778", "text": "Alguien construyó exactamente lo que Andrej Karpathy dijo que alguien debería construir.\n\n48 horas después de que Karpathy publicara su workflow de bases de conocimiento con LLMs, esto apareció en GitHub. https://t.co/A3QsSSWRSZ", "summary": "AdrIAna comenta que, 48 horas después de que Karpathy publicara su workflow de bases de conocimiento con LLMs, alguien construyó exactamente esa idea y la subió a GitHub.", "topic": "IA & Machine Learning", "tags": ["karpathy", "github", "llm-workflow", "base-de-conocimiento"], "author_handle": "adrianaia_", "author_name": "AdrIAna", "created_at": "2026-04-08T10:00:34.000Z", "metrics": {"bookmarks": 1407, "likes": 903, "quotes": 2, "replies": 7, "retweets": 90, "views": 70559}}, {"id": "2041825921183969413", "url": "https://x.com/GithubProjects/status/2041825921183969413", "text": "A visual, example-driven guide to Claude Code\n\nFrom basic concepts to advanced agents, with copy-paste templates that bring immediate value. https://t.co/Sa4WZhRmaQ", "summary": "Anuncia una guía visual y con ejemplos sobre Claude Code, desde conceptos básicos hasta agentes avanzados, con plantillas listas para copiar y pegar.", "topic": "Programación & Dev", "tags": ["claude-code", "guia", "agentes", "plantillas"], "author_handle": "GithubProjects", "author_name": "GitHub Projects Community", "created_at": "2026-04-08T10:30:09.000Z", "metrics": {"bookmarks": 197, "likes": 179, "quotes": 2, "replies": 3, "retweets": 13, "views": 15527}}, {"id": "2041878762342502731", "url": "https://x.com/jetbrains/status/2041878762342502731", "text": "\"Claude Code isn't magic. The harness layer is just software, and software is something any dev can shape to fit how they want to work.\"\n\nCheck out @Hacubu’s practical guide to building a custom agent with @LangChain’s Deep Agents, LangSmith, and ACP.\nhttps://t.co/tat5aBW8Vg", "summary": "JetBrains comparte una guía práctica para construir un agente personalizado con Deep Agents de LangChain, LangSmith y el protocolo ACP, partiendo de la idea de que la capa \"harness\" de Claude Code es solo software que cualquiera puede moldear.", "topic": "IA & Machine Learning", "tags": ["langchain", "deep-agents", "langsmith", "acp", "custom-agents"], "author_handle": "jetbrains", "author_name": "JetBrains", "created_at": "2026-04-08T14:00:07.000Z", "metrics": {"bookmarks": 65, "likes": 98, "quotes": 2, "replies": 5, "retweets": 15, "views": 14339}}, {"id": "2041901460523270409", "url": "https://x.com/ashpreetbedi/status/2041901460523270409", "text": "https://t.co/0MgpKyo2Ra", "summary": "Enlace a un artículo de X (Twitter) compartido por Ashpreet Bedi, sin texto descriptivo adicional.", "topic": "Otros", "tags": ["enlace-sin-texto", "articulo-x", "ashpreet-bedi"], "author_handle": "ashpreetbedi", "author_name": "Ashpreet Bedi", "created_at": "2026-04-08T15:30:19.000Z", "metrics": {"bookmarks": 647, "likes": 318, "quotes": 5, "replies": 3, "retweets": 38, "views": 29831}}, {"id": "2041902638405480536", "url": "https://x.com/rseroter/status/2041902638405480536", "text": "\"I think we’re going to see a lot more reimaginings, where people attack old problems with modern tactics. Coding agents lower the costs of taking on stalwarts and raise our ability to rapidly harden our software.\" https://t.co/rDAftsXXKe &lt; I like this point from @dbreunig", "summary": "Richard Seroter cita a @dbreunig sobre cómo los agentes de codificación reducen el coste de abordar problemas antiguos con tácticas modernas, enlazando a un artículo sobre la segunda fase del desarrollo agéntico.", "topic": "IA & Machine Learning", "tags": ["agentes-de-codificacion", "desarrollo-agentico", "software-legado"], "author_handle": "rseroter", "author_name": "Richard Seroter", "created_at": "2026-04-08T15:35:00.000Z", "metrics": {"bookmarks": 59, "likes": 62, "quotes": 0, "replies": 0, "retweets": 3, "views": 2766}}, {"id": "2041903948873777629", "url": "https://x.com/danshipper/status/2041903948873777629", "text": "We use OpenClaws to do all of our work at @every. \n\nWe have 25 full-time employees, so we’re one of the few companies in the world that has seen how work changes when everyone has their own personal agent in the company Slack.\n\nI chatted with @every COO Brandon (@bran_don_gell) and @every head of platform Willie (@bigwilliestyle) to share what we’ve learned.\n\nWe get into:\n- Why agents become mirrors of their owners, and how that influences how other people on the team interact with them\n- How a parallel AI org chart forms on its own. People have stopped tagging me on Slack with questions about Proof, the document editor I vibe coded, because they knew my agent R2-C2 can step in\n- The etiquette for human-agent collaboration is being invented in real time. Brandon's rule is that if there's an established process or documented answer, always ask the agent, not their human\n- Why everyone is a manager now, and why even experienced managers carry limiting beliefs about what their agents can do\n- This is a must-watch for anyone trying to understand how AI workers change daily operations, not just in theory, but inside a company that’s half-agent \n\nWatch below!\n\nTimestamps\nIntroduction: \nHow Brandon built Zosia, an AI agent to run his household: \nBrandon’s “aha” moment: \nWhat happened when everyone on the team got their own agent: \nHow agents take on their owners' personalities, and why that matters inside an org: \nWhy it’s important for agents to work in public: \nWhat we’re still figuring out when it comes to agent behavior, including memory gaps, group chat etiquette, and the \"ant death spiral\" problem: \nHow we built Plus One, our hosted OpenClaw product: \nThe cultural shift required to make agents work at scale:", "summary": "Dan Shipper explica que en Every, empresa de 25 empleados, cada persona tiene su propio agente de IA (OpenClaws) integrado en Slack, y comparte una conversación con su COO y su jefe de plataforma sobre cómo esto cambia la colaboración humano-agente y la gestión de equipos.", "topic": "IA & Machine Learning", "tags": ["openclaw", "agentes-ia", "cultura-empresarial", "slack", "gestion-de-equipos"], "author_handle": "danshipper", "author_name": "Dan Shipper 📧", "created_at": "2026-04-08T15:40:12.000Z", "metrics": {"bookmarks": 643, "likes": 315, "quotes": 8, "replies": 17, "retweets": 20, "views": 68025}}, {"id": "2041916589906464820", "url": "https://x.com/agrimsingh/status/2041916589906464820", "text": "i took @karpathy's autoresearch loop and pointed it at business class flights because i wanna fly cheap but in class.\n\n(at least in theory - i'm a poor founder flying coach)\n\nhere's autofare - autoresearch but for always flying in lie-flat beds\n\nmade with codex + gpt 5.4 mini\n\n@gabrielchua @reach_vb @romainhuet @OpenAIDevs", "summary": "Agrim Singh adapta el 'autoresearch loop' de Karpathy para buscar vuelos baratos en clase business, creando el proyecto 'autofare' con Codex y GPT-5.4 mini.", "topic": "IA & Machine Learning", "tags": ["autoresearch", "codex", "gpt", "side-project", "viajes"], "author_handle": "agrimsingh", "author_name": "agrim singh @ ai engineer world fair", "created_at": "2026-04-08T16:30:26.000Z", "metrics": {"bookmarks": 2032, "likes": 921, "quotes": 11, "replies": 59, "retweets": 35, "views": 177095}}, {"id": "2041929199976640948", "url": "https://x.com/AnthropicAI/status/2041929199976640948", "text": "New on the Engineering Blog: \n\nBuilding Managed Agents—our hosted service for long-running agents—meant solving an old problem in computing: how to design a system for “programs as yet unthought of.”\n\nRead more: https://t.co/YYaEub2QGV", "summary": "Anthropic publica en su blog de ingeniería un artículo sobre Managed Agents, su servicio alojado para agentes de larga duración, y los retos de diseñar un sistema para programas todavía no imaginados.", "topic": "IA & Machine Learning", "tags": ["anthropic", "managed-agents", "agentes-ia", "engineering-blog"], "author_handle": "AnthropicAI", "author_name": "Anthropic", "created_at": "2026-04-08T17:20:33.000Z", "metrics": {"bookmarks": 2447, "likes": 3618, "quotes": 130, "replies": 386, "retweets": 448, "views": 579587}}, {"id": "2042262308294955378", "url": "https://x.com/ghumare64/status/2042262308294955378", "text": "LLM Wiki by Karpathy was a mind-blowing read 🤯\n\nAnd, that's why I had written LLM wiki v2 extending with how this can be plugged as a memory for scaling systems.\n\nIt got 111 stars on github gist file from last week.\n\nNever believed it would be popular.\n\nhttps://t.co/YZ2d6KnSOe", "summary": "El autor cuenta que extendió el \"LLM Wiki\" de Karpathy en una v2 orientada a servir de memoria para sistemas a escala, y que su gist en GitHub alcanzó 111 estrellas.", "topic": "IA & Machine Learning", "tags": ["llm-wiki", "karpathy", "memory", "github"], "author_handle": "ghumare64", "author_name": "Rohit Ghumare", "created_at": "2026-04-09T15:24:12.000Z", "metrics": {"bookmarks": 139, "likes": 120, "quotes": 0, "replies": 9, "retweets": 11, "views": 18663}}, {"id": "2043052113983402360", "url": "https://x.com/spacesuit_app/status/2043052113983402360", "text": "Introducing Spacesuit.\n\nA futuristic canvas for your personal development.\n\nDownload on macOS, Windows and Linux.", "summary": "Presentación de Spacesuit, descrita como un 'lienzo futurista' para el desarrollo personal, disponible para macOS, Windows y Linux.", "topic": "Productividad & Herramientas", "tags": ["spacesuit", "app-de-escritorio", "desarrollo-personal", "multiplataforma"], "author_handle": "spacesuit_app", "author_name": "Spacesuit", "created_at": "2026-04-11T19:42:36.000Z", "metrics": {"bookmarks": 309, "likes": 544, "quotes": 7, "replies": 0, "retweets": 32, "views": 4110315}}, {"id": "2043447970507686248", "url": "https://x.com/addyosmani/status/2043447970507686248", "text": "Memory makes your agent smarter over time.\n\nThe agent harness is key to the memory layer. You can't bolt one onto the other after the fact. Every decision the harness makes - what goes in context, what survives compaction, how skills get surfaced, how the working directory is exposed etc - is a memory decision.\n\nA well written write-up by @hwchase17", "summary": "Addy Osmani explica que la memoria de un agente de IA depende del diseño del harness, ya que decisiones como qué entra en el contexto o cómo sobrevive a la compactación son decisiones de memoria; recomienda un artículo de @hwchase17 sobre el tema.", "topic": "IA & Machine Learning", "tags": ["memoria-de-agentes", "agent-harness", "context-engineering", "langchain"], "author_handle": "addyosmani", "author_name": "Addy Osmani", "created_at": "2026-04-12T21:55:36.000Z", "metrics": {"bookmarks": 732, "likes": 551, "quotes": 5, "replies": 22, "retweets": 61, "views": 118524}}, {"id": "2043869656931529034", "url": "https://x.com/rauchg/status/2043869656931529034", "text": "Today we're open sourcing https://t.co/p76KVdY7dG, a reference platform for cloud coding agents.\n\nYou've heard that companies like Stripe (Minions), Ramp (Inspect), Spotify (Honk), Block (Goose), and others are building their own \"AI software factories\". Why?\n\n1️⃣ On a technical level, off-the-shelf coding agents don't perform well with huge monorepos, don't have your institutional knowledge, integrations, and custom workflows.\n\n2️⃣ On a business level, the moat of software companies will shift from 'the code they wrote', to the 'means of production' of that code. The alpha is in your factory.\n\nOpen Agents deploys to our agentic infrastructure: Fluid for running the agent's brain, Workflow for its long-running durability, Sandbox for secure code execution, AI Gateway for multi-model tokens.\n\n(Because of our focus on Open SDKs and runtimes, this codebase is a gem even if you're not hosting on Vercel.)\n\nTL;DR: if you're building an internal or user-facing agentic coding platform, deploy this:\nhttps://t.co/xdsc42nbDN", "summary": "Guillermo Rauch (Vercel) anuncia la apertura como open source de Open Agents, una plataforma de referencia para agentes de codificación en la nube, comparándola con las 'fábricas de software con IA' internas de empresas como Stripe, Ramp, Spotify y Block.", "topic": "Programación & Dev", "tags": ["open-agents", "agentes-de-codigo", "open-source", "vercel", "infraestructura-de-agentes"], "author_handle": "rauchg", "author_name": "Guillermo Rauch", "created_at": "2026-04-14T01:51:14.000Z", "metrics": {"bookmarks": 5554, "likes": 4288, "quotes": 81, "replies": 161, "retweets": 351, "views": 680703}}, {"id": "2043992966461640724", "url": "https://x.com/Sandeepg33k/status/2043992966461640724", "text": "Introducing Passmark: an open-source AI agent purpose-built for regression testing at scale.\n\nBuilt on Playwright: natural language tests, multi-model assertions, smart caching, telemetry, AI gateway support and more!\n\ngithub: bug0inc/passmark", "summary": "Sandeep presenta Passmark, un agente de IA de código abierto construido sobre Playwright para pruebas de regresión a escala, con tests en lenguaje natural, aserciones multi-modelo y caching inteligente.", "topic": "Programación & Dev", "tags": ["testing", "playwright", "agente-ia", "open-source", "qa"], "author_handle": "Sandeepg33k", "author_name": "Sandeep", "created_at": "2026-04-14T10:01:13.000Z", "metrics": {"bookmarks": 4338, "likes": 8045, "quotes": 16, "replies": 0, "retweets": 926, "views": 34932099}}, {"id": "2044043579874537713", "url": "https://x.com/martinfowler/status/2044043579874537713", "text": "Fragments: pragmatic summit video with Kent and Gergely, virtue of laziness, TDD and prompts, inspiration from Dark Star\n\nhttps://t.co/6lq36iCaLW", "summary": "Martin Fowler comparte 'fragments' sobre un vídeo del pragmatic summit con Kent Beck y Gergely, la virtud de la pereza, TDD y prompts, con inspiración de Dark Star.", "topic": "Programación & Dev", "tags": ["martin-fowler", "tdd", "prompts", "desarrollo-de-software"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-04-14T13:22:20.000Z", "metrics": {"bookmarks": 52, "likes": 68, "quotes": 0, "replies": 1, "retweets": 13, "views": 12107}}, {"id": "2044399617450660023", "url": "https://x.com/midudev/status/2044399617450660023", "text": "¡Haz que tu IA deje de diseñar interfaces genéricas!\n\nHan creado un repositorio con archivos DESIGN.md que replican la guía visual de grandes empresas.\n\nTienes de Apple, Airbnb, Tesla, Shopify, Uber y más...\n\nSin Figma. Sin JSON. Sin herramientas raras.\n\nCopias el archivo en la raíz de tu proyecto y tu agente de IA entiende al instante cómo debe verse la interfaz.\n\nOpen source y gratis:\n→ https://t.co/x6jKgy5Tst", "summary": "Miguel Ángel Durán presenta un repositorio open source con archivos DESIGN.md que replican las guías visuales de empresas como Apple, Airbnb, Tesla, Shopify y Uber, para que un agente de IA entienda el estilo de interfaz deseado sin usar Figma.", "topic": "Diseño & UX", "tags": ["design-systems", "ui-design", "ai-agents", "open-source"], "author_handle": "midudev", "author_name": "Miguel Ángel Durán", "created_at": "2026-04-15T12:57:06.000Z", "metrics": {"bookmarks": 3711, "likes": 2879, "quotes": 1, "replies": 19, "retweets": 286, "views": 109777}}, {"id": "2044723788743360833", "url": "https://x.com/mattpocockuk/status/2044723788743360833", "text": "I'm starting to think that DDD might be the answer to all of my problems\n\n- Model not doing what you want? Shared language\n- Can't navigate a massive codebase? Bounded contexts with global mapping\n- Don't know why a decision was made? ADR's\n\nIt's just so freaking elegant", "summary": "Matt Pocock reflexiona sobre cómo el Domain-Driven Design (DDD) —lenguaje compartido, bounded contexts y ADRs— podría resolver muchos problemas comunes al trabajar con modelos de IA en bases de código grandes.", "topic": "Programación & Dev", "tags": ["ddd", "arquitectura-de-software", "bounded-contexts", "adr"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-04-16T10:25:15.000Z", "metrics": {"bookmarks": 886, "likes": 1220, "quotes": 21, "replies": 137, "retweets": 47, "views": 177248}}, {"id": "2044787496681390571", "url": "https://x.com/eng_khairallah1/status/2044787496681390571", "text": "This 25-minute Claude Code workshop by Anthropic's own applied AI team will teach\n\nyou more about Claude Code best practices and making your AI tools actually work together than everything you've scrolled past this year.\n\nBookmark this & watch, no matter what.\n\nThen read the guide below.", "summary": "El autor recomienda un taller de 25 minutos del equipo de IA aplicada de Anthropic sobre buenas prácticas con Claude Code y cómo integrar herramientas de IA entre sí.", "topic": "IA & Machine Learning", "tags": ["claude-code", "taller", "anthropic", "buenas-practicas"], "author_handle": "eng_khairallah1", "author_name": "Khairallah AL-Awady", "created_at": "2026-04-16T14:38:24.000Z", "metrics": {"bookmarks": 4369, "likes": 2356, "quotes": 10, "replies": 58, "retweets": 727, "views": 458908}}, {"id": "2044808446424297635", "url": "https://x.com/McKinsey/status/2044808446424297635", "text": "AI is everywhere. But most companies are still stuck in pilot mode.\n\nThe issue isn’t the tech. It’s that the work itself hasn’t changed.\n\nLeaders are starting to rethink workflows, roles, and decisions end to end. That’s where the real value is unlocked. https://t.co/ask2NpJfwF https://t.co/2MyQlTxdVk", "summary": "McKinsey señala que muchas empresas siguen atascadas en la fase piloto con la IA porque el problema no es la tecnología sino que aún no han rediseñado sus flujos de trabajo, roles y decisiones de forma integral.", "topic": "IA & Machine Learning", "tags": ["adopcion-de-ia", "transformacion-digital", "mckinsey", "estrategia-empresarial"], "author_handle": "McKinsey", "author_name": "McKinsey & Company", "created_at": "2026-04-16T16:01:38.000Z", "metrics": {"bookmarks": 847, "likes": 672, "quotes": 23, "replies": 24, "retweets": 137, "views": 81253}}, {"id": "2045110469426323900", "url": "https://x.com/mattpocockuk/status/2045110469426323900", "text": "My new skill lineup:\n\n/domain-model - replaces /grill-me, integrates some DDD concepts and adds docs & ADR's during discussions\n/to-prd - create a PRD\n/to-issues - create issues with blocking\n/github-triage - triage issues with a state machine-based labelling system\n/tdd - do TDD where appropriate\n\nStill more to flesh out, but this is feeling AWESOME", "summary": "Matt Pocock comparte su nueva lista de skills personalizados (domain-model, to-prd, to-issues, github-triage, tdd) para mejorar su flujo de trabajo de desarrollo asistido por IA.", "topic": "Productividad & Herramientas", "tags": ["claude-skills", "flujo-de-trabajo", "tdd", "dev-tools"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-04-17T12:01:46.000Z", "metrics": {"bookmarks": 2105, "likes": 1816, "quotes": 2, "replies": 91, "retweets": 69, "views": 106513}}, {"id": "2046485091996811539", "url": "https://x.com/sairahul1/status/2046485091996811539", "text": "The creator of Claude Code teaches more about vibe-coding in 30 minutes than most tutorials do in hours. \n\nSave this — it'll change how you build forever. https://t.co/98DukOfuwG", "summary": "Recomienda un vídeo de 30 minutos del creador de Claude Code enseñando sobre 'vibe coding'.", "topic": "Programación & Dev", "tags": ["claude-code", "vibe-coding", "video", "tutorial"], "author_handle": "sairahul1", "author_name": "Rahul", "created_at": "2026-04-21T07:04:02.000Z", "metrics": {"bookmarks": 18649, "likes": 7385, "quotes": 28, "replies": 53, "retweets": 1069, "views": 940136}}, {"id": "2046592545530982880", "url": "https://x.com/dabit3/status/2046592545530982880", "text": "Nice little reference: 56 laws of software engineering.\n\nEspecially great for juniors (worth bookmarking), and I also learned a few things.\nhttps://t.co/Drr0DJXqXm https://t.co/zTkVCmAVaQ", "summary": "Recomienda un sitio de referencia con \"56 leyes de la ingeniería de software\", especialmente útil para desarrolladores junior.", "topic": "Programación & Dev", "tags": ["software-engineering", "best-practices", "reference", "junior-developers"], "author_handle": "dabit3", "author_name": "nader dabit", "created_at": "2026-04-21T14:11:01.000Z", "metrics": {"bookmarks": 2153, "likes": 1455, "quotes": 5, "replies": 14, "retweets": 170, "views": 95951}}, {"id": "2046599743631945854", "url": "https://x.com/martinfowler/status/2046599743631945854", "text": "Fragments: 34th Thoughtworks Technology Radar, what happens when developers don't read the LLM's code, DirectFile and tech in large organizations\n\nhttps://t.co/brBXaa3xOc", "summary": "Martin Fowler enlaza su recopilación de 'Fragments', que incluye el 34º Technology Radar de Thoughtworks, una reflexión sobre cuando los desarrolladores no leen el código generado por LLMs, y temas sobre DirectFile y tecnología en grandes organizaciones.", "topic": "Programación & Dev", "tags": ["technology-radar", "llm", "martin-fowler", "ingenieria-de-software"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-04-21T14:39:37.000Z", "metrics": {"bookmarks": 140, "likes": 143, "quotes": 2, "replies": 7, "retweets": 24, "views": 25684}}, {"id": "2046646395634114988", "url": "https://x.com/rseroter/status/2046646395634114988", "text": ".@addyosmani shares hot takes:\n\n\"A decent model with a great harness beats a great model with a bad harness\"\n\n\"The gap between what today’s models can do and what you see them doing is largely a harness gap.\"\n\n\"A harness is a living system, not a config file you set up once\"\n\nhttps://t.co/3hngQP8XTb", "summary": "Richard Seroter recoge frases de Addy Osmani sobre la importancia del harness de un agente: un modelo decente con un buen harness supera a un gran modelo con un mal harness, y el harness debe evolucionar constantemente.", "topic": "IA & Machine Learning", "tags": ["agent-harness", "addyosmani", "agentes-ia", "llm"], "author_handle": "rseroter", "author_name": "Richard Seroter", "created_at": "2026-04-21T17:45:00.000Z", "metrics": {"bookmarks": 588, "likes": 431, "quotes": 5, "replies": 13, "retweets": 63, "views": 44354}}, {"id": "2046710816884625509", "url": "https://x.com/ClaudeDevs/status/2046710816884625509", "text": "Caching is critical for customers to lower both costs and TTFT.\n\nWe’re launching a new dashboard in Claude Developer Console to increase visibility and help customers optimize their usage.\n\nCheck it out here: https://t.co/zgBJ4dHXyI https://t.co/Uwje2iPbLT", "summary": "ClaudeDevs presenta un nuevo panel en Claude Developer Console para dar visibilidad al uso de la caché y ayudar a los clientes a reducir costes y el tiempo hasta el primer token (TTFT).", "topic": "IA & Machine Learning", "tags": ["claude-api", "cache", "ttft", "developer-console", "optimizacion-costes"], "author_handle": "ClaudeDevs", "author_name": "ClaudeDevs", "created_at": "2026-04-21T22:00:59.000Z", "metrics": {"bookmarks": 1634, "likes": 2680, "quotes": 23, "replies": 83, "retweets": 175, "views": 355378}}, {"id": "2047694444787577236", "url": "https://x.com/Suryanshti777/status/2047694444787577236", "text": "https://t.co/5dcmppYtsT", "summary": "Enlace a un artículo de X sin texto descriptivo adicional en el tuit.", "topic": "Otros", "tags": ["sin-texto", "articulo-x", "enlace"], "author_handle": "Suryanshti777", "author_name": "Suryansh Tiwari", "created_at": "2026-04-24T15:09:34.000Z", "metrics": {"bookmarks": 2725, "likes": 1353, "quotes": 9, "replies": 40, "retweets": 230, "views": 116391}}, {"id": "2047749268383944711", "url": "https://x.com/tom_doerr/status/2047749268383944711", "text": "Multi-agent AI token usage tracker and dashboard\n\nhttps://t.co/YtZ9NX14MQ https://t.co/SimhsOa2Pq", "summary": "Comparte un rastreador y panel (dashboard) de uso de tokens para sistemas multiagente de IA, disponible en GitHub.", "topic": "IA & Machine Learning", "tags": ["agentes-ia", "tokens", "dashboard", "monitorizacion", "open-source"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-04-24T18:47:25.000Z", "metrics": {"bookmarks": 10, "likes": 10, "quotes": 0, "replies": 1, "retweets": 3, "views": 2548}}, {"id": "2047759493581156377", "url": "https://x.com/mattpocockuk/status/2047759493581156377", "text": "FYI I just shipped a huge improvement to /improve-codebase-architecture\n\nIt now ships with a glossary of terminology to describe good/bad codebases\n\nEssential reading for anyone wanting to improve their codebases:\n\nhttps://t.co/mz3BRV044f", "summary": "Matt Pocock anuncia una mejora en su skill \"/improve-codebase-architecture\", que ahora incluye un glosario de terminología para describir código bueno y malo.", "topic": "Programación & Dev", "tags": ["code-quality", "software-architecture", "claude-skills", "glossary"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-04-24T19:28:03.000Z", "metrics": {"bookmarks": 3734, "likes": 3020, "quotes": 7, "replies": 37, "retweets": 221, "views": 144977}}, {"id": "2047875091174981780", "url": "https://x.com/codewithimanshu/status/2047875091174981780", "text": "Anthropic's Claude Code team just teaches how to automate your entire engineering workflow with Claude Code SDK in under 30 minutes.\n\nFor Free. From the engineers who built it.\n\nCANCEL Your Weekend Plans, and Learn to Automate Your Codebase Today.\n\nBookmark it. Watch it. Ship your first headless automation this weekend.\n\n$5,000/month. $10,000/month. $25,000/month.\n\nPeople are automating entire engineering teams with Claude Code SDK and charging clients $$$$. You're still copy-pasting code from ChatGPT manually.\n\nThis video fixes that tonight.\n\nFollow @codewithimanshu for more high-signal content that actually moves your AI engineering career forward.\n\n↓\n\nSid Bidasaria runs engineering on Claude Code at Anthropic. He just gave away the entire SDK + GitHub Action playbook in 30 minutes.\n\nThis is the talk that separates people automating their entire codebase from people still manually writing every commit.\n\nHere's everything inside.\n\nFollow @codewithimanshu for weekly Claude automation breakdowns.\n\n↓\n\nWhat the Claude Code SDK actually is.\n\nMost devs don't know this exists. They use Claude in the chat interface and call it a day.\n\nThe SDK is the real unlock.\n\nProgrammatic access to the Claude Code agent in headless mode. The primitive building block for every serious automation you'd ever want to build.\n\nDesigned like a Unix tool. Drops directly into terminal pipelines, bash scripts, CI/CD automation.\n\nUse it to review code. Write linters. Build chatbots. Manage remote code environments. Run an entire engineering pipeline.\n\nThis is how you stop \"using AI\" and start \"shipping with AI.\"\n\nFollow @codewithimanshu for full Claude SDK breakdowns every week.\n\n↓\n\nBasic usage that 99% of devs miss.\n\n`claude -p` to prompt the agent directly from your terminal.\n`--allowed-tools write` for controlled file system access.\n\nPipe anything into it:\n\n> Pipe `ifconfig` output → ask Claude to debug your network\n> Pipe error logs → get a fix before your coffee finishes brewing\n> Pipe a file → get instant code review without opening an editor\n\n`--output-format JSON` for structured responses you can parse in automated systems.\n\nThis is where Claude stops being a chat tool and becomes infrastructure.\n\nFollow @codewithimanshu for daily Claude SDK one-liners that save hours.\n\n↓\n\nPermission management without the security holes.\n\nThe biggest reason teams don't deploy AI in production: permission concerns.\n\nSid solves it cleanly:\n\n> No destructive permissions by default\n> `--allowed-tools` to pre-configure exactly what the agent can touch\n> `--permission-prompt-tool` to delegate authorization to an MCP server in real time\n\nYour AI agent gets full power exactly when it needs it. Zero access when it doesn't.\n\nThis is enterprise-grade AI security packaged as a single flag.\n\nMost tutorials hand-wave this. This one shows the architecture.\n\nFollow @codewithimanshu for production AI permission patterns every week.\n\n↓\n\nSession persistence: the multi-turn unlock.\n\nMost AI integrations forget everything between calls.\n\nThat's why your \"AI assistant\" feels like talking to someone with amnesia.\n\nReturn a `session ID` and Claude resumes exactly where you left off. Full context preserved. Multi-turn conversations across hours, days, deploys.\n\nThis is the foundation for building any real AI product that holds context.\n\nCustomize the system prompt while you're at it. `--system-prompt 'talk like a pirate'` if you want. Or build a serious agent persona for production.\n\nFollow @codewithimanshu for persistent context patterns for AI agents.\n\n↓\n\nThe Claude GitHub Action demo that should scare every dev.\n\nSid runs a live demo on a real quiz app:\n\n> Files an issue: \"add a 50/50 power-up and a skip power-up\"\n> Claude creates a to-do list\n> Claude modifies the files\n> Claude opens a Pull Request\n\nThe entire feature shipped from one issue. No human touching code.\n\nThis is automated code review, automated bug triage, automated feature implementation. From GitHub issues directly.\n\nJunior dev work just got compressed into the time it takes to write an issue description.\n\nFollow @codewithimanshu for GitHub Action setups for production.\n\n↓\n\nZero infrastructure required.\n\nEvery other AI automation tool needs:\n\n> A separate server\n> A deployment pipeline\n> Monitoring infrastructure\n> Auth setup\n> Cost tracking\n\nThe Claude GitHub Action uses your existing GitHub Action runners.\n\n`claude /install github action` in your local repo. Generates a YAML config. Done.\n\nYou go from idea to production AI automation in 60 seconds.\n\nMost people pay $200/month for tools that do less than this free Action.\n\nFollow @codewithimanshu for free Claude Action templates.\n\n↓\n\nThe 3-layer architecture nobody explains.\n\nSid breaks down the actual stack:\n\n> Layer 1: SDK - the foundation, raw programmatic access\n> Layer 2: Base Action - wraps the SDK as a clean API interface\n> Layer 3: PR Action - adds comments, formatting, full GitHub UX\n\nUnderstanding these layers is the difference between someone who copies tutorials and someone who builds custom AI infrastructure for clients.\n\nThis is the architectural insight that turns into $10K/month consulting contracts.\n\nFollow @codewithimanshu for weekly architecture deep dives.\n\n↓\n\n30 minutes from the engineer shipping this in production.\n\nYou'll learn more from this than from 6 months of YouTube tutorials made by people who've never automated a single deploy.\n\nPeople who watch this understand Claude Code automation at the infrastructure level.\n\nPeople who skip it keep manually reviewing PRs, manually filing issues, manually doing work that could've been automated last weekend.\n\nSave the video. Watch it tonight. Ship your first Claude SDK automation this weekend.\n\nFollow @codewithimanshu for more high-signal content that actually moves your AI engineering career forward.", "summary": "Hilo promocional extenso sobre el Claude Code SDK, basado en una charla de Sid Bidasaria (Anthropic): uso headless, gestión de permisos, persistencia de sesión y la GitHub Action de Claude para automatizar flujos de ingeniería completos.", "topic": "Programación & Dev", "tags": ["claude-code-sdk", "github-actions", "automatizacion", "anthropic", "headless"], "author_handle": "codewithimanshu", "author_name": "Himanshu Kumar", "created_at": "2026-04-25T03:07:24.000Z", "metrics": {"bookmarks": 1952, "likes": 775, "quotes": 2, "replies": 35, "retweets": 119, "views": 135474}}, {"id": "2047934140213760442", "url": "https://x.com/alexdaubois/status/2047934140213760442", "text": "If you're running your #PHP app using FrankenPHP, Ember detects it and adds a dedicated tab with per-thread introspection: state (busy/idle/inactive), current URI, request duration, memory usage with delta tracking, and a sparkline history.\n\nYou can even restart a worker directly from the TUI.", "summary": "Alexandre Daubois describe cómo Ember detecta automáticamente FrankenPHP en apps PHP y añade una pestaña con introspección por hilo (estado, URI, duración, memoria) y la posibilidad de reiniciar workers desde la TUI.", "topic": "Programación & Dev", "tags": ["frankenphp", "php", "ember", "tui", "monitorizacion"], "author_handle": "alexdaubois", "author_name": "Alexandre Daubois", "created_at": "2026-04-25T07:02:02.000Z", "metrics": {"bookmarks": 20, "likes": 58, "quotes": 0, "replies": 1, "retweets": 4, "views": 2894}}, {"id": "2047955648357576920", "url": "https://x.com/sairahul1/status/2047955648357576920", "text": "Karpathy didn't make a course.\n\nHe made THE course.\n\n3 hours. Free.\n\nTokenization. Attention. Hallucinations. Tool use. RLHF. DeepSeek. AlphaGo.\n\nEvery behavior you've ever wondered about in an LLM - where it comes from, why it exists, how it was engineered.\n\nThe gap between engineers who understand this and engineers who don't isn't technical depth.\n\nIt's the ability to conceive of entirely different things.", "summary": "Destaca un curso gratuito de 3 horas de Andrej Karpathy que explica en profundidad conceptos clave de los LLM como tokenización, atención, alucinaciones, uso de herramientas, RLHF, DeepSeek y AlphaGo.", "topic": "IA & Machine Learning", "tags": ["andrej-karpathy", "curso-gratuito", "llm", "formacion", "deep-learning"], "author_handle": "sairahul1", "author_name": "Rahul", "created_at": "2026-04-25T08:27:30.000Z", "metrics": {"bookmarks": 16290, "likes": 7311, "quotes": 22, "replies": 73, "retweets": 936, "views": 630260}}, {"id": "2047980036993548509", "url": "https://x.com/ghumare64/status/2047980036993548509", "text": "Instead of watching a movie, Learn how Andrej Karpathy (@karpathy), OpenAI co-founder, ex-Tesla AI, \"vibe coding\" creator explains why Claude Skills, MCP servers, and AI agents are past the hype and are now the new baseline for building in just 262 minutes ↓ https://t.co/UeHugmUJUO", "summary": "Rohit Ghumare recomienda un video de 262 minutos de Andrej Karpathy en el que explica por qué Claude Skills, los servidores MCP y los agentes de IA ya son la base estándar para construir software.", "topic": "IA & Machine Learning", "tags": ["karpathy", "claude-skills", "mcp", "agentes-ia", "video"], "author_handle": "ghumare64", "author_name": "Rohit Ghumare", "created_at": "2026-04-25T10:04:25.000Z", "metrics": {"bookmarks": 204, "likes": 100, "quotes": 0, "replies": 5, "retweets": 14, "views": 13880}}, {"id": "2048004868292678143", "url": "https://x.com/hasantoxr/status/2048004868292678143", "text": "Stop using Claude Code without this plugin.\n\nThere's an official Anthropic plugin called claude-code-setup.\n\nIt scans your entire project and tells you exactly what to activate.\n\n→ Which hooks to set up\n→ Which skills to install\n→ Which MCP servers fit your stack\n→ Which subagents to spin up\n→ Step-by-step config for each one\n\nYou just run one command:\n\n/plugin install claude-code-setup@claude-plugins-official\n\nAnd it audits your setup like a senior engineer reviewing your repo", "summary": "Promociona el plugin oficial de Anthropic 'claude-code-setup', que analiza el proyecto y recomienda qué hooks, skills, servidores MCP y subagentes activar, instalable con un solo comando.", "topic": "Programación & Dev", "tags": ["claude-code", "plugin", "mcp", "hooks", "subagentes"], "author_handle": "hasantoxr", "author_name": "Hasan Toor", "created_at": "2026-04-25T11:43:05.000Z", "metrics": {"bookmarks": 2514, "likes": 1321, "quotes": 7, "replies": 29, "retweets": 126, "views": 115013}}, {"id": "2048060850901008408", "url": "https://x.com/eng_khairallah1/status/2048060850901008408", "text": "🚨 Anthropic's own team just showed how to build production AI agents.\n\n30 minutes. free. from the engineers who built it.\n\nwatch the workshop. bookmark it.\n\nyou spent 6 months managing every workflow yourself.\n\nthey just showed how to put all of it on autopilot.\n\nThen read the guide below.", "summary": "Promociona un taller gratuito de 30 minutos, impartido por ingenieros de Anthropic, sobre cómo construir agentes de IA en producción.", "topic": "IA & Machine Learning", "tags": ["ai-agents", "anthropic", "workshop", "production-ai"], "author_handle": "eng_khairallah1", "author_name": "Khairallah AL-Awady", "created_at": "2026-04-25T15:25:32.000Z", "metrics": {"bookmarks": 2575, "likes": 1060, "quotes": 2, "replies": 66, "retweets": 187, "views": 244505}}, {"id": "2048071414054318378", "url": "https://x.com/AYi_AInotes/status/2048071414054318378", "text": "说个暴论，这可能是今年对AI辅助开发影响最大的一次更新，\n\nTS大神@mattpocockuk Pocock刚刚给他的代码架构改进技能，加了一份只有37行的官方术语表，\n\n要求所有AI输出必须严格使用里面的词汇，不能用component service API boundary这些烂大街的词，\n\n一开始以为这就是多此一举，看完才反应过来，这才是解决AI乱改代码的终极方案，\n\n以前AI给你的架构建议永远是正确的废话，它会告诉你要解耦要模块化，但不知道什么是深模块什么是浅模块，\n\n现在有了这套统一语言，它终于能准确说出这个模块是透传的没有价值，那个接口太浅应该合并，\n\n最狠的是那个删除测试，想象删掉这个模块，如果复杂度消失了，它就不该存在，\n\n如果复杂度分散到了所有调用方，它才真正创造了价值，\n\n不像是给人看的词汇表，更像是给AI定的思考规则，它把架构改进从凭感觉的艺术，变成了可重复可验证的工程。\nhttps://t.co/SNGLeKFDUZ", "summary": "Comentario en chino sobre el skill 'improve-codebase-architecture' de Matt Pocock, que añade un glosario oficial de 37 líneas para forzar que la IA use una terminología precisa (módulos profundos/superficiales, etc.) y convertir la mejora de arquitectura en un proceso reproducible.", "topic": "Programación & Dev", "tags": ["matt-pocock", "arquitectura-de-software", "terminologia", "claude-skills", "ai-agents"], "author_handle": "AYi_AInotes", "author_name": "AYi", "created_at": "2026-04-25T16:07:31.000Z", "metrics": {"bookmarks": 3154, "likes": 1972, "quotes": 11, "replies": 32, "retweets": 237, "views": 142169}}, {"id": "2048077085688672396", "url": "https://x.com/winspyredotcom/status/2048077085688672396", "text": "This book drains the swamp. \n\nOther books teach you to wrestle alligators better. \n\nSimple, costless actions that collapse complexity.\nNot another static 7-step framework.\n\nGrab it on Amazon →", "summary": "Promoción de un libro en Amazon que promete acciones simples y sin coste para reducir la complejidad, a diferencia de otros libros con frameworks estáticos de pasos.", "topic": "Productividad & Herramientas", "tags": ["libro", "productividad", "simplicidad", "autoayuda"], "author_handle": "winspyredotcom", "author_name": "Eren", "created_at": "2026-04-25T16:30:03.000Z", "metrics": {"bookmarks": 1200, "likes": 2073, "quotes": 9, "replies": 1, "retweets": 249, "views": 10308659}}, {"id": "2048081996841435596", "url": "https://x.com/rohit4verse/status/2048081996841435596", "text": "Graph is the final boss of memory.\n\nstacking markdown files isn't memory. it's context you keep re-loading into the prompt.\n\nreal memory is a graph. nodes, embeddings, traversal. it's how production agents remember.\n\nthe article is the workaround. the lecture is the architecture https://t.co/FeEpyYWiCe", "summary": "Argumenta que la memoria real de los agentes de IA no consiste en apilar archivos markdown, sino en usar grafos con nodos, embeddings y recorrido (traversal) para lograr memoria persistente en producción.", "topic": "IA & Machine Learning", "tags": ["memoria-de-agentes", "grafos", "embeddings", "agentes-ia"], "author_handle": "rohit4verse", "author_name": "Rohit", "created_at": "2026-04-25T16:49:34.000Z", "metrics": {"bookmarks": 2344, "likes": 858, "quotes": 8, "replies": 48, "retweets": 74, "views": 248813}}, {"id": "2048082184171602385", "url": "https://x.com/_vmlops/status/2048082184171602385", "text": "AI Harness Engineering\nInterview Preparation Handbook\n\nhttps://t.co/tSb85mN8JO https://t.co/QDy10WWIlY", "summary": "Vaishnavi comparte un manual de preparación de entrevistas sobre 'AI Harness Engineering' en un documento de Google Drive.", "topic": "IA & Machine Learning", "tags": ["harness-engineering", "entrevistas-de-trabajo", "recursos", "google-drive"], "author_handle": "_vmlops", "author_name": "Vaishnavi", "created_at": "2026-04-25T16:50:18.000Z", "metrics": {"bookmarks": 1868, "likes": 1318, "quotes": 3, "replies": 17, "retweets": 160, "views": 74829}}, {"id": "2048084765941604458", "url": "https://x.com/McKinsey/status/2048084765941604458", "text": "Agentic AI is changing how tech services create value.\n\nWe’re starting to see four distinct roles take shape, each with a different set of capabilities, bets and trade-offs.\n\nThe question isn’t whether to play but where to focus and how to build around it. https://t.co/Kg9LETGDur https://t.co/xPh9fS91UV", "summary": "McKinsey señala que la IA agéntica está cambiando la creación de valor en los servicios tecnológicos, identificando cuatro roles distintos con diferentes capacidades y apuestas.", "topic": "Economía & Finanzas", "tags": ["ia-agentica", "consultoria", "estrategia-empresarial", "mckinsey", "servicios-tecnologicos"], "author_handle": "McKinsey", "author_name": "McKinsey & Company", "created_at": "2026-04-25T17:00:34.000Z", "metrics": {"bookmarks": 988, "likes": 669, "quotes": 20, "replies": 39, "retweets": 134, "views": 253869}}, {"id": "2048087390712181059", "url": "https://x.com/VKazulkin/status/2048087390712181059", "text": "\"Simulating Expert Teams with Agentic AI and Amazon Bedrock AgentCore\".\nIn this post, we’ll walk through how this system works, demonstrate it  handling real queries, and extract patterns you can apply.\nhttps://t.co/o3hrQiCkBX", "summary": "Comparte un artículo sobre cómo simular equipos de expertos con IA agéntica usando Amazon Bedrock AgentCore, mostrando ejemplos de consultas reales y patrones aplicables.", "topic": "IA & Machine Learning", "tags": ["agentic-ai", "aws", "bedrock-agentcore", "multi-agent-systems"], "author_handle": "VKazulkin", "author_name": "Vadym Kazulkin", "created_at": "2026-04-25T17:11:00.000Z", "metrics": {"bookmarks": 13, "likes": 13, "quotes": 0, "replies": 1, "retweets": 2, "views": 974}}, {"id": "2048144417916166299", "url": "https://x.com/tom_doerr/status/2048144417916166299", "text": "High-speed web scraper for AI agents\n\nhttps://t.co/jqtVg1PgN4 https://t.co/RLdOPulMTM", "summary": "Tom Dörr comparte 'webclaw', un scraper web de alta velocidad diseñado para agentes de IA, disponible en GitHub.", "topic": "Programación & Dev", "tags": ["web-scraping", "ai-agents", "github", "webclaw"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-04-25T20:57:36.000Z", "metrics": {"bookmarks": 1152, "likes": 966, "quotes": 2, "replies": 8, "retweets": 98, "views": 44947}}, {"id": "2048166748575203593", "url": "https://x.com/KSimback/status/2048166748575203593", "text": "Weekends are for building... except today it was mostly cleaning up messy code\n\nSo I am publishing a skill I made to save you all some time - it's one command /tech-debt-skill\n\nAnd you'll get back a very thorough review file with everything that needs to be addressed\n\nAnd not just bugs and issues, but things that work but could be cleaned up or done better\n\nI spent half my day cleaning up Hermes Atlas, then did a review of everything that was done to clean it up and consolidated it into this skill, then ran it on another project and damn if it didn't find a lot\n\nBefore I started, I thought surely Claude Code has some built-in skills for this, but not really, and definitely not something that looks at tech debt holistically\n\nSo if AI is doing all your coding, and you're incrementally building within projects, you are 100% accumulating a lot of tech debt - use this skill every so often to clean it up and thank me later\n\nhttps://t.co/qHmbwN1K3s", "summary": "Kevin Simback publica una skill de Claude Code (/tech-debt-skill) que genera un informe exhaustivo de deuda técnica, identificando no solo bugs sino también código que funciona pero podría mejorarse.", "topic": "IA & Machine Learning", "tags": ["claude-code", "deuda-tecnica", "code-review", "skill", "github"], "author_handle": "KSimback", "author_name": "Kevin Simback 🍷", "created_at": "2026-04-25T22:26:20.000Z", "metrics": {"bookmarks": 1188, "likes": 646, "quotes": 2, "replies": 20, "retweets": 48, "views": 56450}}, {"id": "2048223579767177365", "url": "https://x.com/GitTrend0x/status/2048223579767177365", "text": "今天 GitHub 被工具到内存基建Agent军团彻底屠榜了🚀\n\n5 个星标暴增最狠的项目，专业拆解下！\n\n1.  Alishahryar1/free-claude-code\n 免费在终端、VSCode 或 Discord零成本跑 Claude Code，像 OpenClaw一样把付费 AI编码 Agent直接端到桌面上，彻底干掉高额订阅门槛。\n 🔗 直达 https://t.co/VdZzx8Ps02\n 程序员深夜还在为 Claude月费心疼？3975星一天直接把墙砸穿。现在你终端敲一行命令，Claude Agent就帮你把需求卷成代码，爽得像老板给你涨了10倍工资！\n 🟢\n\n2.  huggingface/ml-intern\n 开源 ML工程师 Agent，自动读论文、训练模型、打包部署，一人顶整个 ML 团队，解决手动科研到落地的全链路痛点。\n 🔗 直达 https://t.co/Kem26lhM1G\n 以前 ML 实习生干到吐血，现在HuggingFace 直接甩出这个 AI 卷王。1236星暴增，老板喊“谁来训模型”，你直接扔repo：它比你还996！\n 🟢🟢\n\n3.  luongnv89/claude-howto\n Claude Code 从零到高级 Agent的全可视化教程+即抄即用模板，帮开发者瞬间跨越从入门到生产Agent的陡峭曲线。\n 🔗 直达 https://t.co/yGg2Iowfyb\n 以前看 Claude 文档头秃，现在 242星一天的傻瓜式 Agent速成班直接复制粘贴起飞。程序员看了直呼终于有人把 Claude玩明白了，我今晚就能造个顶流 Agent！\n 🟢🟢🟢\n\n4.  alexzhang13/rlm\n 即插即用 Recursive Language Models 推理库，支持多种沙箱环境，解决传统 LLM在复杂 Agent任务里推理深度不够、容易迷路的硬伤。\n 🔗 直达 https://t.co/QnFC3rhW19\n 普通 LLM一轮思考就卡壳，这货递归下去像程序员熬夜 debug。227 星一天，Agent 终于能跟你一样“想三步走五步”，程序员共鸣拉满：AI也开始内卷了！\n 🟢🟢🟢🟢\n\n5.  MemoriLabs/Memori\n LLM 无关的 Agent 原生内存基础设施，把执行轨迹和对话转为结构化持久状态，彻底解决生产环境里Agent“聊完就忘”的致命Bug。\n 🔗 直达 https://t.co/TuAksDbtFJ\n 以前Agent上线聊两句就失忆翻车，现在115星一天直接给它装“永久硬盘”。生产系统再也不怕半夜报警，程序员上线第一句：哥们儿你还记得上周的任务吗？它记得，比你记性好！\n\n⚠️⚠️ \n\n总结\n\n从 Claude 免费入口、ML 实习生Agent，到 Claude 教程、递归推理、再到持久内存基础设施。Agent 军团全链路武装完毕，一个人顶 10人团队的时代直接在GitHub上核爆了🚀🤖", "summary": "Resumen en chino de cinco repositorios de GitHub en tendencia sobre agentes de IA: una alternativa gratuita a Claude Code, un agente de ingeniería ML de Hugging Face, un tutorial de Claude Code, una librería de modelos de lenguaje recursivos y una infraestructura de memoria persistente para agentes.", "topic": "Programación & Dev", "tags": ["github-trending", "claude-code", "agentes-ia", "memoria-persistente", "open-source"], "author_handle": "GitTrend0x", "author_name": "GitTrend", "created_at": "2026-04-26T02:12:10.000Z", "metrics": {"bookmarks": 55, "likes": 48, "quotes": 4, "replies": 3, "retweets": 6, "views": 13784}}, {"id": "2048358448014704705", "url": "https://x.com/tom_doerr/status/2048358448014704705", "text": "Programming book rules for AI coding agents\n\nhttps://t.co/LVYXR3fteQ https://t.co/PIx87wINVB", "summary": "Tom Dörr comparte un repositorio de GitHub (agent-rules-books) con reglas extraídas de libros de programación adaptadas para agentes de codificación con IA.", "topic": "Programación & Dev", "tags": ["coding-agents", "agent-rules", "github", "buenas-practicas"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-04-26T11:08:05.000Z", "metrics": {"bookmarks": 66, "likes": 56, "quotes": 0, "replies": 3, "retweets": 5, "views": 4465}}, {"id": "2048404578484236747", "url": "https://x.com/jcesarperez/status/2048404578484236747", "text": "Claude EM es tu compañero AI Engineering Manager que conoce tu equipo, tu contexto y tus herramientas.\n\nAhora en su versión 1.3.0, con nueva skill y otras mejoras y fixes.\n\nPruébalo y me cuentas!\n\nhttps://t.co/YyjCtC2GO5", "summary": "Presenta la versión 1.3.0 de Claude EM, un compañero de IA para engineering managers que conoce al equipo, su contexto y sus herramientas, con una nueva skill y mejoras.", "topic": "Programación & Dev", "tags": ["claude-em", "engineering-manager", "ia", "skills", "github"], "author_handle": "jcesarperez", "author_name": "Julio César Pérez", "created_at": "2026-04-26T14:11:23.000Z", "metrics": {"bookmarks": 8, "likes": 8, "quotes": 0, "replies": 0, "retweets": 1, "views": 614}}, {"id": "2048454056666878451", "url": "https://x.com/ds_nana_/status/2048454056666878451", "text": "Claude Code in Action\n\nLearn how Claude Code reads files, runs commands, and edits code via its tool system plus techniques for context management, custom workflows, hooks, and external integrations\n\nhttps://t.co/66h5bzb7X2", "summary": "Enlaza un recurso (\"Claude Code in Action\") que explica cómo Claude Code lee archivos, ejecuta comandos y edita código, además de técnicas de gestión de c
