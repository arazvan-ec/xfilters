: 3315, "likes": 2643, "quotes": 2, "replies": 49, "retweets": 317, "views": 112906}}, {"id": "2056403446056784288", "url": "https://x.com/ClaudeDevs/status/2056403446056784288", "text": "What are best practices for running Claude Code at scale?\n\nNew blog post on what we've learned from teams running it across multi-million-line monorepos, decades-old legacy systems, and distributed microservices:\n\nhttps://t.co/rJUYlIUiTT", "summary": "Blog post de ClaudeDevs sobre buenas prácticas para ejecutar Claude Code a gran escala, basado en la experiencia de equipos con monorepos de millones de líneas, sistemas legacy y microservicios distribuidos.", "topic": "Programación & Dev", "tags": ["claude-code", "best-practices", "monorepo", "scalability"], "author_handle": "ClaudeDevs", "author_name": "ClaudeDevs", "created_at": "2026-05-18T15:56:02.000Z", "metrics": {"bookmarks": 5759, "likes": 4391, "quotes": 73, "replies": 129, "retweets": 454, "views": 738413}}, {"id": "2056417039825428550", "url": "https://x.com/_vmlops/status/2056417039825428550", "text": "Harness\rEngineering\nA Design Guide to Claude Code\n\nhttps://t.co/SZ4NcP6lDe https://t.co/4uIgr9xNKy", "summary": "Anuncio de 'Harness Engineering: A Design Guide to Claude Code', con enlace a un documento alojado en Google Drive.", "topic": "Programación & Dev", "tags": ["harness-engineering", "claude-code", "guia-de-diseno"], "author_handle": "_vmlops", "author_name": "Vaishnavi", "created_at": "2026-05-18T16:50:03.000Z", "metrics": {"bookmarks": 1007, "likes": 885, "quotes": 2, "replies": 6, "retweets": 139, "views": 51384}}, {"id": "2056753238494335077", "url": "https://x.com/0xMovez/status/2056753238494335077", "text": "Spotify's Chief Architect just showed how they ship 4,5K deployments /day with Claude at Anthropic stage\n\n27-minutes. free. By #1 music app dev \n\n\"More than 99% of our engineers use AI coding tools. Adoption took off after Opus 4.5\" \n\nWorth more than any $500 vibe-coding course. https://t.co/5g697TGtDu", "summary": "El autor comenta una charla del Chief Architect de Spotify en el escenario de Anthropic sobre cómo logran 4.500 despliegues diarios con Claude, señalando que más del 99% de sus ingenieros usan herramientas de IA desde la llegada de Opus 4.5.", "topic": "IA & Machine Learning", "tags": ["spotify", "claude", "anthropic", "ci-cd", "opus-4-5"], "author_handle": "0xMovez", "author_name": "Movez", "created_at": "2026-05-19T15:05:59.000Z", "metrics": {"bookmarks": 19798, "likes": 6839, "quotes": 55, "replies": 174, "retweets": 527, "views": 2572170}}, {"id": "2056778173317005755", "url": "https://x.com/martinfowler/status/2056778173317005755", "text": "NEW POST\n\nBirgitta Böckeler begins an article about her experiences with sensors in an agent harness. This first part looks at static analysis with basic code linting.\n\nhttps://t.co/1setOl8i5d", "summary": "Martin Fowler comparte el inicio de un artículo de Birgitta Böckeler sobre 'sensores' en un harness de agentes; esta primera parte se centra en el análisis estático y el linting básico de código.", "topic": "Programación & Dev", "tags": ["agentes-de-codigo", "analisis-estatico", "linting", "martin-fowler"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-05-19T16:45:04.000Z", "metrics": {"bookmarks": 124, "likes": 116, "quotes": 0, "replies": 2, "retweets": 24, "views": 17185}}, {"id": "2056835339193561170", "url": "https://x.com/ClaudeDevs/status/2056835339193561170", "text": "Computer use turns Claude into an agent that can operate real UIs. \n\nNew blog post on making it reliable in production: getting click accuracy right, choosing thinking effort levels, keeping long sessions within context, and recording demonstrations Claude can replay:\n\nhttps://t.co/JwSI3YDWcK", "summary": "ClaudeDevs comparte un artículo sobre cómo hacer fiable en producción el 'computer use' de Claude: precisión de clics, niveles de esfuerzo de razonamiento, gestión del contexto en sesiones largas y grabación de demostraciones reproducibles.", "topic": "IA & Machine Learning", "tags": ["claude-computer-use", "agentes-ia", "produccion", "claude-blog"], "author_handle": "ClaudeDevs", "author_name": "ClaudeDevs", "created_at": "2026-05-19T20:32:13.000Z", "metrics": {"bookmarks": 1551, "likes": 2152, "quotes": 26, "replies": 77, "retweets": 167, "views": 244039}}, {"id": "2056880308851708233", "url": "https://x.com/AnthropicAI/status/2056880308851708233", "text": "Over the past few months, we've been holding dialogues with scholars, philosophers, clergy, and ethicists on the questions AI raises—starting with how good character forms.\n\nRead more about how we’re widening the conversation on frontier AI: https://t.co/vKGiODEq6q", "summary": "Anthropic explica que ha mantenido diálogos con académicos, filósofos, clérigos y especialistas en ética sobre cómo se forma el buen carácter de la IA, ampliando la conversación sobre la IA de frontera.", "topic": "IA & Machine Learning", "tags": ["anthropic", "etica-ia", "caracter-ia", "filosofia"], "author_handle": "AnthropicAI", "author_name": "Anthropic", "created_at": "2026-05-19T23:30:55.000Z", "metrics": {"bookmarks": 892, "likes": 2356, "quotes": 111, "replies": 432, "retweets": 331, "views": 450395}}, {"id": "2057034715534676458", "url": "https://x.com/adocomplete/status/2057034715534676458", "text": "So many must know pro-tips on how to get the most out of computer and browser use with Claude.\n\nIf you've used computer use and had issues getting Claude to click the right thing (like I have), I'm confident this post will have at least 2 things to help you. https://t.co/TzsM9cbSc1", "summary": "Comparte una publicación con consejos prácticos para mejorar el uso de \"computer use\" y navegación web con Claude, orientados a lograr que haga clic en el elemento correcto.", "topic": "Productividad & Herramientas", "tags": ["computer-use", "claude", "browser-automation", "tips"], "author_handle": "adocomplete", "author_name": "Ado", "created_at": "2026-05-20T09:44:28.000Z", "metrics": {"bookmarks": 47, "likes": 51, "quotes": 0, "replies": 3, "retweets": 5, "views": 4229}}, {"id": "2057034718198038751", "url": "https://x.com/adocomplete/status/2057034718198038751", "text": "Read the post: https://t.co/58xHZ3FNVg", "summary": "Enlace a la entrada del blog de Claude sobre buenas prácticas para el uso de ordenador y navegador con Claude ('computer use' y 'browser use').", "topic": "IA & Machine Learning", "tags": ["claude-ai", "computer-use", "browser-use", "buenas-practicas"], "author_handle": "adocomplete", "author_name": "Ado", "created_at": "2026-05-20T09:44:29.000Z", "metrics": {"bookmarks": 11, "likes": 8, "quotes": 0, "replies": 0, "retweets": 0, "views": 1499}}, {"id": "2057046584446091295", "url": "https://x.com/jeslopcru/status/2057046584446091295", "text": "Estupendo post sobre como trabajar con AI y guardrails https://t.co/81YbiDYToY \nAdemas si usas kotlin da unas cuantas herramientas muy utiles", "summary": "Jesus L.C. recomienda un artículo sobre cómo trabajar con IA y guardrails, señalando que también ofrece herramientas útiles si se usa Kotlin.", "topic": "IA & Machine Learning", "tags": ["guardrails", "ia", "kotlin", "desarrollo-seguro"], "author_handle": "jeslopcru", "author_name": "Jesus L.C.", "created_at": "2026-05-20T10:31:38.000Z", "metrics": {"bookmarks": 3, "likes": 0, "quotes": 0, "replies": 0, "retweets": 0, "views": 54}}, {"id": "2057076497593040970", "url": "https://x.com/freekmurze/status/2057076497593040970", "text": "🔗 Notes on software quality\nhttps://t.co/a3sutw8QVy\n#bestpractices #codequality #philosophy #craftsmanship", "summary": "Freek Van der Herten comparte un enlace con notas sobre la calidad del software, centradas en buenas prácticas, filosofía y artesanía en la programación.", "topic": "Programación & Dev", "tags": ["calidad-de-software", "buenas-practicas", "craftsmanship", "filosofia"], "author_handle": "freekmurze", "author_name": "Freek Van der Herten", "created_at": "2026-05-20T12:30:30.000Z", "metrics": {"bookmarks": 25, "likes": 19, "quotes": 0, "replies": 0, "retweets": 3, "views": 3033}}, {"id": "2057107389539553494", "url": "https://x.com/martinfowler/status/2057107389539553494", "text": "NEW §\n\nBirgitta Böckeler adds exploration of three sensors for static code analysis, with mixed results. Computational sensors alone cannot help us much, AI is needed to add semantic interpretation, and consider trade-offs.\n\nhttps://t.co/GtZqpRawAs", "summary": "Martin Fowler destaca un nuevo artículo de Birgitta Böckeler que explora tres 'sensores' para el análisis estático de código, concluyendo que los sensores puramente computacionales no bastan y que se necesita IA para añadir interpretación semántica.", "topic": "Programación & Dev", "tags": ["analisis-estatico", "martin-fowler", "ia-en-codigo"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-05-20T14:33:15.000Z", "metrics": {"bookmarks": 36, "likes": 56, "quotes": 0, "replies": 2, "retweets": 6, "views": 9854}}, {"id": "2057788210949030351", "url": "https://x.com/ParthJadhav8/status/2057788210949030351", "text": "HOLY SHIT !! @cursor_ai 's /thermo-nuclear-code-quality-review skill is nuts \n\nIt ran for around 30 mins on my PR and immensely improved the code quality.\n\nIt's 67x better than /simplify from Claude code..", "summary": "Elogia la skill '/thermo-nuclear-code-quality-review' de Cursor, que tras 30 minutos de ejecución en un PR mejoró notablemente la calidad del código, afirmando que es muy superior a '/simplify' de Claude Code.", "topic": "Programación & Dev", "tags": ["cursor", "claude-code", "code-review", "calidad-de-codigo", "skills"], "author_handle": "ParthJadhav8", "author_name": "Parth Jadhav", "created_at": "2026-05-22T11:38:36.000Z", "metrics": {"bookmarks": 2446, "likes": 1821, "quotes": 17, "replies": 61, "retweets": 52, "views": 280104}}, {"id": "2057924890330644925", "url": "https://x.com/defileo/status/2057924890330644925", "text": "Anthropic just paid millions to hire Andrej Karpathy.\n\nHe gave you the same knowledge for $0 the same week.\n\nCo-founder of OpenAI, former head of AI at Tesla, the man who coined vibe coding.\n\nNo recruitment fee, no exclusive access, no $500,000 wire transfer, just a link and 29 minutes.\n\nLLMs are ghosts not animals, vibe coding is dead, Software 3.0 is here...", "summary": "Comenta que Andrej Karpathy compartió gratis, en una charla de 29 minutos, ideas como que \"los LLM son fantasmas, no animales\", que el \"vibe coding\" ha muerto y que \"Software 3.0\" ya está aquí, poco después de que Anthropic lo contratara.", "topic": "IA & Machine Learning", "tags": ["andrej-karpathy", "software-3.0", "vibe-coding", "llm"], "author_handle": "defileo", "author_name": "Defileo🔮", "created_at": "2026-05-22T20:41:42.000Z", "metrics": {"bookmarks": 4340, "likes": 1572, "quotes": 8, "replies": 49, "retweets": 162, "views": 553178}}, {"id": "2057933169085808788", "url": "https://x.com/every/status/2057933169085808788", "text": "@tbpn 🫡 AI progress creates more work for humans, not less: https://t.co/VON5WmZMvk", "summary": "Every comparte un ensayo que argumenta que el progreso de la IA está generando más trabajo para los humanos, no menos.", "topic": "IA & Machine Learning", "tags": ["automatizacion", "futuro-del-trabajo", "ai-progress", "ensayo"], "author_handle": "every", "author_name": "Every 📧", "created_at": "2026-05-22T21:14:36.000Z", "metrics": {"bookmarks": 3, "likes": 3, "quotes": 0, "replies": 1, "retweets": 0, "views": 419}}, {"id": "2058057460792074625", "url": "https://x.com/_vmlops/status/2058057460792074625", "text": "GOOGLE OPENED THE VAULT\n\nTheir internal engineering practices the actual code review guidelines used by every engineer at google are public on github\n\n→ two guides: one for reviewers, one for authors\n→ explains what \"LGTM\" and \"CL\" mean internally\n\nmost devs write code... few know how to review it\n\ngoogle does\n\nhttps://t.co/J5bboiiYwh", "summary": "El autor destaca que Google ha publicado en GitHub sus guías internas de revisión de código (para revisores y para autores), incluyendo el significado de términos internos como 'LGTM' y 'CL'.", "topic": "Programación & Dev", "tags": ["google", "code-review", "buenas-practicas", "eng-practices"], "author_handle": "_vmlops", "author_name": "Vaishnavi", "created_at": "2026-05-23T05:28:30.000Z", "metrics": {"bookmarks": 1192, "likes": 831, "quotes": 1, "replies": 6, "retweets": 121, "views": 52235}}, {"id": "2058074600060137892", "url": "https://x.com/Dinosn/status/2058074600060137892", "text": "denissergeevitch/agents-best-practices: Provider-neutral Agent Skill for Codex, Claude Code, and agentic harness design. https://t.co/gAKogBCNxW", "summary": "Comparte un repositorio de GitHub con una 'Agent Skill' neutral respecto al proveedor, pensada para Codex, Claude Code y el diseño de harnesses agénticos en general.", "topic": "Programación & Dev", "tags": ["agents-best-practices", "claude-code", "codex", "github", "agent-skills"], "author_handle": "Dinosn", "author_name": "Nicolas Krassas", "created_at": "2026-05-23T06:36:36.000Z", "metrics": {"bookmarks": 40, "likes": 43, "quotes": 0, "replies": 1, "retweets": 7, "views": 2930}}, {"id": "2058193075181089247", "url": "https://x.com/0xMovez/status/2058193075181089247", "text": "Anthropic AI engineer just showed how to give AI agents real memory in 4 steps - and it changes everything\n\nin 28 minutes he shows exactly how agents can remember across sessions, completely free\n\nworth more than any $500 AI engineering course\n\nhere's what he covers:\n\n• why agents forget everything between sessions \n• memory stores - agents read, write across sessions \n• dreaming - agents that improve their own memory \n• 95% cache hit rate, so it stays cheap\n\nmost people are still copy-pasting context into every new chat - while the people who figured this out are building agents that get smarter every single night\n\nwatch full video then read article below", "summary": "Movez resume un video de 28 minutos de un ingeniero de Anthropic que explica en 4 pasos cómo dar memoria persistente entre sesiones a los agentes de IA, con almacenes de memoria y una tasa de acierto de caché del 95%.", "topic": "IA & Machine Learning", "tags": ["memoria-de-agentes", "anthropic", "agentes-ia", "cache"], "author_handle": "0xMovez", "author_name": "Movez", "created_at": "2026-05-23T14:27:23.000Z", "metrics": {"bookmarks": 8523, "likes": 3247, "quotes": 14, "replies": 108, "retweets": 454, "views": 707771}}, {"id": "2058255964931776938", "url": "https://x.com/Dinosn/status/2058255964931776938", "text": "A single CLAUDE.md file to improve Claude Code behavior, derived from Andrej Karpathy's observations on LLM coding pitfalls. https://t.co/AekeGIMhan", "summary": "Comparte un único archivo CLAUDE.md para mejorar el comportamiento de Claude Code, basado en las observaciones de Andrej Karpathy sobre los errores habituales de la codificación con LLM.", "topic": "Programación & Dev", "tags": ["claude-md", "claude-code", "karpathy", "buenas-practicas", "github"], "author_handle": "Dinosn", "author_name": "Nicolas Krassas", "created_at": "2026-05-23T18:37:17.000Z", "metrics": {"bookmarks": 59, "likes": 58, "quotes": 0, "replies": 1, "retweets": 8, "views": 3355}}, {"id": "2058281426257358947", "url": "https://x.com/addyosmani/status/2058281426257358947", "text": "\"Cognitive surrender is when you stop thinking altogether and blindly accept the answer the AI gives you\" https://t.co/qfUVRH7LkB", "summary": "Cita sobre la \"rendición cognitiva\": dejar de pensar por completo y aceptar sin cuestionar la respuesta que da la IA.", "topic": "IA & Machine Learning", "tags": ["cognitive-surrender", "critical-thinking", "ai-ethics"], "author_handle": "addyosmani", "author_name": "Addy Osmani", "created_at": "2026-05-23T20:18:27.000Z", "metrics": {"bookmarks": 695, "likes": 1911, "quotes": 59, "replies": 106, "retweets": 287, "views": 141247}}, {"id": "2058305801215963372", "url": "https://x.com/addyosmani/status/2058305801215963372", "text": "The full video for our \"fireside chat on the evolution of developer craft\" is live: https://t.co/baSTziDwOz with @rseroter @the_thagomizer &amp; Ciera Jaspan", "summary": "Addy Osmani publica el video completo de una charla sobre la evolución del oficio del desarrollador, junto a Richard Seroter, the_thagomizer y Ciera Jaspan.", "topic": "Programación & Dev", "tags": ["developer-craft", "video", "charla", "addy-osmani"], "author_handle": "addyosmani", "author_name": "Addy Osmani", "created_at": "2026-05-23T21:55:19.000Z", "metrics": {"bookmarks": 58, "likes": 78, "quotes": 3, "replies": 4, "retweets": 16, "views": 27929}}, {"id": "2058362981293887893", "url": "https://x.com/slashdot/status/2058362981293887893", "text": "Linus Torvalds on How AI is Impacting the Hunt for Linux Kernel Bugs https://t.co/CFknp6VttE", "summary": "Slashdot enlaza a un artículo sobre las declaraciones de Linus Torvalds acerca de cómo la IA está afectando a la búsqueda de bugs en el kernel de Linux.", "topic": "Programación & Dev", "tags": ["linus-torvalds", "linux-kernel", "ia", "bugs"], "author_handle": "slashdot", "author_name": "Slashdot", "created_at": "2026-05-24T01:42:31.000Z", "metrics": {"bookmarks": 1, "likes": 7, "quotes": 0, "replies": 0, "retweets": 1, "views": 3518}}, {"id": "2058489053385760947", "url": "https://x.com/antonarhipov/status/2058489053385760947", "text": "Just published slides for my #KotlinConf 2026 talk on Spec-Driven Development\n\nhttps://t.co/sPlih1WCEv", "summary": "Anton Arhipov publica las diapositivas de su charla en KotlinConf 2026 sobre desarrollo dirigido por especificaciones (Spec-Driven Development) con agentes de IA.", "topic": "Programación & Dev", "tags": ["kotlinconf", "spec-driven-development", "charla", "diapositivas"], "author_handle": "antonarhipov", "author_name": "Anton Arhipov", "created_at": "2026-05-24T10:03:29.000Z", "metrics": {"bookmarks": 39, "likes": 42, "quotes": 2, "replies": 5, "retweets": 5, "views": 2337}}, {"id": "2058914803360600238", "url": "https://x.com/lennysan/status/2058914803360600238", "text": "My biggest takeaways from @danshipper:\n\n1. The future of work will happen inside Codex or Claude Code. Instead of putting AI into your SaaS tool, you’ll use your SaaS tools inside your favorite AI agents' in-app browser. Dan spends all his time in Codex now—writing documents, managing email, doing research, everything. He's using Google Docs, PostHog, and everything he needs within the agent's in-app browser. The agent can see what he’s doing, and has all of his context, so he and his agent collaborate quickly and super effectively.\n\n2. Automation is a lie—every automation needs a human. Dan's company doubled in size this year despite being incredibly AI-forward. Why? Because in order to make automation work well, you need humans making sure everything keeps working. This is why benchmarks are misleading—they measure AI on problems we’ve already framed and can score, but there’s always a higher frame.\n\n3. PMs will win the AI era. Marcus, a former PM who previously ran Axios’s writing product, joined Every after getting super AI-pilled. Now he runs their product Spiral, and ships faster than anyone on the team. He pairs technical knowledge with spiky product sense, deep user empathy, and an eye for what matters. Dan thinks any PM who gets really AI-native will be incredibly dangerous because the building is done for you—what matters is figuring out what to build and if it’s great.\n\n4. Full-stack designers are becoming superheroes. Designers used to make beautiful interactions that engineers didn’t want to build or couldn’t execute properly. Now designers don’t need to hand things off; they can build it themselves. Designers are naturally creative people, and AI is the perfect tool for them because it lets them bring their vision to life without the traditional bottlenecks.\n\n5. SaaS is not dead. In fact, Dan is bullish on SaaS stocks. When users bring their own AI (via Codex or Claude Code) to use SaaS products, the user—not the SaaS company—pays for tokens. This saves SaaS company’s margins. Since the agents need their own seats, Dan predicts that agents will create massive new demand for SaaS because there will be tons of agents using these products at high volume.\n\n6. Every company will have one “super-agent” inside their Slack that every employee will use. Dan initially thought every employee would have their personal work agent, like a shadow AI org chart, but he’s completely flipped his view. He realized agents need humans who care about them. When someone gets tired of maintaining their personal agent, it becomes useless. The winning model is one forward-deployed engineer or AI-savvy person who maintains a company-wide agent (like Shopify’s River or Viktor), and then it trickles down to more specialized team agents as models improve and become less fiddly.\n\n7. The AI job apocalypse is not happening, but you do need to evolve to stay relevant. Models make yesterday’s human competence cheap. But because everyone uses the same models, it all looks the same if you use it the default way; it becomes commoditized slop. Humans then take that frozen competence and use it to make something new and interesting for their specific situation. The key: “ride the models”—use them for everything you do, try new models when they drop, keep turning over rocks.\n\n8. We will read way more AI-generated writing, and we will like it. Human writing is incredibly important for things that matter, but for internal docs, planning, and email, AI-generated is often better because most people are bad at writing strategy documents.\n\n9. Build software for humans and agents to use together. The current model is building a CLI that an agent uses independently. Instead, you and your agent should be using the app together. This creates new design challenges—agents can make a billion requests in three seconds, so you need approval flows, inboxes that summarize what happened, logs, and easy rollback. \n\n10. Forward-deployed engineers are the new most essential role. The big model companies have teams of people managing their internal agents, and those teams aren’t going away. It’s different from traditional software building, and certain engineers love it. As models get better, this role will evolve—you’ll be managing more agents doing more things.", "summary": "Lenny Rachitsky resume diez conclusiones de Dan Shipper sobre el futuro del trabajo con IA: el trabajo se hará dentro de Codex o Claude Code, la automatización siempre necesita humanos, los PMs y diseñadores full-stack ganarán protagonismo, y cada empresa tendrá un 'super-agente' compartido.", "topic": "IA & Machine Learning", "tags": ["futuro-del-trabajo", "agentes-ia", "codex", "claude-code", "product-management"], "author_handle": "lennysan", "author_name": "Lenny Rachitsky", "created_at": "2026-05-25T14:15:16.000Z", "metrics": {"bookmarks": 3615, "likes": 2093, "quotes": 87, "replies": 153, "retweets": 238, "views": 765989}}, {"id": "2059190700827140495", "url": "https://x.com/badlogicgames/status/2059190700827140495", "text": "recommended reading.\n\nhttps://t.co/2GgZb04PoE", "summary": "Recomienda la lectura de un artículo, sin más comentario en el texto del tuit.", "topic": "Programación & Dev", "tags": ["lectura-recomendada", "blog", "ia-en-programacion"], "author_handle": "badlogicgames", "author_name": "Mario Zechner", "created_at": "2026-05-26T08:31:35.000Z", "metrics": {"bookmarks": 1849, "likes": 1288, "quotes": 5, "replies": 17, "retweets": 87, "views": 73873}}, {"id": "2059282155922948194", "url": "https://x.com/bibryam/status/2059282155922948194", "text": "The 8 Levels of Agentic Engineering\nhttps://t.co/7aGzJCQIVG", "summary": "Enlaza un artículo titulado \"The 8 Levels of Agentic Engineering\", que describe niveles progresivos de madurez en ingeniería agéntica.", "topic": "IA & Machine Learning", "tags": ["agentic-engineering", "ai-agents", "framework"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2026-05-26T14:35:00.000Z", "metrics": {"bookmarks": 240, "likes": 164, "quotes": 0, "replies": 4, "retweets": 26, "views": 10490}}, {"id": "2059319662597611914", "url": "https://x.com/nurijanian/status/2059319662597611914", "text": "my favorite engineering skills for AI:\n\n- Compound Engineering: https://t.co/BM7tA2RAHf\n- Ryan Singer's shaping skills: https://t.co/yaWg0nI7Vm\n- Matt Pocock's skills: https://t.co/0WtRqce6x5\n\nI switched from Superpowers to Compound Engineering as they perfected the plugin over time, and I'm pretty sure I still only use like 10% of it", "summary": "El autor comparte sus skills de ingeniería con IA favoritos —Compound Engineering, las 'shaping skills' de Ryan Singer y los skills de Matt Pocock— y comenta que cambió de Superpowers a Compound Engineering.", "topic": "Programación & Dev", "tags": ["claude-skills", "compound-engineering", "shaping-skills", "matt-pocock"], "author_handle": "nurijanian", "author_name": "George from 🕹prodmgmt.world", "created_at": "2026-05-26T17:04:02.000Z", "metrics": {"bookmarks": 1926, "likes": 1025, "quotes": 5, "replies": 22, "retweets": 95, "views": 73019}}, {"id": "2059351260243919269", "url": "https://x.com/AnthropicAI/status/2059351260243919269", "text": "New on the Engineering Blog: The access and permissions we grant agents should evolve with their capabilities. In our own products, we set these parameters through sandboxing, which limits the scope of any potentially destructive actions.\n\nRead more: https://t.co/KfBKW8O9kP", "summary": "Anthropic publica en su blog de ingeniería que los permisos y el acceso otorgados a los agentes deben evolucionar junto a sus capacidades, y explica cómo usan el sandboxing para limitar acciones potencialmente destructivas.", "topic": "IA & Machine Learning", "tags": ["anthropic", "sandboxing", "seguridad-de-agentes", "permisos"], "author_handle": "AnthropicAI", "author_name": "Anthropic", "created_at": "2026-05-26T19:09:35.000Z", "metrics": {"bookmarks": 1195, "likes": 2118, "quotes": 80, "replies": 331, "retweets": 279, "views": 433833}}, {"id": "2059389183962284204", "url": "https://x.com/every/status/2059389183962284204", "text": "Here's the template Codex prompt we use to draft GTM plans at Every.\n\nWhen you've already done the big picture thinking in meetings and @SlackHQ, the next step is just prompting an agent to make a plan for you and the agent to review together. https://t.co/cBn5fAiBAk", "summary": "Every comparte la plantilla de prompt de Codex que utilizan internamente para redactar planes de 'go-to-market' (GTM) a partir de lo ya discutido en reuniones y Slack.", "topic": "Marketing & Redes", "tags": ["codex", "gtm", "prompt-engineering", "plantilla", "marketing"], "author_handle": "every", "author_name": "Every 📧", "created_at": "2026-05-26T21:40:17.000Z", "metrics": {"bookmarks": 89, "likes": 58, "quotes": 1, "replies": 1, "retweets": 2, "views": 5481}}, {"id": "2059844244907696186", "url": "https://x.com/addyosmani/status/2059844244907696186", "text": "https://t.co/0DyFIXJueI", "summary": "Enlace a un artículo de X publicado por Addy Osmani, sin texto descriptivo adicional en el tuit.", "topic": "Otros", "tags": ["sin-texto", "articulo-x", "enlace"], "author_handle": "addyosmani", "author_name": "Addy Osmani", "created_at": "2026-05-28T03:48:32.000Z", "metrics": {"bookmarks": 4997, "likes": 2579, "quotes": 207, "replies": 84, "retweets": 376, "views": 800727}}, {"id": "2060390852619272526", "url": "https://x.com/bcherny/status/2060390852619272526", "text": "Salesforce published a detailed writeup on going agentic with Claude Code. A couple things jumped out.\n\nA migration they'd scoped at 231 days shipped in 13. One PR delivered 21 endpoints at 100% test coverage.", "summary": "Comenta un artículo de Salesforce sobre su adopción agéntica de Claude Code, destacando una migración estimada en 231 días que se completó en 13, y un PR que entregó 21 endpoints con 100% de cobertura de tests.", "topic": "Programación & Dev", "tags": ["claude-code", "salesforce", "caso-de-uso", "migracion", "productividad"], "author_handle": "bcherny", "author_name": "Boris Cherny", "created_at": "2026-05-29T16:00:34.000Z", "metrics": {"bookmarks": 1666, "likes": 3711, "quotes": 41, "replies": 145, "retweets": 180, "views": 404778}}, {"id": "2060432233878487512", "url": "https://x.com/rseroter/status/2060432233878487512", "text": "\"The biggest lesson in this shift is that AI doesn’t eliminate bottlenecks in software development, but it does move them.\" https://t.co/wfqPcZZ7Sg &lt; some good lessons learned by @Dropbox and shared in this post", "summary": "Cita una lección de Dropbox: la IA no elimina los cuellos de botella en el desarrollo de software, sino que los desplaza a otra parte del proceso.", "topic": "Programación & Dev", "tags": ["dropbox", "engineering-productivity", "ai-agents", "bottlenecks"], "author_handle": "rseroter", "author_name": "Richard Seroter", "created_at": "2026-05-29T18:45:00.000Z", "metrics": {"bookmarks": 26, "likes": 19, "quotes": 0, "replies": 1, "retweets": 3, "views": 1816}}, {"id": "2061900434722496604", "url": "https://x.com/ClaudeDevs/status/2061900434722496604", "text": "How do you get Claude Code to check its own work before handing it back?\n\nWatch how you can encode your manual checks so Claude closes its own feedback loop: https://t.co/gxastVL4QH", "summary": "ClaudeDevs plantea cómo lograr que Claude Code revise su propio trabajo antes de entregarlo, mostrando cómo codificar comprobaciones manuales para cerrar el bucle de feedback del agente.", "topic": "Programación & Dev", "tags": ["claude-code", "feedback-loop", "automatizacion", "verificacion"], "author_handle": "ClaudeDevs", "author_name": "ClaudeDevs", "created_at": "2026-06-02T19:59:06.000Z", "metrics": {"bookmarks": 10218, "likes": 7096, "quotes": 44, "replies": 156, "retweets": 460, "views": 989063}}, {"id": "2061907337154367865", "url": "https://x.com/trq212/status/2061907337154367865", "text": "https://t.co/R6exTuF7P8", "summary": "Enlace a un artículo de X (x.com/i/article) sin texto descriptivo adicional.", "topic": "Otros", "tags": ["articulo", "x-com", "sin-contexto"], "author_handle": "trq212", "author_name": "Thariq", "created_at": "2026-06-02T20:26:32.000Z", "metrics": {"bookmarks": 24339, "likes": 10790, "quotes": 294, "replies": 270, "retweets": 1413, "views": 3203458}}, {"id": "2062166977020338329", "url": "https://x.com/Kikobeats/status/2062166977020338329", "text": "Cutting Docker build size by ~99.8% (1.87 GB → 2.5 MB)\n\nJust using https://t.co/3t0TQ3aP9Q 😌 https://t.co/JylO9BBhbz", "summary": "Kiko Beats muestra cómo redujo el tamaño de una imagen Docker en un 99,8% (de 1,87 GB a 2,5 MB) usando su herramienta de código abierto 'untracked'.", "topic": "Programación & Dev", "tags": ["docker", "optimizacion", "devops", "herramientas", "github"], "author_handle": "Kikobeats", "author_name": "Kiko Beats", "created_at": "2026-06-03T13:38:15.000Z", "metrics": {"bookmarks": 3149, "likes": 2460, "quotes": 6, "replies": 44, "retweets": 120, "views": 330643}}, {"id": "2062257863729332325", "url": "https://x.com/Kikobeats/status/2062257863729332325", "text": "@sihmael this explains https://t.co/pTD87Uyyub", "summary": "Respuesta breve de Kiko Beats ('esto lo explica') con un enlace, sin más contexto textual sobre el contenido enlazado.", "topic": "Otros", "tags": ["sin-contexto", "respuesta", "enlace"], "author_handle": "Kikobeats", "author_name": "Kiko Beats", "created_at": "2026-06-03T19:39:24.000Z", "metrics": {"bookmarks": 4, "likes": 146, "quotes": 0, "replies": 2, "retweets": 3, "views": 16009}}, {"id": "2062273703447233004", "url": "https://x.com/every/status/2062273703447233004", "text": "Our Opus 4.8 pulse check after another week of testing: https://t.co/J7qDoTqwII", "summary": "Comparte un 'pulse check' semanal sobre el modelo Opus 4.8 tras otra semana de pruebas.", "topic": "IA & Machine Learning", "tags": ["opus-4-8", "anthropic", "evaluacion-de-modelos", "benchmarking"], "author_handle": "every", "author_name": "Every 📧", "created_at": "2026-06-03T20:42:20.000Z", "metrics": {"bookmarks": 20, "likes": 28, "quotes": 0, "replies": 3, "retweets": 2, "views": 4197}}, {"id": "2062508992207655269", "url": "https://x.com/vladikk/status/2062508992207655269", "text": "Counting dependencies tells you the number of dependencies. It tells you nothing about the design. What matters is the kind of knowledge shared across component boundaries. A single reference sharing extraneous knowledge can cause orders of magnitude more cascading changes than a hundred dependencies through well-designed integration interfaces.\n\nRead Birgitta's piece on @martinfowler blog: https://t.co/jDy0nFoYWx", "summary": "Vlad Khononov argumenta que contar dependencias no revela nada sobre la calidad del diseño; lo importante es el tipo de conocimiento compartido entre componentes. Enlaza un artículo del blog de Martin Fowler sobre \"sensores para agentes de codificación\".", "topic": "Programación & Dev", "tags": ["software-architecture", "coupling", "martin-fowler", "coding-agents"], "author_handle": "vladikk", "author_name": "Vlad Khononov", "created_at": "2026-06-04T12:17:17.000Z", "metrics": {"bookmarks": 2, "likes": 1, "quotes": 0, "replies": 0, "retweets": 0, "views": 406}}, {"id": "2062909794512429087", "url": "https://x.com/KirkDBorne/status/2062909794512429087", "text": "Highly rated new book from @PacktPublishing @PacktDataML ...\n\n\"Architecting Generative AI Applications: Build, deploy, and scale production-ready GenAI systems with LLMOps best practices\"\n\nSee it at https://t.co/qEfwoYVBdT https://t.co/kgcRnSBf5h", "summary": "Promoción del libro 'Architecting Generative AI Applications', que explica cómo construir, desplegar y escalar sistemas de IA generativa en producción siguiendo buenas prácticas de LLMOps.", "topic": "IA & Machine Learning", "tags": ["libro", "llmops", "genai", "arquitectura-de-ia"], "author_handle": "KirkDBorne", "author_name": "Kirk Borne", "created_at": "2026-06-05T14:49:56.000Z", "metrics": {"bookmarks": 34, "likes": 75, "quotes": 1, "replies": 3, "retweets": 14, "views": 2616}}, {"id": "2063027333766803536", "url": "https://x.com/bibryam/status/2063027333766803536", "text": "Best practices to secure code with Claude\nhttps://t.co/wMaPLiFaWN", "summary": "Bilgin Ibryam comparte un artículo del blog de Claude sobre buenas prácticas para asegurar código usando Claude.", "topic": "IA & Machine Learning", "tags": ["claude", "seguridad-de-codigo", "buenas-practicas", "llm"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2026-06-05T22:37:00.000Z", "metrics": {"bookmarks": 80, "likes": 67, "quotes": 0, "replies": 1, "retweets": 9, "views": 4957}}, {"id": "2063132526936277399", "url": "https://x.com/bibryam/status/2063132526936277399", "text": "How Boris Cherny Uses Claude Code\nhttps://t.co/yvTZnrEnPB", "summary": "Bilgin Ibryam comparte un artículo sobre cómo Boris Cherny, creador de Claude Code, utiliza la herramienta en su propio flujo de trabajo.", "topic": "Programación & Dev", "tags": ["claude-code", "boris-cherny", "flujo-de-trabajo", "entrevista"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2026-06-06T05:35:00.000Z", "metrics": {"bookmarks": 70, "likes": 38, "quotes": 0, "replies": 0, "retweets": 4, "views": 4049}}, {"id": "2063276005859393884", "url": "https://x.com/pragdave/status/2063276005859393884", "text": "A new article on the perils of forgetting the basics in the heat of AI-assisted coding.\n\nLink below https://t.co/wzRjOpQtAr", "summary": "Dave Thomas comparte un artículo sobre los peligros de olvidar los fundamentos de programación en medio del auge de la codificación asistida por IA.", "topic": "Programación & Dev", "tags": ["ai-assisted-coding", "buenas-practicas", "fundamentos"], "author_handle": "pragdave", "author_name": "Dave Thomas", "created_at": "2026-06-06T15:05:08.000Z", "metrics": {"bookmarks": 18, "likes": 32, "quotes": 0, "replies": 4, "retweets": 10, "views": 4693}}, {"id": "2063276008619356280", "url": "https://x.com/pragdave/status/2063276008619356280", "text": "https://t.co/Y4H6rnwR4n", "summary": "Comparte un enlace a un artículo en Substack titulado 'Failing Faster', sin texto adicional en el tuit.", "topic": "Programación & Dev", "tags": ["pragdave", "failing-faster", "substack", "desarrollo-de-software"], "author_handle": "pragdave", "author_name": "Dave Thomas", "created_at": "2026-06-06T15:05:08.000Z", "metrics": {"bookmarks": 10, "likes": 4, "quotes": 0, "replies": 2, "retweets": 1, "views": 2439}}, {"id": "2063321324605280569", "url": "https://x.com/0xchromium/status/2063321324605280569", "text": "Andrej Karpathy spent 2h showing how he actually uses AI day to day\n\nhe's a co-founder of OpenAI and led AI at Tesla, so when he shows how he works, it’s worth watching\n\nand the whole session is just him telling the machine what he wants in simple terms, like he's briefing a coworker\n\nwatch what's actually happening the entire time:\n\n> he describes the task in normal words\n> it goes off and does the work\n> he glances at the result and nudges it with one more sentence\n\nthat's the whole skill, and you've had it since you learned to talk\n\nthe only gap between that and a worker that runs on its own is handing that sentence a schedule and the tools to act\n\ncheck his work, then build the version that keeps working when you stop", "summary": "Describe una sesión de dos horas de Andrej Karpathy mostrando cómo usa la IA en su día a día: describe la tarea en lenguaje natural, deja que el agente trabaje y ajusta el resultado con una frase, como si instruyera a un compañero.", "topic": "IA & Machine Learning", "tags": ["andrej-karpathy", "ai-agents", "natural-language", "automation"], "author_handle": "0xchromium", "author_name": "Chrome", "created_at": "2026-06-06T18:05:13.000Z", "metrics": {"bookmarks": 29568, "likes": 10717, "quotes": 26, "replies": 129, "retweets": 1263, "views": 1785765}}, {"id": "2063382238931152907", "url": "https://x.com/KirkDBorne/status/2063382238931152907", "text": "The Art of Problem Solving (AoPS) in Mathematics — 13 volumes: https://t.co/Co5WBgtb6H — 🌟BRILLIANT🌟\n\nPrecalculus\nCalculus\nNumber Theory\nPrealgebra\nAlgebra\nIntermediate Algebra\nGeometry\nProbability\nSolutions Manuals\nand more!\n\nRead this and then get the books….", "summary": "Recomendación de la colección de 13 volúmenes 'The Art of Problem Solving' (AoPS), sobre matemáticas (precálculo, cálculo, teoría de números, álgebra, geometría, probabilidad, entre otros).", "topic": "Otros", "tags": ["matematicas", "libros", "aops", "resolucion-de-problemas"], "author_handle": "KirkDBorne", "author_name": "Kirk Borne", "created_at": "2026-06-06T22:07:16.000Z", "metrics": {"bookmarks": 196, "likes": 182, "quotes": 0, "replies": 3, "retweets": 27, "views": 12478}}, {"id": "2064127981161959567", "url": "https://x.com/addyosmani/status/2064127981161959567", "text": "https://t.co/hIe0UX7z6T", "summary": "Enlace a un artículo de X (x.com/i/article) sin texto descriptivo adicional.", "topic": "Otros", "tags": ["articulo", "x-com", "sin-contexto"], "author_handle": "addyosmani", "author_name": "Addy Osmani", "created_at": "2026-06-08T23:30:35.000Z", "metrics": {"bookmarks": 18708, "likes": 8037, "quotes": 358, "replies": 357, "retweets": 1266, "views": 2354560}}, {"id": "2064426115255730578", "url": "https://x.com/bcherny/status/2064426115255730578", "text": "We talk a lot about how important it is to set up self-verification loops. Especially in the age of powerful models that can run for long periods of time, self-verification is a key ingredient that enables the model to run for much longer, delivering a result that is closer to what you intended, so you can do more without having to constantly check in on Claude as it works.\n\n@delba_oliveira gives a great breakdown of what that looks like and why it matters", "summary": "Boris Cherny explica la importancia de los bucles de autoverificación para que los modelos de IA puedan trabajar durante periodos largos con resultados más alineados con la intención del usuario, y destaca una explicación de Delba Oliveira sobre el tema.", "topic": "IA & Machine Learning", "tags": ["self-verification", "agentes-ia", "claude-code", "automatizacion"], "author_handle": "bcherny", "author_name": "Boris Cherny", "created_at": "2026-06-09T19:15:15.000Z", "metrics": {"bookmarks": 4684, "likes": 3050, "quotes": 13, "replies": 96, "retweets": 246, "views": 430839}}, {"id": "2065350659184967902", "url": "https://x.com/fabpot/status/2065350659184967902", "text": "Nowadays I barely write code without an LLM, and my OSS productivity has gone through the roof. Look at what I've shipped on #Twig lately (more to come).\n\nSteve Yegge's 8 levels of AI-assisted development described my last 2 years exactly.", "summary": "Fabien Potencier cuenta que apenas escribe código sin la ayuda de un LLM y que su productividad en proyectos de código abierto como Twig se ha disparado, citando los '8 niveles de desarrollo asistido por IA' de Steve Yegge.", "topic": "Programación & Dev", "tags": ["llm-coding", "twig", "productividad", "steve-yegge", "open-source"], "author_handle": "fabpot", "author_name": "Fabien Potencier", "created_at": "2026-06-12T08:29:04.000Z", "metrics": {"bookmarks": 68, "likes": 143, "quotes": 1, "replies": 7, "retweets": 13, "views": 22302}}, {"id": "2065350660829094293", "url": "https://x.com/fabpot/status/2065350660829094293", "text": "But this isn't what I see at #Upsun: at the organization level, the challenges are different. So I tried to map a second scale, for AI engineering maturity in orgs: https://t.co/p25K9SudBY", "summary": "Fabien Potencier comenta que en Upsun los retos a nivel organizacional son distintos, y comparte un mapa de las etapas de madurez de la ingeniería de IA en las organizaciones.", "topic": "IA & Machine Learning", "tags": ["madurez-ia", "upsun", "ingenieria-ia", "organizaciones"], "author_handle": "fabpot", "author_name": "Fabien Potencier", "created_at": "2026-06-12T08:29:04.000Z", "metrics": {"bookmarks": 54, "likes": 44, "quotes": 1, "replies": 2, "retweets": 8, "views": 4361}}, {"id": "2071988145667928442", "url": "https://x.com/AndrewYNg/status/2071988145667928442", "text": "“Loop engineering” is a hot buzzphrase after mentions of it by Boris Cherny (Claude Code’s creator) and Peter Steinberger (OpenClaw's creator) went viral on social media. Loops are now a key part of how we get AI agents to iterate at length to build software. In this letter, I’d like to share my 3 key loops, shown in the image below, for building 0-to-1 products. These loops guide not just how I build software, but also how I decide what software to build.\n\nAgentic coding loop: Given a product specification and optionally a set of evals (that is, a dataset against which to measure performance), we can have an AI agent write code, test its work, and keep iterating until the code is bug-free and meets its specification. This idea of closing the loop took off around the end of last year, and it has been a game changer in enabling coding agents to work longer productively without human intervention. For example, over the weekend, I was building an app for my daughter to practice typing, and my coding agent could easily work for around an hour, using a web browser to check what it had built multiple times before getting back to me, without needing my intervention.\n\nThe engineering loop executes quickly. Every few minutes, the coding agent might build and test a new version of the software. I hear frequently from developers who are finding new ways to engineer more effective engineering loops. This is an active area of invention!\n\nDeveloper feedback loop: In this loop, a developer examines the current product and steers the coding agent to improve it. Last year, a lot of developers (including me) were acting as the QA (quality assurance) function for our coding agents, manually finding bugs and then asking the agent to fix them. But with coding agents much more able to test their own code, the amount of time we need to spend on this function has decreased significantly. This allows us to make higher-level product decisions, such as what key features to offer, where the UI needs improvement, and so on.\n\nThe developer-feedback loop operates over time intervals between tens of minutes and hours — that's how frequently a developer might review a product and give feedback. In the case of the typing app, I changed my mind a few times about the visual design, what cat costumes she can unlock as she learns (she loves cats), and the user flow for a grown-up to log in and steer the child's learning experience.\n\nWhen a developer has a clear vision for what to build, it is still a lot of work to translate that vision into a specification for a coding agent to implement. Further, after the developer has seen an implementation, they might update (or perhaps clarify) the spec to steer it toward what they want. If you find that the system repeatedly runs into certain problems, building a set of evals for the agent becomes useful.\n\nAI-native teams are increasingly using AI to help shape product direction, for example, automating the gathering and analysis of usage data, summarizing written and verbal customer feedback, or carrying out competitive analysis. However, for pretty much all the products I’m involved in, I see humans as having a significant context advantage over current AI systems — we know a lot more than the AI system about the users and the context the product has to operate in — and thus humans play a critical role. Many people describe this human contribution as “taste,” but I prefer to think of it as humans having a context advantage, since that gives us a clearer path to helping AI systems get better. This also speaks to why this step can’t be automated: So long as the human knows something the AI does not, human-in-the-loop is needed to to inject that knowledge into the system.\n\nExternal feedback loop: This includes a wide range of tactics like asking a few friends for feedback, launching to alpha testers, or putting the code into production with A/B testing. These tactics are usually slow, rarely taking less than hours and sometimes taking days or even weeks. This data informs the developer vision, which in turn continues to drive the detailed product spec, which in turn drives the coding agent.\n\nWith coding agents speeding up software development, more engineers are starting to play a partial product management role. For many engineers who are growing into this role, the hardest part is shaping the product vision and striking a balance between building (bridging the gap between vision and spec) and getting user feedback to evolve the vision. It is important to do both!\n\nI will write more about how to do this in future posts, but for now, I find it encouraging that engineers are playing an expanded role (just as product managers and designers now do more engineering).\n\n[Original text: The Batch]", "summary": "Andrew Ng explica el concepto de \"loop engineering\" y describe sus tres bucles clave para construir productos de cero a uno: el bucle de codificación agéntica, el bucle de feedback del desarrollador y el bucle de feedback externo.", "topic": "IA & Machine Learning", "tags": ["loop-engineering", "andrew-ng", "ai-agents", "product-development"], "author_handle": "AndrewYNg", "author_name": "Andrew Ng", "created_at": "2026-06-30T16:04:04.000Z", "metrics": {"bookmarks": 10208, "likes": 8330, "quotes": 170, "replies": 378, "retweets": 1597, "views": 626194}}, {"id": "2072291002824429878", "url": "https://x.com/trending_repos/status/2072291002824429878", "text": "Trending repository of the month 🏆\n\nAgent-Reach\n\nGive your AI agent eyes to see the entire internet. Read &amp; search Twitter, Reddit, YouTube, GitHub, Bilibili, XiaoHongShu — one CLI, zero API fees.\n\nLast month: 26,239 ⭐\nTotal: 47,845 ⭐️\nhttps://t.co/BUp2aLe7ve", "summary": "Presentación del repositorio de GitHub en tendencia 'Agent-Reach', que da a los agentes de IA capacidad de leer y buscar en Twitter, Reddit, YouTube, GitHub, Bilibili y XiaoHongShu mediante una sola CLI sin coste de APIs.", "topic": "IA & Machine Learning", "tags": ["agent-reach", "ai-agents", "github", "scraping", "cli"], "author_handle": "trending_repos", "author_name": "Trending GitHub Repositories", "created_at": "2026-07-01T12:07:31.000Z", "metrics": {"bookmarks": 230, "likes": 180, "quotes": 0, "replies": 3, "retweets": 18, "views": 9865}}, {"id": "2072320135382073778", "url": "https://x.com/mattpocockuk/status/2072320135382073778", "text": "Can confirm that this is the best decision for my business I've made in a long time\n\nBeing able to plan courses in collaboration with an agent that understands my entire business context feels ridiculous\n\nI can just say things like:\n\n- \"pull up what my students think about autocompact\"\n- \"Is this section missing any major talking points\"\n- \"What problems did people have with this section during the last cohort\"\n- \"What are people excited to learn right now\"\n\nNucking futs", "summary": "Matt Pocock describe cómo planifica sus cursos en colaboración con un agente de IA que entiende todo el contexto de su negocio, permitiéndole hacer preguntas como qué opinan sus estudiantes de una función o qué problemas tuvieron en secciones anteriores.", "topic": "IA & Machine Learning", "tags": ["agentes-ia", "productividad", "educacion", "contexto-empresarial"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-07-01T14:03:16.000Z", "metrics": {"bookmarks": 1340, "likes": 1239, "quotes": 8, "replies": 54, "retweets": 39, "views": 164876}}, {"id": "2073478036154966486", "url": "https://x.com/0xCodez/status/2073478036154966486", "text": "Anthropic just dropped 5 workshops, revealing the latest capabilities of Fable 5:\n\n• 00:00 - deep look into Fable 5\n• 11:22 - Fable 5 and the capability curve\n• 30:54 - building managed agents with Fable 5\n• 44:29 - real use cases of Fable 5 by teams\n• 57:43 - how to deploy agents with Fable 5\n\nThese 1-hour of sessions will replace 100 articles on how to actually use Fable 5.\n\nWatch them today, then read the best practices from the sessions in the article below.", "summary": "Resume cinco workshops publicados por Anthropic sobre las capacidades de 'Fable 5', incluyendo una visión en profundidad, la curva de capacidades, la construcción de agentes gestionados y casos de uso reales por parte de equipos.", "topic": "IA & Machine Learning", "tags": ["fable-5", "anthropic", "workshops", "agentes-gestionados", "formacion"], "author_handle": "0xCodez", "author_name": "Codez", "created_at": "2026-07-04T18:44:21.000Z", "metrics": {"bookmarks": 6205, "likes": 2875, "quotes": 10, "replies": 64, "retweets": 502, "views": 542286}}, {"id": "2073746091795960237", "url": "https://x.com/_avichawla/status/2073746091795960237", "text": "Stanford researchers did it again.\n\nThey just built the agent-native version of Git.\n\nWhen an agent works on a longer task, the run builds up a lot of state.\n\nThis includes files edited/created, a dev server, a database, installed packages, KV cache, etc.\n\nSay the agent is at step 10 and makes a mistake, maybe it misreads a traceback and rewrites a file that was actually fine.\n\nThe tests start failing, and the run goes off track, although everything through step eight was correct.\n\nBy default, the agent just tries to fix it, which creates more edits and tool calls. This burns more tokens and grows the context.\n\nThe other options are a person stepping in to redirect it or restarting the whole run from step one.\n\nThat's wasteful, because it pays for every model/tool call again and re-prefills the context. Moreover, since an agent's run is non-deterministic, it doesn't reproduce the same early steps anyway.\n\nThe reason it's hard to just jump back exactly to a previous correct step and resume from there is that the trajectory is only a message log.\n\nIt records what the agent said and which tools it called, but not the live state underneath.\n\nThat state includes things like memory, open file handles, child processes, installed packages, /tmp, and KV cache. None of that is in the log.\n\nGit can version the files, but it doesn't snapshot the running process or the KV cache. Checking out step eight moves the files back, but the process is still sitting in step-ten memory with a cold cache.\n\nShepherd is a runtime layer by Stanford that records the run as a trace of typed events rather than a flat log.\n\nEach agent-environment interaction becomes a commit, similar to Git, but it tracks the live run.\n\nIts commit includes the agent process and the filesystem together, copy-on-write, so a branch carries the actual state and not just the files.\n\nGoing back to a previous step is then a single call that forks from that commit and continues from the exact state.\n\nThe copy-on-write fork is roughly five times faster than docker commit, and because the prompt prefix through step eight is unchanged, the KV cache is reused over 95% on replay, so early steps aren't reprocessed again.\n\nOnce the run can be forked, a meta-agent can sit on top and operate it. It watches the trace and reverts as soon as it looks wrong, before the bad write is committed.\n\nIn practice, it's just Python calling fork, replay, and revert on the trace, rather than a separate control plane wired into the harness.\n\nNot everything is reversible though.\n\nFiles and sandbox changes undo themselves, but a database write has no automatic undo, so it needs a matching undo step set up in advance.\n\nSomething external, like a sent email or a real charge, can't be undone, so the supervisor's job there is to catch it before it fires.\n\nThey tested this on a few public benchmarks. On CooperBench, where two agents work on the same codebase, adding a live supervisor took the pair-coding pass rate from 28.8% to 54.7%.\n\nIt's still early and labeled alpha. The benefit mostly shows up when a run gets branched a lot over a heavy sandbox state, which is exactly where restarting wastes the most tokens and time.\n\nIf Git was made to make file changes reversible, Shepherd is trying to do the same thing for a live agent run.\n\nShepherd Repo: https://t.co/5e8W5oxY6F\n\n(don't forget to star it ⭐ )\n\nThat said, Shepherd reverts a bad step inside a run. The harness around it, the prompts, tools, and checks the supervisor relies on, still drifts across runs as models and dependencies change.\n\nAkshay wrote about making that harness repair itself, where a failing trace gets diagnosed, the fix is verified against the exact input that failed, and the failure is locked as a regression test so it can't recur.\n\nRead it below.", "summary": "Avi Chawla explica Shepherd, una herramienta de Stanford descrita como un 'Git nativo para agentes': registra cada interacción agente-entorno como un commit que incluye el proceso y el sistema de archivos, permitiendo revertir o bifurcar una ejecución a un paso anterior sin reiniciar desde cero ni perder la caché KV.", "topic": "IA & Machine Learning", "tags": ["shepherd", "agentes-ia", "stanford", "checkpointing", "harness-engineering"], "author_handle": "_avichawla", "author_name": "Avi Chawla", "created_at": "2026-07-05T12:29:31.000Z", "metrics": {"bookmarks": 5816, "likes": 3041, "quotes": 15, "replies": 61, "retweets": 358, "views": 434146}}, {"id": "2073811512938868814", "url": "https://x.com/mattpocockuk/status/2073811512938868814", "text": "This is a PRD based on a multi-day /wayfinder session\n\nLook how detailed it is\n\nLook how every assertion is linked back to the session where it was decided\n\nSecondary source -&gt; Primary source\n\nBeautiful\n\nhttps://t.co/AMVKBNJq6X", "summary": "Destaca un PRD basado en una sesión de varios días con '/wayfinder', muy detallado, donde cada afirmación queda enlazada a la sesión en la que se decidió, yendo de la fuente secundaria a la primaria.", "topic": "Programación & Dev", "tags": ["wayfinder", "prd", "documentacion", "matt-pocock", "github"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-07-05T16:49:28.000Z", "metrics": {"bookmarks": 597, "likes": 572, "quotes": 0, "replies": 32, "retweets": 24, "views": 51516}}, {"id": "2074208949205881033", "url": "https://x.com/ClaudeDevs/status/2074208949205881033", "text": "https://t.co/v694m8Eaj6", "summary": "Enlace a un artículo de X (Twitter) sin texto descriptivo adicional.", "topic": "Otros", "tags": ["sin-contexto", "x-article", "claudedevs"], "author_handle": "ClaudeDevs", "author_name": "ClaudeDevs", "created_at": "2026-07-06T19:08:45.000Z", "metrics": {"bookmarks": 37249, "likes": 17030, "quotes": 473, "replies": 314, "retweets": 2088, "views": 5619857}}, {"id": "2074464823232888987", "url": "https://x.com/mattpocockuk/status/2074464823232888987", "text": "Here's a step-by-step process to kill all the bloat from your Claude Code system prompt:\n\n1. Run a proxy so you can see exactly what gets sent to Claude Code (included in the article)\n2. \"Fuck, there is so much cruft in there\"\n3. Use my settings.json to kill all the bloat\n\nDown to a clean 13K tokens to start each session with. Nice.\n\nFull process here:\n\nhttps://t.co/Kie84HMe2A", "summary": "Matt Pocock detalla un proceso paso a paso para eliminar el exceso de contenido del system prompt de Claude Code usando un proxy para inspeccionarlo y un archivo settings.json personalizado, reduciéndolo a unos 13.000 tokens.", "topic": "Programación & Dev", "tags": ["claude-code", "system-prompt", "optimizacion", "settings-json", "matt-pocock"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-07-07T12:05:30.000Z", "metrics": {"bookmarks": 4423, "likes": 2067, "quotes": 35, "replies": 114, "retweets": 163, "views": 568107}}, {"id": "2074473737542406590", "url": "https://x.com/martinfowler/status/2074473737542406590", "text": "NEW POST\n\nBirgitta Böckeler recently spent some time trying out running local LLMs for some programming tasks. In this memo she outlines the factors that influence how viable they are for the job.\n\nhttps://t.co/ALp5q6p3g5", "summary": "Martin Fowler comparte un memo de Birgitta Böckeler sobre los factores que determinan la viabilidad de usar LLMs locales para tareas de programación.", "topic": "IA & Machine Learning", "tags": ["llm-local", "programacion", "martin-fowler", "modelos-locales"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-07-07T12:40:55.000Z", "metrics": {"bookmarks": 163, "likes": 157, "quotes": 2, "replies": 5, "retweets": 30, "views": 25736}}, {"id": "2074638582418231495", "url": "https://x.com/steipete/status/2074638582418231495", "text": "If you run this workflow, ask Fable to make codex the workhorse. https://t.co/o20OwqaoAt", "summary": "Peter Steinberger recomienda una skill de GitHub ('codex-first') que hace que Fable use Codex como motor principal de trabajo dentro de este flujo.", "topic": "Programación & Dev", "tags": ["fable", "codex", "agent-skills", "github", "workflow"], "author_handle": "steipete", "author_name": "Peter Steinberger 🦞", "created_at": "2026-07-07T23:35:57.000Z", "metrics": {"bookmarks": 8387, "likes": 6410, "quotes": 51, "replies": 216, "retweets": 356, "views": 886351}}, {"id": "2075149990658191668", "url": "https://x.com/mattpocockuk/status/2075149990658191668", "text": "Four of AI's most confusing terms explained:\n\nAn agent is just a model, harnessed, in an environment. https://t.co/w7DU7ej29Z", "summary": "Matt Pocock ofrece, dentro de una serie sobre los términos más confusos de la IA, una definición concisa de 'agente': simplemente un modelo, dotado de un harness, dentro de un entorno.", "topic": "IA & Machine Learning", "tags": ["definiciones-ia", "agentes-ia", "harness", "matt-pocock"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-07-09T09:28:06.000Z", "metrics": {"bookmarks": 643, "likes": 1176, "quotes": 6, "replies": 45, "retweets": 102, "views": 63045}}, {"id": "2075347173378859307", "url": "https://x.com/GeoffreyHuntley/status/2075347173378859307", "text": "banger https://t.co/vQe4Djz28K", "summary": "Comparte, con un breve comentario de aprobación ('banger'), un artículo titulado 'The Great Divergence in Software Engineering'.", "topic": "Programación & Dev", "tags": ["divergencia-ingenieria", "blog", "desarrollo-de-software"], "author_handle": "GeoffreyHuntley", "author_name": "geoff", "created_at": "2026-07-09T22:31:38.000Z", "metrics": {"bookmarks": 68, "likes": 46, "quotes": 2, "replies": 2, "retweets": 6, "views": 4844}}, {"id": "2075452255373836324", "url": "https://x.com/nicopreme/status/2075452255373836324", "text": "Combined @mattpocockuk's \"grill me\" skill with the concepts from Thariq's \"Finding Your Unknowns\" article into one agent skill: grill-for-unknowns.\n\nYour agent grills you to surface the unknowns FIRST, so you reach shared understanding before implementation. Works great with models like 5.6 that execute reliably once fully aligned. 😎\n\nhttps://t.co/2kwo6P0d47", "summary": "Nico Bailon presenta \"grill-for-unknowns\", una skill de agente que combina la skill \"grill me\" de Matt Pocock con las ideas del artículo \"Finding Your Unknowns\" de Thariq, para que el agente identifique primero lo desconocido antes de implementar.", "topic": "Programación & Dev", "tags": ["claude-skills", "requirements-gathering", "ai-agents", "matt-pocock"], "author_handle": "nicopreme", "author_name": "Nico Bailon", "created_at": "2026-07-10T05:29:12.000Z", "metrics": {"bookmarks": 1099, "likes": 657, "quotes": 5, "replies": 16, "retweets": 42, "views": 77245}}]</script>
<script>
const DATA = JSON.parse(document.getElementById("bookmarks-data").textContent);
// Precompute the search haystack once so filtering doesn't rebuild it per keystroke.
DATA.forEach(b => { b._hay = [b.text, b.summary, b.topic, b.author_handle, b.author_name, (b.tags || []).join(" ")].join(" ").toLowerCase(); });
const listEl = document.getElementById("list");
const tagsEl = document.getElementById("tags");
const qEl = document.getElementById("q");
const sortEl = document.getElementById("sort");
const shownEl = document.getElementById("shown");
let activeTag = null;

function sortRows(rows) {
  const key = sortEl.value;
  const metric = (b, k) => (b.metrics && b.metrics[k]) || 0;
  const by = {
    likes: (a, b) => metric(b, "likes") - metric(a, "likes"),
    views: (a, b) => metric(b, "views") - metric(a, "views"),
    recent: (a, b) => (b.created_at || "").localeCompare(a.created_at || ""),
  }[key] || (() => 0);
  return rows.slice().sort(by);
}

const allTags = [...new Set(DATA.flatMap(b => b.tags || []))].sort();
for (const t of allTags) {
  const el = document.createElement("span");
  el.className = "tag"; el.textContent = t;
  el.onclick = () => { activeTag = (activeTag === t) ? null : t; render(); };
  el.dataset.tag = t;
  tagsEl.appendChild(el);
}

const _ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => _ESC[c]); }
function escAttr(s) { return esc(s); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

function matches(b, q) {
  if (activeTag && !(b.tags || []).includes(activeTag)) return false;
  if (!q) return true;
  return q.split(/\s+/).every(w => b._hay.includes(w));
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const rows = sortRows(DATA.filter(b => matches(b, q)));
  shownEl.textContent = rows.length;
  for (const el of tagsEl.children) el.classList.toggle("active", el.dataset.tag === activeTag);
  listEl.innerHTML = rows.length ? rows.map(card).join("") : '<div class="empty">No matches.</div>';
}

function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n); }

function metricsLine(m) {
  if (!m) return "";
  const parts = [];
  if (m.likes) parts.push("\u2665 " + esc(fmt(m.likes)));
  if (m.views) parts.push("\u25b6 " + esc(fmt(m.views)));
  if (m.bookmarks) parts.push("\u2302 " + esc(fmt(m.bookmarks)));
  return parts.length ? '<div class="metrics">' + parts.join(" \u00b7 ") + '</div>' : "";
}

function card(b) {
  const author = b.author_handle ? '@' + esc(b.author_handle) : '';
  const chips = (b.tags || []).map(t => '<span class="chip">#' + esc(t) + '</span>').join(" ");
  return '<article class="card">'
    + '<div class="meta">' + author + (b.topic ? ' \u00b7 ' + esc(b.topic) : '') + '</div>'
    + (b.summary ? '<div class="summary">' + esc(b.summary) + '</div>' : '')
    + '<div class="text">' + esc(b.text) + '</div>'
    + metricsLine(b.metrics)
    + '<div class="chips">' + chips + ' <a href="' + escAttr(safeUrl(b.url)) + '" target="_blank" rel="noopener">open \u2197</a></div>'
    + '</article>';
}

let _debounce;
qEl.addEventListener("input", () => { clearTimeout(_debounce); _debounce = setTimeout(render, 150); });
sortEl.addEventListener("change", render);
render();
</script>
