2957869", "text": "👌Agent Skills - @addyosmani\n\n“Agent Skills” turns specs, tests, reviews, scope control, and verification into enforceable workflows.\n \n🎤🫳 “A senior engineer’s job is mostly the parts that don’t show up in the diff.” \n\nhttps://t.co/8qMvRRvQew", "summary": "Bilgin Ibryam destaca el artículo de Addy Osmani sobre 'Agent Skills', que convierte especificaciones, tests, revisiones y control de alcance en flujos de trabajo verificables para agentes de codificación.", "topic": "Productividad & Herramientas", "tags": ["agent-skills", "addy-osmani", "flujo-de-trabajo", "buenas-practicas"], "author_handle": "bibryam", "author_name": "Bilgin Ibryam", "created_at": "2026-05-09T13:56:33.000Z", "metrics": {"bookmarks": 35, "likes": 24, "quotes": 0, "replies": 0, "retweets": 6, "views": 2018}}, {"id": "2053265173507703247", "url": "https://x.com/morganlinton/status/2053265173507703247", "text": "Great read on harness engineering.", "summary": "Recomienda una lectura sobre 'harness engineering', sin enlace ni más detalles en el texto.", "topic": "Programación & Dev", "tags": ["harness-engineering", "agentes-ia", "lectura-recomendada"], "author_handle": "morganlinton", "author_name": "Morgan", "created_at": "2026-05-10T00:05:39.000Z", "metrics": {"bookmarks": 2570, "likes": 1109, "quotes": 5, "replies": 13, "retweets": 109, "views": 376824}}, {"id": "2053459748532392343", "url": "https://x.com/mattpocockuk/status/2053459748532392343", "text": "A flow I just tried and LOVED:\n\n1. /grill-with-docs, talking about a new bit of UI\n2. Asks me a question I can't answer unless I prototype\n3. /prototype\n4. Iterate on the prototype, burning tokens freely until we get a good spot\n5. /rewind to the question, and select 'summarize' (Claude Code feature), saying 'summarize what we learned from prototyping'\n6. Continue the grilling session, retaining the prototype\n\nSmoooooooth", "summary": "Matt Pocock describe un flujo de trabajo en Claude Code que combina las skills \"/grill-with-docs\" y \"/prototype\" con la función \"/rewind\" para resumir lo aprendido durante la prototipación y continuar la conversación con contexto reducido.", "topic": "Programación & Dev", "tags": ["claude-code", "workflow", "prototyping", "context-management"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-05-10T12:58:50.000Z", "metrics": {"bookmarks": 2657, "likes": 2324, "quotes": 17, "replies": 73, "retweets": 88, "views": 107988}}, {"id": "2053747834696995181", "url": "https://x.com/badlogicgames/status/2053747834696995181", "text": "recommended reading. don't get confused by the title.\n\nhttps://t.co/0E8qWNCWWh", "summary": "Mario Zechner recomienda un artículo titulado 'I'm going back to writing code by hand', advirtiendo que no hay que dejarse confundir por el título.", "topic": "Programación & Dev", "tags": ["codigo-manual", "ai-coding", "opinion", "lectura-recomendada"], "author_handle": "badlogicgames", "author_name": "Mario Zechner", "created_at": "2026-05-11T08:03:35.000Z", "metrics": {"bookmarks": 1245, "likes": 1052, "quotes": 16, "replies": 19, "retweets": 66, "views": 78562}}, {"id": "2053818254209249498", "url": "https://x.com/michaeldyrynda/status/2053818254209249498", "text": "I don’t always use PHP’s property hooks, but they’re a handy way to handle exposing virtual properties without doing a better dance or wiring them up in class constructors. \n\nPerfect for POPOs and DTOs\n\nhttps://t.co/8xKHMaQicH", "summary": "Michael Dyrynda explica que los property hooks de PHP son una forma práctica de exponer propiedades virtuales sin necesidad de wiring manual en constructores, ideal para POPOs y DTOs.", "topic": "Programación & Dev", "tags": ["php", "property-hooks", "dto", "programacion-orientada-a-objetos"], "author_handle": "michaeldyrynda", "author_name": "Michael Dyrynda", "created_at": "2026-05-11T12:43:24.000Z", "metrics": {"bookmarks": 18, "likes": 32, "quotes": 0, "replies": 0, "retweets": 8, "views": 2422}}, {"id": "2053843370011955546", "url": "https://x.com/GitTrend0x/status/2053843370011955546", "text": "Hermes 强化版！\n\n强化 fork 版，Web 管理仪表盘、零 token 技能进化插件、完整文档知识库、Superpowers 创意工作流…… 全网程序员把 Hermes 玩成了下一代 Agent 深度 hack 神器 + 浏览器指挥舱 + 自我卷王 + 知识圣经 + 创意超级英雄。\n\n1️⃣ hermes-agent-fork（https://t.co/YxXA60KBDx）\n\n强化 fork 版，保留自进化循环 + OpenClaw 迁移优化。\n深度玩家直接上手 hack！\n\n2️⃣ hermes-dashboard（https://t.co/cHVb26ZVd3）\n\nWeb 仪表盘：全配置 + MCP + cron + 模型管理，无 CLI。\n浏览器里指挥 Agent 军团了😂\n\n3️⃣ hermes-curator-evolver（https://t.co/TSwv4sVUWI）\n\n本地零 token 技能进化插件，后台自动观察 + 生成 + 优化 skill。\nAgent 自己卷自己，太狠了！\n\n4️⃣ hermes-agent-docs（https://t.co/7woTLanHLZ）\n\nv0.10.0+ self-improving 完整文档仓库。\nHermes 玩家的“官方圣经 2.0”！\n\n5️⃣ hermes-agent-superpowers-chatgpt（https://t.co/M1wymJtJyI）\n\nSuperpowers 创意工作流包，设计哲学 + 品牌 pipeline 打包成 skill。\nAgent 也要当创意超级英雄了！\n\n//\n\n为什么这些新进化体这么炸？\n\n全吃 Hermes 底层循环当 DNA，社区再疯狂补强化 fork、浏览器仪表盘、零 token 进化、本地文档库、创意工作流……生态卷速肉眼可见。", "summary": "Resumen en chino de cinco proyectos de GitHub que amplían el agente Hermes: un fork reforzado, un panel web de control, un plugin de evolución de habilidades sin coste de tokens, una documentación completa y un paquete de flujos de trabajo creativos ('Superpowers').", "topic": "Programación & Dev", "tags": ["hermes-agent", "github-trending", "agentes-ia", "open-source", "automatizacion"], "author_handle": "GitTrend0x", "author_name": "GitTrend", "created_at": "2026-05-11T14:23:12.000Z", "metrics": {"bookmarks": 335, "likes": 210, "quotes": 2, "replies": 7, "retweets": 42, "views": 73034}}, {"id": "2053931801890967730", "url": "https://x.com/JustSteveKing/status/2053931801890967730", "text": "Most PHP devs know PSR-4 and PSR-12. But there are other standards you’re probably ignoring that change how you write PHP entirely.\n\nPSR 7, 14, 15, 17, and 18 - they give you a complete model for HTTP-aware PHP that’s tied to no framework.\n\nWrite to the interface, not the implementation.\n\nhttps://t.co/EvqrpZiJvJ", "summary": "JustSteveKing explica que, más allá de PSR-4 y PSR-12, los estándares PSR 7, 14, 15, 17 y 18 ofrecen un modelo completo para trabajar con HTTP en PHP sin depender de un framework concreto.", "topic": "Programación & Dev", "tags": ["php", "psr", "estandares", "http"], "author_handle": "JustSteveKing", "author_name": "JustSteveKing", "created_at": "2026-05-11T20:14:36.000Z", "metrics": {"bookmarks": 41, "likes": 73, "quotes": 1, "replies": 1, "retweets": 9, "views": 4445}}, {"id": "2053940973106036800", "url": "https://x.com/adocomplete/status/2053940973106036800", "text": "So excited for Agent view (research preview) in Claude Code.\n\nRun claude agents to list and start multiple sessions. Each one runs w/o taking up a terminal tab.\n\nSee what's running, what's blocked, and what's done. Reply inline or jump in and out of sessions with ease. https://t.co/zXlD9cEOgh", "summary": "Se muestra entusiasmado por la 'Agent view' (vista previa de investigación) en Claude Code, que permite listar e iniciar múltiples sesiones de agentes sin ocupar una pestaña de terminal, viendo qué está en ejecución, bloqueado o terminado.", "topic": "Programación & Dev", "tags": ["claude-code", "agent-view", "sesiones", "multitarea"], "author_handle": "adocomplete", "author_name": "Ado", "created_at": "2026-05-11T20:51:03.000Z", "metrics": {"bookmarks": 57, "likes": 226, "quotes": 8, "replies": 17, "retweets": 18, "views": 22602}}, {"id": "2053959835679604812", "url": "https://x.com/rseroter/status/2053959835679604812", "text": "Even if you don't care about all the AI transformation stuff, it does seem as if this executive urgency is forcing companies to finally fix longstanding pain points.\n\nHere, Yum Brands is fixing their data estate so that they can get more out of AI.\nhttps://t.co/taQ5q4R9CP", "summary": "Richard Seroter comenta un caso de Yum Brands, que está modernizando su infraestructura de datos por la urgencia de adoptar IA, resolviendo así problemas de larga data.", "topic": "IA & Machine Learning", "tags": ["ai-transformation", "data-modernization", "yum-brands", "enterprise-ai"], "author_handle": "rseroter", "author_name": "Richard Seroter", "created_at": "2026-05-11T22:06:00.000Z", "metrics": {"bookmarks": 1, "likes": 6, "quotes": 0, "replies": 0, "retweets": 0, "views": 564}}, {"id": "2053988786091241579", "url": "https://x.com/DanielMiessler/status/2053988786091241579", "text": "Just had a crazy idea as a response to this excellent article by Lars Faye.\n\nI think Lars' best argument was the benefit and enjoyment of manually wrangling with ideas in code.\n\nWhat if we created some sort of new pseudo-code language that's like a step more technical than a spec, where you can actually try ideas and see how they work, but without building everything fully?\n\nSo it's like playing with ideas when writing prose, except it's doing so with functionality of an application.\n\nMaybe this won't work because the details of the particular languages will make a difference, but I think the bigger issue is getting the ideas right. \n\nSo maybe it's possible to make an intermediary language that lets us play in this way, come up with a clean idea, and then add THAT to the spec as well. Like, here's what I REALLY mean...\n\nAnd then we'd have the ability to use the pseudo-code as a language for talking back and forth with AI about the idea, but without all the bloat of the actual language and without abstracting the ideas so far from us that we don't understand what we built.\n\nThoughts?\n\nhttps://t.co/u8zyaR4KYr", "summary": "Daniel Miessler propone, en respuesta a un artículo de Lars Faye sobre los riesgos de la programación agéntica, crear un lenguaje pseudocódigo intermedio que permita experimentar con ideas de funcionalidad antes de escribirlas como especificación completa o código final.", "topic": "Programación & Dev", "tags": ["pseudocodigo", "especificaciones", "agentic-coding", "ingenieria-de-prompts", "ai-coding"], "author_handle": "DanielMiessler", "author_name": "ᴅᴀɴɪᴇʟ ᴍɪᴇssʟᴇʀ 🛡️", "created_at": "2026-05-12T00:01:02.000Z", "metrics": {"bookmarks": 21, "likes": 22, "quotes": 1, "replies": 5, "retweets": 4, "views": 3335}}, {"id": "2054024771185082570", "url": "https://x.com/tom_doerr/status/2054024771185082570", "text": "Generates UI with 67% fewer tokens than JSON\n\nhttps://t.co/B8crPruCiS https://t.co/rcPiZ2wFbw", "summary": "Tom Dörr comparte OpenUI, un proyecto que genera interfaces de usuario usando un 67% menos tokens que JSON.", "topic": "IA & Machine Learning", "tags": ["openui", "generacion-de-ui", "llm", "tokens", "open-source"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-05-12T02:24:02.000Z", "metrics": {"bookmarks": 1899, "likes": 1612, "quotes": 7, "replies": 15, "retweets": 146, "views": 115821}}, {"id": "2054056472477307084", "url": "https://x.com/QingQ77/status/2054056472477307084", "text": "为 Hermes Agent 提供一套开箱即用的技能和工作流层，覆盖从想法到部署再到运维的完整应用生命周期。\n\nhttps://t.co/1efdKNob6b\n\nOh My Hermes 就是给 Hermes 装上\"操作系统\"——装一次，Hermes 就不再是聊天机器人，而是一个能干活的运维+开发搭档。\n\n20 个技能覆盖需求澄清、产品简报、设计交接、引擎选择、代码实现、部署、数据库连接、监控、通知、GitHub 操作等完整环节；\n\n5 个 Agent（CTO、PM、Dev、QA、Ops）各管一段，在看板上协同推进。Hermes 自己就是主操作者，Claude Code 和 Codex 只是可选的深度编码加速器。", "summary": "Presenta 'Oh My Hermes', una capa de habilidades y flujos de trabajo para el agente Hermes que cubre todo el ciclo de vida de una aplicación, desde la idea hasta el despliegue y la operación, con 20 skills y 5 agentes especializados (CTO, PM, Dev, QA, Ops) coordinados en un tablero kanban.", "topic": "Programación & Dev", "tags": ["hermes-agent", "agentes-ia", "ciclo-de-vida-software", "automatizacion", "open-source"], "author_handle": "QingQ77", "author_name": "Geek Lite", "created_at": "2026-05-12T04:30:00.000Z", "metrics": {"bookmarks": 701, "likes": 382, "quotes": 3, "replies": 18, "retweets": 40, "views": 48754}}, {"id": "2054136870016356408", "url": "https://x.com/commte/status/2054136870016356408", "text": "Google 公式 Skills が来た\n\n13個のスキルが公開。Claude Code / Antigravity / Gemini CLI / Cursor / GitHub Copilot ほか主要エージェントが対応してる Agent Skills 標準準拠\n\nhttps://t.co/9xvVKn004h", "summary": "コムテ informa que Google lanzó oficialmente 13 skills compatibles con el estándar Agent Skills, soportado por Claude Code, Antigravity, Gemini CLI, Cursor y GitHub Copilot, entre otros.", "topic": "Programación & Dev", "tags": ["google-skills", "agent-skills", "claude-code", "gemini-cli", "github-copilot"], "author_handle": "commte", "author_name": "コムテ", "created_at": "2026-05-12T09:49:28.000Z", "metrics": {"bookmarks": 3844, "likes": 3428, "quotes": 28, "replies": 0, "retweets": 375, "views": 486444}}, {"id": "2054158532141080650", "url": "https://x.com/JoliCode/status/2054158532141080650", "text": "Comment intégrer l'IA dans son workflow UX/UI ? 🎨\n\nAujourd'hui sur le blog, Sophie partage son retour d'expérience sur l'utilisation de Figma Make, Claude Design, les prompts efficaces et ce qui change vraiment pour les designers 💡\n\nhttps://t.co/zsuGjpt6Uh\n\n#ui #ux #ia #design", "summary": "JoliCode publica en su blog cómo integrar la IA en el flujo de trabajo UX/UI: Sophie comparte su experiencia con Figma Make, Claude Design y prompts eficaces, y qué cambia realmente para los diseñadores.", "topic": "Diseño & UX", "tags": ["figma", "claude-design", "prompts", "ux-ui", "diseno-ia"], "author_handle": "JoliCode", "author_name": "JoliCode", "created_at": "2026-05-12T11:15:33.000Z", "metrics": {"bookmarks": 5, "likes": 7, "quotes": 0, "replies": 0, "retweets": 5, "views": 461}}, {"id": "2054175226628587754", "url": "https://x.com/dotta/status/2054175226628587754", "text": "📎 Paperclip v2026.512.1 is out. Featuring\n\n👼  Stronger liveness - your clips will work harder, plan better, and run longer\n🧩 Plugin managed agents, routines, and skills\n🔐 Secrets - w/ first-class provider vaults\n🧠 Planning mode\n🔍 New Search\n\nhttps://t.co/JMeAOP726n", "summary": "Anuncia el lanzamiento de Paperclip v2026.512.1, con mejoras de estabilidad, agentes y rutinas gestionados por plugins, gestión de secretos, modo de planificación y nueva búsqueda.", "topic": "Productividad & Herramientas", "tags": ["paperclip", "release-notes", "ai-agents", "plugins"], "author_handle": "dotta", "author_name": "dotta 📎", "created_at": "2026-05-12T12:21:53.000Z", "metrics": {"bookmarks": 248, "likes": 371, "quotes": 11, "replies": 37, "retweets": 22, "views": 39420}}, {"id": "2054193359397253225", "url": "https://x.com/martinfowler/status/2054193359397253225", "text": "NEW POST\n\nWill there be source code in the future? To wrestle with this, we have to understand what code is. Unmesh Joshi sees code as having two distinct but intertwined purposes: instructions to a machine and a conceptual model of the problem domain. \n\nhttps://t.co/GsjgtYysno", "summary": "Martin Fowler enlaza un nuevo artículo que explora si habrá código fuente en el futuro, basado en la idea de Unmesh Joshi de que el código tiene dos propósitos: instrucciones para una máquina y modelo conceptual del dominio del problema.", "topic": "Programación & Dev", "tags": ["codigo-fuente", "martin-fowler", "modelo-conceptual", "futuro-del-codigo"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-05-12T13:33:56.000Z", "metrics": {"bookmarks": 250, "likes": 269, "quotes": 7, "replies": 9, "retweets": 49, "views": 28280}}, {"id": "2054201279082053743", "url": "https://x.com/ghumare64/status/2054201279082053743", "text": "I'm excited to announce the AKBP protocol.\n\nGit for agent knowledge.\n\nI have thought through this in very detail, so this is not just some random research.\n\nIt was created on the basis of @karpathy's LLM wiki and wiki v2, which I wrote based on my agent memory findings.\n\nI think https://t.co/weJFviWj5h is the perfect protocol standard agents need for memory.", "summary": "Rohit Ghumare anuncia AKBP, un protocolo que describe como 'Git para el conocimiento de los agentes', desarrollado a partir de la LLM wiki de Andrej Karpathy.", "topic": "IA & Machine Learning", "tags": ["akbp", "memoria-de-agentes", "protocolo", "karpathy"], "author_handle": "ghumare64", "author_name": "Rohit Ghumare", "created_at": "2026-05-12T14:05:24.000Z", "metrics": {"bookmarks": 64, "likes": 62, "quotes": 0, "replies": 6, "retweets": 4, "views": 3366}}, {"id": "2054201313400107399", "url": "https://x.com/rseroter/status/2054201313400107399", "text": "Google Antigravity beats Claude at coding—but only if you stop acting like a programmer https://t.co/VJOmYpkuGY &lt; all these tools are great; just pick one. But regardless, don't bring your old approach to new tools.", "summary": "Comparte un artículo que sostiene que Google Antigravity supera a Claude en tareas de programación, pero solo si el desarrollador cambia su forma tradicional de trabajar como programador.", "topic": "Programación & Dev", "tags": ["google-antigravity", "claude", "comparativa-herramientas", "agentes-de-codigo"], "author_handle": "rseroter", "author_name": "Richard Seroter", "created_at": "2026-05-12T14:05:32.000Z", "metrics": {"bookmarks": 15, "likes": 24, "quotes": 0, "replies": 3, "retweets": 3, "views": 1017}}, {"id": "2054225085100151163", "url": "https://x.com/DataChaz/status/2054225085100151163", "text": "🚨 Karpathy was right. He warned that 90% of AI advice dies in 6 months.\n\nspoiler: most tools won't even survive 90 days.\n\nthis guy is literally giving away the exact 2026 playbook for AI Agents.\n\nhe covers exactly what to learn, build, and ignore entirely 👀\n\n↓ read this today https://t.co/yKSWKgfXEA", "summary": "Charly Wargnier resalta la advertencia de Karpathy de que el 90% de los consejos sobre IA caducan en 6 meses, y destaca un contenido que ofrece un playbook de 2026 sobre qué aprender, construir e ignorar en IA.", "topic": "IA & Machine Learning", "tags": ["karpathy", "playbook-ia", "tendencias", "agentes-ia"], "author_handle": "DataChaz", "author_name": "Charly Wargnier", "created_at": "2026-05-12T15:40:00.000Z", "metrics": {"bookmarks": 2339, "likes": 835, "quotes": 4, "replies": 42, "retweets": 117, "views": 192025}}, {"id": "2054259814788641199", "url": "https://x.com/luisloaiza/status/2054259814788641199", "text": "Mira esta herramienta para crear soluciones de negocio en WhatsApp con IA, prompts e integraciones avanzadas, más rápida y potente que n8n. Podrás vender con catálogo y pagos integrados, automatizar el onboarding con validación de identidad y más. ¡Empieza gratis!", "summary": "Presenta una herramienta para crear soluciones de negocio en WhatsApp con IA, prompts e integraciones avanzadas, que permite vender con catálogo y pagos integrados y automatizar el onboarding con validación de identidad, descrita como más rápida y potente que n8n.", "topic": "Marketing & Redes", "tags": ["whatsapp", "automatizacion", "ia", "ventas", "no-code"], "author_handle": "luisloaiza", "author_name": "Luis Loaiza", "created_at": "2026-05-12T17:58:00.000Z", "metrics": {"bookmarks": 97, "likes": 63, "quotes": 0, "replies": 4, "retweets": 8, "views": 279055}}, {"id": "2054392501512065091", "url": "https://x.com/NFTCPS/status/2054392501512065091", "text": "Hermes 这波直接把 Agent 天花板给掀了！\n\n全网程序员已经开始用它搭桌面神器、跑创意流水线、省 token 省到飞起——你还没跟上？\n\n1️⃣ 先说 hermes-desktop，CLI 小玩具直接进化成 Mac/Windows 原生桌面 App，一键装好就能聊，多平台消息 + 自进化循环，这才叫真正的桌面伴侣。\n🔗 https://t.co/oyfdZYhXUm\n\n2️⃣ hermes-agent-idea-workflow 是给创意党准备的，脑子里一个粗糙想法，丢进去直接给你吐出 PRD + 设计文档 + 任务拆解，脑暴效率直接起飞。\n🔗 https://t.co/s6x6wucygs\n\n3️⃣ plur 解决了一个老大难问题——多个 Agent 实例之间记忆不互通。它用 open engram YAML 做共享记忆层，知识跨实例永不丢，Agent 终于有集体大脑了。\n🔗 https://t.co/id0Em4R8Sf\n\n4️⃣ rtk-hermes 是省钱黑科技，shell 输出自动压缩 60-90% 的 token，实战跑了 1100 万+ token 验证过的，上下文爆炸？不存在的。\n🔗 https://t.co/bOCnPFF97L\n\n5️⃣ hermesd 给运维党看，实时只读 TUI 仪表盘，10 大面板一眼监控 Gateway、Sessions、Tokens、Cron、Memory，Agent 在干啥一目了然。\n🔗 https://t.co/CyTmAElrZ7\n\n五个方向，五个开源项目，把 Hermes 玩成了下一代 Agent 的完整生态。现在不上车，等啥呢？", "summary": "Presenta el ecosistema open source de Hermes: una app de escritorio nativa, un flujo para convertir ideas en PRD/documentos de diseño, una capa de memoria compartida entre agentes (plur), una herramienta de compresión de tokens y un dashboard de monitorización.", "topic": "IA & Machine Learning", "tags": ["hermes", "ai-agents", "open-source", "shared-memory", "token-optimization"], "author_handle": "NFTCPS", "author_name": "鸟哥 | 蓝鸟会🕊️", "created_at": "2026-05-13T02:45:15.000Z", "metrics": {"bookmarks": 2075, "likes": 1300, "quotes": 12, "replies": 61, "retweets": 251, "views": 90115}}, {"id": "2054597972420132926", "url": "https://x.com/every/status/2054597972420132926", "text": "Long-running agents are getting better. But they're at their best after a human finds the prompt that lets the model cook.\n\nTo get started, try this flow from our team:  \n\n1. Find your longest agent run  \n\nWhat's the longest stretch you have trusted an agent on autopilot?  If you don't know, you can't push it.  \n\n2. Extend that runtime with a goal\n\nUse long-running modes when the success criteria are clear. Codex and Claude Code have /goals commands that allow agents to pursue objectives across multiple turns without checking in.\n\n3. Audit your existing loops  \n\nIf you already have agents running overnight, ask:  How long did it run? With what guardrails? Against what feedback signal? At what verified accuracy?  \n\nThat's how you keep inching closer to a 24/7 agent that completes tasks successfully.", "summary": "Every explica un flujo de trabajo para aprovechar mejor los agentes de larga duración: identificar tu ejecución más larga, extenderla con objetivos claros usando comandos como /goals en Codex y Claude Code, y auditar los loops existentes según su duración y precisión verificada.", "topic": "IA & Machine Learning", "tags": ["agentes-de-larga-duracion", "claude-code", "codex", "automatizacion", "ai-agents"], "author_handle": "every", "author_name": "Every 📧", "created_at": "2026-05-13T16:21:43.000Z", "metrics": {"bookmarks": 12, "likes": 10, "quotes": 0, "replies": 1, "retweets": 3, "views": 1550}}, {"id": "2054678395867599250", "url": "https://x.com/milesdeutscher/status/2054678395867599250", "text": "Anthropic just automated 99% of legal roles.\n\nClaude for Legal is live now - and it's a marketplace with DOZENS of agents trained on legal roles.\n\nReview agents, policy drafters, NDA agents &amp; much more.\n\nCan't believe this is public.\n\nhttps://t.co/EyPkD2wMWv https://t.co/EbOW0yEU5G", "summary": "Miles Deutscher anuncia el lanzamiento de Claude for Legal, un marketplace de Anthropic con decenas de agentes de IA especializados en roles legales como revisión de documentos, redacción de políticas y NDAs.", "topic": "IA & Machine Learning", "tags": ["claude-for-legal", "anthropic", "agentes-ia", "legaltech"], "author_handle": "milesdeutscher", "author_name": "Miles Deutscher", "created_at": "2026-05-13T21:41:18.000Z", "metrics": {"bookmarks": 3490, "likes": 2293, "quotes": 30, "replies": 116, "retweets": 301, "views": 404768}}, {"id": "2054770955726258352", "url": "https://x.com/_vmlops/status/2054770955726258352", "text": "100 Secret\rCodes for\rClaude\n\nhttps://t.co/IJctEu3UiE https://t.co/h5Kp7s4rG1", "summary": "Comparte un documento de Google Drive con '100 códigos secretos' (presumiblemente trucos o prompts) para usar con Claude.", "topic": "IA & Machine Learning", "tags": ["claude", "prompts", "trucos", "recursos"], "author_handle": "_vmlops", "author_name": "Vaishnavi", "created_at": "2026-05-14T03:49:06.000Z", "metrics": {"bookmarks": 50, "likes": 56, "quotes": 1, "replies": 0, "retweets": 7, "views": 2558}}, {"id": "2054794044426101245", "url": "https://x.com/sqs/status/2054794044426101245", "text": "Most people have Amp installed directly, and that's what we recommend. But if you've installed Amp via npm, the package now contains a precompiled executable, not sources. This makes Amp faster and Amp plugins better supported across platforms.\n\nhttps://t.co/JcuZyO3X3J https://t.co/otERQZ87TK", "summary": "Quinn Slack anuncia que el paquete npm de Amp ahora incluye un ejecutable precompilado en lugar del código fuente, lo que lo hace más rápido y mejora el soporte de sus plugins entre plataformas.", "topic": "Programación & Dev", "tags": ["amp", "npm", "cli-tools", "distribucion-de-software"], "author_handle": "sqs", "author_name": "Quinn Slack", "created_at": "2026-05-14T05:20:51.000Z", "metrics": {"bookmarks": 20, "likes": 103, "quotes": 0, "replies": 6, "retweets": 8, "views": 9590}}, {"id": "2054901152840344051", "url": "https://x.com/tom_doerr/status/2054901152840344051", "text": "Automates YouTube content creation and publishing with AI agents\n\nhttps://t.co/unzY1U0czw https://t.co/qJndnmvAgn", "summary": "Comparte un proyecto de GitHub que automatiza la creación y publicación de contenido en YouTube mediante agentes de IA.", "topic": "IA & Machine Learning", "tags": ["youtube", "automatizacion", "agentes-ia", "contenido", "open-source"], "author_handle": "tom_doerr", "author_name": "Tom Dörr", "created_at": "2026-05-14T12:26:27.000Z", "metrics": {"bookmarks": 2219, "likes": 1505, "quotes": 3, "replies": 11, "retweets": 199, "views": 83083}}, {"id": "2054917184158318628", "url": "https://x.com/GitHub_Daily/status/2054917184158318628", "text": "用 Claude Code 开发项目，代码库一大，每次探索代码结构都要扫一堆文件，工具调用多、速度慢，token 也跟着烧。\n\n于是找到 CodeGraph 这个开源工具，给代码库预建一张语义知识图谱，让 Claude Code 直接查图而不是逐文件扫描。\n\n效果颇为明显，工具调用减少 92%，探索速度提升 71%，像 VS Code 这种大型项目也能在十几秒内完成代码溯源。\n\nGitHub：https://t.co/Nr6OYyxn9i\n\n它能自动识别函数调用链、类继承、模块引用等关系，还能在修改代码前分析影响范围，避免改一处坏一片。\n\n支持 19 种编程语言，还能识别 Django、Express、Spring 等 13 个框架的路由映射。\n\n所有数据存在本地，不需要任何外部服务。一条命令安装，文件保存后自动同步图谱，基本不用额外操心。\n\n如果你的项目代码量不小，又经常用 Claude Code 做代码探索和重构，装上能省不少时间和 token。", "summary": "Presenta CodeGraph, una herramienta open source que construye un grafo de conocimiento semántico del código para que Claude Code consulte la estructura del proyecto en lugar de escanear archivo por archivo, reduciendo un 92% las llamadas a herramientas y acelerando la exploración un 71%.", "topic": "Programación & Dev", "tags": ["codegraph", "claude-code", "knowledge-graph", "code-exploration"], "author_handle": "GitHub_Daily", "author_name": "GitHubDaily", "created_at": "2026-05-14T13:30:09.000Z", "metrics": {"bookmarks": 978, "likes": 676, "quotes": 7, "replies": 40, "retweets": 142, "views": 68301}}, {"id": "2054922772573303293", "url": "https://x.com/mattpocockuk/status/2054922772573303293", "text": "/improve-codebase-architecture will soon output HTML\n\nThis rocks, thanks @trq212 https://t.co/RJWh0RCuW8", "summary": "Matt Pocock anuncia que su skill '/improve-codebase-architecture' pronto generará salida en HTML, agradeciendo la contribución de @trq212.", "topic": "Programación & Dev", "tags": ["matt-pocock", "claude-skills", "arquitectura-de-software", "herramientas"], "author_handle": "mattpocockuk", "author_name": "Matt Pocock", "created_at": "2026-05-14T13:52:22.000Z", "metrics": {"bookmarks": 1484, "likes": 2232, "quotes": 7, "replies": 67, "retweets": 70, "views": 120394}}, {"id": "2054941901900611787", "url": "https://x.com/AnthropicAI/status/2054941901900611787", "text": "We’re partnering with the Gates Foundation, committing $200 million in grants, Claude credits, and technical support to programs in global health, life sciences, education, agriculture, and economic mobility.\n\nRead more: https://t.co/eqCrLKtNCq", "summary": "Anthropic anuncia una alianza con la Fundación Gates, comprometiendo 200 millones de dólares en subvenciones, créditos de Claude y soporte técnico para programas de salud global, ciencias de la vida, educación, agricultura y movilidad económica.", "topic": "IA & Machine Learning", "tags": ["anthropic", "gates-foundation", "filantropia", "salud-global"], "author_handle": "AnthropicAI", "author_name": "Anthropic", "created_at": "2026-05-14T15:08:23.000Z", "metrics": {"bookmarks": 488, "likes": 2856, "quotes": 125, "replies": 446, "retweets": 263, "views": 324616}}, {"id": "2054943138570027402", "url": "https://x.com/martinfowler/status/2054943138570027402", "text": "NEW POST\n\nWhen I need to feed an LLM a lot of context, I can write it myself, or I can get an LLM to interview me for it.\n\nhttps://t.co/n0IavQLGGZ", "summary": "Martin Fowler describe, en su nuevo artículo sobre 'Interrogatory LLM', la técnica de dejar que un LLM te entreviste para extraer el contexto necesario en lugar de escribirlo todo manualmente.", "topic": "IA & Machine Learning", "tags": ["llm", "prompt-engineering", "martin-fowler", "contexto"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-05-14T15:13:17.000Z", "metrics": {"bookmarks": 374, "likes": 331, "quotes": 3, "replies": 8, "retweets": 25, "views": 83673}}, {"id": "2054944276094620027", "url": "https://x.com/vladikk/status/2054944276094620027", "text": "Principles > Ceremony \n\nWhen I wrote Learning Domain-Driven Design, I made a deliberate choice: instead of pages of code listings, I focused on the principles behind the tactical patterns. I wanted to make sure the reader understands why only one instance of an aggregate participates in a transaction, why value objects must be immutable, and the rationale behind other tactical patterns. 🧵 1/3", "summary": "Vlad Khononov explica que en su libro 'Learning Domain-Driven Design' priorizó los principios sobre los listados de código, para que el lector entienda el porqué de patrones tácticos como los value objects inmutables.", "topic": "Programación & Dev", "tags": ["domain-driven-design", "arquitectura-de-software", "libro", "value-objects"], "author_handle": "vladikk", "author_name": "Vlad Khononov", "created_at": "2026-05-14T15:17:49.000Z", "metrics": {"bookmarks": 14, "likes": 23, "quotes": 0, "replies": 1, "retweets": 4, "views": 19131}}, {"id": "2054985100350062750", "url": "https://x.com/ghumare64/status/2054985100350062750", "text": "This is Insane.\n\nI just gave my agents infinite memory.\n\nYour coding agent remembers everything. No more re-explaining.\n\nNo. 1 Persistent memory for Claude Code, Cursor, Gemini CLI, Codex CLI, Hermes, OpenClaw, pi, OpenCode, and any MCP client.\nhttps://t.co/xtL6kMjVul", "summary": "Anuncia una herramienta de memoria persistente para agentes de codificación (Claude Code, Cursor, Gemini CLI, Codex CLI, Hermes, OpenCode y cualquier cliente MCP) para que no haya que volver a explicar el contexto.", "topic": "IA & Machine Learning", "tags": ["memoria-persistente", "agentes-ia", "mcp", "open-source"], "author_handle": "ghumare64", "author_name": "Rohit Ghumare", "created_at": "2026-05-14T18:00:02.000Z", "metrics": {"bookmarks": 128, "likes": 99, "quotes": 0, "replies": 13, "retweets": 11, "views": 7112}}, {"id": "2054987444664377374", "url": "https://x.com/AnthropicAI/status/2054987444664377374", "text": "We've published a paper that explains our views on AI competition between the US and China.\n\nThe US and democratic allies hold the lead in frontier AI today. Read more on what it’ll take to keep that lead: https://t.co/TgJBeodWYK", "summary": "Anthropic publica un paper sobre la competencia en IA entre EE.UU. y China, argumentando que EE.UU. y sus aliados democráticos mantienen la delantera en IA de frontera y explicando qué hace falta para conservarla.", "topic": "Política & Actualidad", "tags": ["ai-policy", "geopolitics", "us-china", "anthropic"], "author_handle": "AnthropicAI", "author_name": "Anthropic", "created_at": "2026-05-14T18:09:21.000Z", "metrics": {"bookmarks": 4341, "likes": 5972, "quotes": 798, "replies": 1252, "retweets": 1044, "views": 5022560}}, {"id": "2055010246289133959", "url": "https://x.com/rseroter/status/2055010246289133959", "text": "An Engineer’s Guide to Better AI Skills: Implementing a Testing Process to Optimize Agent Performance in Any Repository or Skill https://t.co/BU6F49L9Ak &lt; from the Pinterest engineering team, with a couple of interesting takeaways", "summary": "Richard Seroter comparte un artículo del equipo de ingeniería de Pinterest sobre cómo implementar un proceso de pruebas para optimizar el rendimiento de los agentes de IA con 'skills' en cualquier repositorio.", "topic": "IA & Machine Learning", "tags": ["ai-skills", "testing", "pinterest", "agent-performance", "ingenieria"], "author_handle": "rseroter", "author_name": "Richard Seroter", "created_at": "2026-05-14T19:39:57.000Z", "metrics": {"bookmarks": 105, "likes": 98, "quotes": 0, "replies": 0, "retweets": 12, "views": 8214}}, {"id": "2055015466054410400", "url": "https://x.com/danshipper/status/2055015466054410400", "text": "when people ask me how to get their org agent-pilled i always say the same thing:\n\nthe #1 leading indicator is whether their leadership team personally uses Codex, Claude Code or Cowork day to day. \n\nthat’s why over the last few months we’ve been working privately with leadership teams of the top companies in tech, helping them get their hands deep into Claude Code, Cowork, Codex and more. \n\nif you want @every to come and get your exec team agent-pilled, we’re opening up a few slots:\n\nhttps://t.co/o8g3c1xKYr", "summary": "Dan Shipper afirma que el mejor indicador de si una organización adopta la IA es que su equipo directivo use personalmente Codex, Claude Code o Cowork, y anuncia que su empresa Every abre cupos de consultoría para ayudar a equipos ejecutivos a adoptar estas herramientas.", "topic": "IA & Machine Learning", "tags": ["claude-code", "codex", "adopcion-de-ia", "consultoria", "liderazgo"], "author_handle": "danshipper", "author_name": "Dan Shipper 📧", "created_at": "2026-05-14T20:00:42.000Z", "metrics": {"bookmarks": 61, "likes": 83, "quotes": 8, "replies": 11, "retweets": 7, "views": 27901}}, {"id": "2055044413508694196", "url": "https://x.com/martinfowler/status/2055044413508694196", "text": "Fragments: thoughts from a software development retreat, would I be a writer without text editors, use LLMs as functions, don't use LLM skills, is the future of everything lies?\n\nhttps://t.co/M1V3vOytjR", "summary": "Martin Fowler publica una colección de reflexiones breves ('Fragments') sobre un retiro de desarrollo de software, el uso de los LLM como funciones y si el futuro será todo mentiras.", "topic": "Programación & Dev", "tags": ["martin-fowler", "llm", "reflexiones", "ensayo"], "author_handle": "martinfowler", "author_name": "Martin Fowler", "created_at": "2026-05-14T21:55:43.000Z", "metrics": {"bookmarks": 89, "likes": 99, "quotes": 2, "replies": 2, "retweets": 12, "views": 16215}}, {"id": "2055887618303570151", "url": "https://x.com/_vmlops/status/2055887618303570151", "text": "This is the best site on the internet to learn harness engineering\n\nhttps://t.co/n8bV1yKSTS https://t.co/dCc1Q4LHCr", "summary": "Vaishnavi recomienda un sitio web como el mejor recurso en internet para aprender 'harness engineering' de agentes de IA.", "topic": "IA & Machine Learning", "tags": ["harness-engineering", "recursos-de-aprendizaje", "agentes-ia"], "author_handle": "_vmlops", "author_name": "Vaishnavi", "created_at": "2026-05-17T05:46:19.000Z", "metrics": {"bookmarks": 7332, "likes": 4024, "quotes": 8, "replies": 38, "retweets": 428, "views": 305103}}, {"id": "2056010598689751405", "url": "https://x.com/plainionist/status/2056010598689751405", "text": "If you think code no longer matters,\nread this 👇😉\n\nhttps://t.co/ak6Vs54KtB", "summary": "Recomienda leer un artículo de Martin Fowler sobre qué es realmente el código, dirigido a quienes creen que el código ya no importa.", "topic": "Programación & Dev", "tags": ["martin-fowler", "codigo", "filosofia-de-programacion"], "author_handle": "plainionist", "author_name": "Seb", "created_at": "2026-05-17T13:55:00.000Z", "metrics": {"bookmarks": 210, "likes": 164, "quotes": 2, "replies": 7, "retweets": 15, "views": 23581}}, {"id": "2056078124346228860", "url": "https://x.com/addyosmani/status/2056078124346228860", "text": "https://t.co/jKCIAEzai7", "summary": "Enlace a un artículo
