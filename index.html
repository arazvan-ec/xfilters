<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xfilters · Marcadores de X</title>
<style>
  :root{
    --bg:#0f141a; --card:#161f29; --card-h:#1c2732; --border:#2a3640;
    --txt:#e7e9ea; --muted:#8b98a5; --accent:#1d9bf0; --accent-d:#0f6fbf;
    --chip:#1c2732; --chip-on:#1d9bf0; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header{position:sticky;top:0;z-index:20;background:rgba(15,20,26,.85);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .top{display:flex;align-items:center;gap:14px;padding:16px 0}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .logo .mk{width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:grid;place-items:center;font-size:16px}
  .meta{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
  .meta b{color:var(--txt)}

  .controls{padding:0 0 14px}
  .searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
  select,.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--txt);font-size:14px;cursor:pointer;outline:none}
  .btn:hover{background:var(--card-h)}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
    background:var(--chip);border:1px solid var(--border);color:var(--txt);
    font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
  .chip .n{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.14)}
  .chip.on .n{background:rgba(255,255,255,.28)}

  main{padding:18px 0 60px}
  .count{color:var(--muted);font-size:13px;margin:2px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:10px;transition:.12s}
  .card:hover{border-color:#3b4a57;transform:translateY(-2px)}
  .chead{display:flex;align-items:center;gap:10px}
  .av{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .who{min-width:0}
  .who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .hd{color:var(--muted);font-size:13px}
  .cat{margin-left:auto;flex:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;
    background:rgba(29,155,240,.15);color:#8ecdf8;border:1px solid rgba(29,155,240,.35);cursor:pointer;white-space:nowrap}
  .txt{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .txt .tag,.txt .men{color:var(--accent)}
  .media{display:flex;gap:6px;flex-wrap:wrap}
  .media img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
  .badge{font-size:12px;color:var(--muted);background:var(--chip);border:1px solid var(--border);
    border-radius:8px;padding:4px 9px;display:inline-flex;gap:6px;align-items:center}
  .foot{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;
    border-top:1px solid var(--border);padding-top:10px;margin-top:auto;flex-wrap:wrap}
  .foot .m{display:inline-flex;gap:5px;align-items:center}
  .foot .sp{margin-left:auto}
  .dom{background:var(--chip);border:1px solid var(--border);border-radius:8px;padding:3px 8px}

  .empty{text-align:center;color:var(--muted);padding:70px 20px}
  .empty h2{color:var(--txt);margin:0 0 8px}
  .filedrop{border:1.5px dashed var(--border);border-radius:12px;padding:16px;margin-top:16px;
    display:inline-block;cursor:pointer}
  .filedrop:hover{border-color:var(--accent)}
  code{background:#0b1016;border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:13px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}.meta{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><span class="mk">🔖</span> xfilters</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="controls">
      <div class="searchrow">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Buscar en texto, autor, hashtags, dominio…" />
        </label>
        <select id="sort">
          <option value="recent">Más recientes</option>
          <option value="old">Más antiguos</option>
          <option value="likes">Más gustados</option>
          <option value="bookmarks">Más guardados</option>
          <option value="views">Más vistos</option>
        </select>
        <button class="btn" id="loadBtn" title="Cargar otro bookmarks.json">📂 Cargar JSON</button>
        <input id="file" type="file" accept="application/json,.json" hidden />
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<!-- Data generated by scripts/enrich.mjs. Loaded as a plain script so the page
     also works when opened directly from disk (file://). -->
<script src="data/bookmarks.js"></script>
<script>
(function(){
  "use strict";
  const $ = (s)=>document.querySelector(s);
  const state = { bookmarks:[], cats:[], selected:new Set(), q:"", sort:"recent" };

  function normalize(payload){
    let list = [];
    if (Array.isArray(payload)) list = payload;
    else if (payload && Array.isArray(payload.bookmarks)) list = payload.bookmarks;
    // ensure a category exists
    list.forEach(b=>{ if(!b.category) b.category = (b.tags&&b.tags[0]) || "Sin categoría"; });
    return list;
  }

  function computeCats(list){
    const m = new Map();
    for(const b of list) m.set(b.category, (m.get(b.category)||0)+1);
    return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
  }

  const esc = (s)=>(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function linkify(text){
    let s = esc(text);
    s = s.replace(/(https?:\/\/[^\s]+)/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'')}</a>`);
    s = s.replace(/(^|\s)#([\wÁÉÍÓÚÜÑáéíóúüñ]+)/g, (_,p,t)=>`${p}<span class="tag">#${t}</span>`);
    s = s.replace(/(^|\s)@(\w+)/g, (_,p,t)=>`${p}<a class="men" href="https://x.com/${t}" target="_blank" rel="noopener">@${t}</a>`);
    return s;
  }
  const initials = (name,handle)=>{
    const base=(name||handle||"?").trim();
    const parts=base.split(/\s+/).slice(0,2);
    return parts.map(p=>p[0]).join("").toUpperCase() || "?";
  };
  const fmt = (n)=>{ n=Number(n)||0;
    if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+"M";
    if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+"K";
    return String(n); };
  const dateStr = (iso)=>{ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return "";
    return d.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}); };

  function renderChips(){
    const total = state.bookmarks.length;
    const chips = [`<span class="chip ${state.selected.size===0?'on':''}" data-cat="__all__">Todas <span class="n">${total}</span></span>`];
    for(const c of state.cats){
      chips.push(`<span class="chip ${state.selected.has(c.name)?'on':''}" data-cat="${esc(c.name)}">${esc(c.name)} <span class="n">${c.count}</span></span>`);
    }
    $("#chips").innerHTML = chips.join("");
    $("#chips").querySelectorAll(".chip").forEach(el=>{
      el.addEventListener("click",()=>{
        const cat = el.getAttribute("data-cat");
        if(cat==="__all__"){ state.selected.clear(); }
        else if(state.selected.has(cat)){ state.selected.delete(cat); }
        else { state.selected.add(cat); }
        renderChips(); renderGrid();
      });
    });
  }

  function passes(b){
    if(state.selected.size && !state.selected.has(b.category)) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      const hay=[b.text,b.author&&b.author.name,b.author&&b.author.handle,(b.hashtags||[]).join(" "),b.domain,b.category].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }
  function sortFn(a,b){
    switch(state.sort){
      case "old": return (a.created_at||"").localeCompare(b.created_at||"");
      case "likes": return (b.metrics?.likes||0)-(a.metrics?.likes||0);
      case "bookmarks": return (b.metrics?.bookmarks||0)-(a.metrics?.bookmarks||0);
      case "views": return (b.metrics?.views||0)-(a.metrics?.views||0);
      default: return (b.created_at||"").localeCompare(a.created_at||"");
    }
  }

  function mediaHtml(b){
    if(!b.media || !b.media.length) return "";
    const withThumb = b.media.filter(m=>m.thumb);
    if(withThumb.length){
      return `<div class="media">${withThumb.slice(0,4).map(m=>
        `<img loading="lazy" src="${esc(m.thumb)}" alt="" onerror="this.remove()">`).join("")}</div>`;
    }
    const kinds = b.media.reduce((a,m)=>{a[m.type]=(a[m.type]||0)+1;return a;},{});
    const ic={photo:"🖼",video:"🎞",animated_gif:"🎞"};
    return `<div class="media">${Object.entries(kinds).map(([t,n])=>
      `<span class="badge">${ic[t]||"📎"} ${n} ${t==='photo'?'imagen'+(n>1?'es':''):t}</span>`).join("")}</div>`;
  }

  function cardHtml(b){
    const av = b.author&&b.author.avatar
      ? `<img class="av" src="${esc(b.author.avatar)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'av',textContent:'${initials(b.author.name,b.author.handle)}'}))">`
      : `<div class="av">${initials(b.author&&b.author.name,b.author&&b.author.handle)}</div>`;
    const m=b.metrics||{};
    return `<article class="card">
      <div class="chead">
        ${av}
        <div class="who">
          <div class="nm">${esc(b.author&&b.author.name||"—")}</div>
          <div class="hd">@${esc(b.author&&b.author.handle||"")} · ${dateStr(b.created_at)}</div>
        </div>
        <span class="cat" data-cat="${esc(b.category)}">${esc(b.category)}</span>
      </div>
      <div class="txt">${linkify(b.text)}</div>
      ${mediaHtml(b)}
      <div class="foot">
        <span class="m">❤ ${fmt(m.likes)}</span>
        <span class="m">🔁 ${fmt(m.retweets)}</span>
        <span class="m">🔖 ${fmt(m.bookmarks)}</span>
        <span class="m">👁 ${fmt(m.views)}</span>
        ${b.domain?`<span class="dom">${esc(b.domain)}</span>`:""}
        <a class="sp" href="${esc(b.url)}" target="_blank" rel="noopener">Ver en X ↗</a>
      </div>
    </article>`;
  }

  function renderGrid(){
    const list = state.bookmarks.filter(passes).sort(sortFn);
    const grid=$("#grid"), empty=$("#empty");
    $("#count").textContent = `${list.length} de ${state.bookmarks.length} marcadores`;
    if(!list.length){
      grid.innerHTML=""; empty.hidden=false;
      empty.innerHTML = state.bookmarks.length
        ? `<h2>Sin resultados</h2><p>Prueba con otra categoría o búsqueda.</p>`
        : emptyStateHtml();
      return;
    }
    empty.hidden=true;
    grid.innerHTML = list.map(cardHtml).join("");
    grid.querySelectorAll(".cat").forEach(el=>el.addEventListener("click",()=>{
      const c=el.getAttribute("data-cat"); state.selected=new Set([c]); renderChips(); renderGrid();
      window.scrollTo({top:0,behavior:"smooth"});
    }));
  }

  function emptyStateHtml(){
    return `<h2>No hay marcadores cargados todavía</h2>
      <p>Usa la extensión de <code>extension/</code> para capturar tus marcadores de X,<br>
      guarda el JSON en <code>data/raw-bookmarks.json</code> y ejecuta:</p>
      <p><code>node scripts/enrich.mjs</code></p>
      <p>…o carga un archivo directamente:</p>
      <div class="filedrop" id="drop2">📂 Elegir bookmarks.json</div>`;
  }

  function setData(payload){
    state.bookmarks = normalize(payload);
    state.cats = computeCats(state.bookmarks);
    state.selected.clear();
    const meta = (payload && payload.generated_at)
      ? `<b>${state.bookmarks.length}</b> marcadores · generado ${dateStr(payload.generated_at)}`
      : `<b>${state.bookmarks.length}</b> marcadores`;
    $("#meta").innerHTML = meta;
    renderChips(); renderGrid();
    const d2=$("#drop2"); if(d2) d2.addEventListener("click",()=>$("#file").click());
  }

  // events
  $("#q").addEventListener("input",e=>{state.q=e.target.value.trim();renderGrid();});
  $("#sort").addEventListener("change",e=>{state.sort=e.target.value;renderGrid();});
  $("#loadBtn").addEventListener("click",()=>$("#file").click());
  $("#file").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ setData(JSON.parse(r.result)); }catch(err){ alert("JSON inválido: "+err.message); } };
    r.readAsText(f);
  });

  // initial load
  if(window.__XFILTERS__) setData(window.__XFILTERS__);
  else setData([]);
})();
</script>
</body>
</html>
